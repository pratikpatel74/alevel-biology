id: "3.7a"
order: 25
section: "3.7"
spec: "3.7.1"
title: "Inheritance"
desc: "Genotype and phenotype, monohybrid and dihybrid crosses, codominance and multiple alleles, sex linkage, autosomal linkage, epistasis and the chi-squared test."
practicals: []
summary:
  - h: "Key terms"
    p:
      - "**Genotype**: the genetic constitution of an organism. **Phenotype**: the expression of the genotype and its interaction with the environment."
      - "**Alleles** are different versions of the same gene, at the same locus. Diploid organisms have **two alleles** of each gene."
      - "**Homozygous**: two identical alleles. **Heterozygous**: two different alleles."
      - "**Dominant**: always expressed in the phenotype. **Recessive**: only expressed when two copies are present (homozygous)."
      - "**Codominant**: both alleles are expressed in the heterozygote, e.g. red and white flowers giving roan or pink."
      - "**Multiple alleles**: more than two alleles exist for a gene, e.g. ABO blood groups (Iᴬ and Iᴮ codominant, Iᴼ recessive)."
  - h: "Monohybrid and dihybrid crosses"
    p:
      - "**Monohybrid**: one gene. Heterozygous × heterozygous gives a **3:1** phenotypic ratio (dominant:recessive)."
      - "**Dihybrid**: two genes on different chromosomes. Heterozygous for both × heterozygous for both gives **9:3:3:1**."
      - "Use **genetic diagrams**: parental phenotypes, parental genotypes, gametes, Punnett square, offspring genotypes and phenotypes, ratio."
  - h: "Sex linkage"
    p:
      - "Genes on the **X chromosome** are **sex-linked**. Males (XY) have only **one copy**, so a recessive X-linked allele is always expressed."
      - "Examples: haemophilia, red-green colour blindness. These are far more common in males."
      - "Write X-linked alleles as superscripts, e.g. Xᴴ and Xʰ."
  - h: "Autosomal linkage"
    p:
      - "Two genes on the **same autosome** are **linked**, so they tend to be inherited together."
      - "Offspring ratios differ from 9:3:3:1, with **more parental combinations** than expected."
      - "**Recombinants** (new combinations) are produced only when **crossing over** happens between the two loci. The further apart the genes, the more recombinants."
  - h: "Epistasis"
    p:
      - "**Epistasis**: the allele of one gene **affects or masks** the expression of another gene."
      - "This gives modified dihybrid ratios, e.g. **9:3:4** (recessive epistasis) or **12:3:1** (dominant epistasis)."
  - h: "Chi-squared test"
    p:
      - "Tests whether the difference between **observed** and **expected** results is **significant**, or just due to chance."
      - "`χ² = Σ (O − E)² ÷ E`"
      - "**Null hypothesis**: there is no significant difference between observed and expected results."
      - "Degrees of freedom = number of categories − 1. Compare χ² with the **critical value** at **p = 0.05**."
      - "If χ² is **greater than** the critical value, **reject** the null hypothesis: the difference is significant (e.g. genes may be linked)."
pitfalls:
  - "Always write the **gametes** in a genetic diagram, with circles. Examiners award marks for them."
  - "A χ² value **smaller** than the critical value means you **accept** the null hypothesis."
  - "Fathers can't pass X-linked alleles to **sons**: sons get the Y from their father."
  - "More parental types than expected suggests **autosomal linkage**. Odd ratios like 9:3:4 suggest **epistasis**."
questions:
  - q: "What is a phenotype?"
    o: ["The alleles an organism has", "The expression of the genotype and its interaction with the environment", "The position of a gene", "A type of mutation"]
    a: 1
    e: "Phenotype is the observable characteristics, which depend on genotype and environment."
  - q: "What is meant by heterozygous?"
    o: ["Having two different alleles of a gene", "Having two identical alleles", "Having only one allele", "Having no alleles"]
    a: 0
    e: "A heterozygous organism carries two different alleles for a gene, e.g. Aa."
  - q: "Two heterozygous pea plants (Tt) are crossed. Tall is dominant. What is the expected ratio of tall to short?"
    o: ["1:1", "1:2:1", "3:1", "9:3:3:1"]
    a: 2
    e: "Tt × Tt gives TT, Tt, Tt, tt. Three have a T allele (tall) and one is tt (short), so 3:1."
  - q: "What is codominance?"
    o: ["One allele masks the other", "Genes on the same chromosome", "One gene masks another gene", "Both alleles are expressed in the phenotype of a heterozygote"]
    a: 3
    e: "With codominance, neither allele is recessive, so both are expressed, e.g. roan cattle with red and white hairs."
  - q: "A person with blood group AB has which genotype?"
    o: ["IᴬIᴮ", "IᴬIᴼ", "IᴮIᴼ", "IᴼIᴼ"]
    a: 0
    e: "Iᴬ and Iᴮ are codominant, so a person with both has blood group AB."
  - q: "Parents with genotypes IᴬIᴼ and IᴮIᴼ have a child. What is the probability the child has blood group O?"
    o: ["0", "0.25", "0.5", "0.75"]
    a: 1
    e: "Possible offspring: IᴬIᴮ, IᴬIᴼ, IᴮIᴼ, IᴼIᴼ. One in four is IᴼIᴼ, so 0.25."
  - q: "Two parents heterozygous for two unlinked genes (AaBb × AaBb) are crossed. What is the expected phenotypic ratio?"
    o: ["3:1", "1:1:1:1", "9:3:3:1", "9:3:4"]
    a: 2
    e: "For two unlinked genes, a dihybrid cross of double heterozygotes gives 9:3:3:1."
  - q: "Why are sex-linked recessive conditions more common in males?"
    o: ["Males have two X chromosomes", "The Y chromosome carries the dominant allele", "Females can't inherit them", "Males have only one X chromosome, so a single recessive allele is expressed"]
    a: 3
    e: "There is no second X in males to carry a dominant allele that could mask the recessive one."
  - q: "A carrier mother (XᴴXʰ) and an unaffected father (XᴴY) have a son. What is the probability he has haemophilia?"
    o: ["0.5", "0.25", "0", "1"]
    a: 0
    e: "A son gets Y from his father and one X from his mother. Half her X chromosomes carry Xʰ, so the probability is 0.5."
  - q: "Can an affected father pass an X-linked condition to his son?"
    o: ["Yes, always", "No, because the son receives the father's Y chromosome", "Only if the mother is a carrier", "Yes, half the time"]
    a: 1
    e: "Sons inherit their X from their mother. Fathers pass their Y to sons."
  - q: "What is autosomal linkage?"
    o: ["Genes on the X chromosome", "Alleles that are codominant", "Two genes on the same autosome, tending to be inherited together", "One gene masking another"]
    a: 2
    e: "Genes close together on the same non-sex chromosome are usually inherited together unless crossing over separates them."
  - q: "In a dihybrid cross, there are far more parental phenotypes than expected from 9:3:3:1. What is the most likely explanation?"
    o: ["Epistasis", "Codominance", "Sex linkage", "The two genes are linked on the same autosome"]
    a: 3
    e: "Linked genes stay together, so parental combinations are more common. Recombinants appear only after crossing over."
  - q: "How are recombinant offspring produced when genes are linked?"
    o: ["By crossing over between the two loci during meiosis", "By independent segregation", "By mutation", "By codominance"]
    a: 0
    e: "Crossing over in prophase I can separate linked alleles, creating new combinations."
  - q: "What is epistasis?"
    o: ["Two genes on the same chromosome", "The allele of one gene affects or masks the expression of another gene", "Both alleles being expressed", "An allele on the X chromosome"]
    a: 1
    e: "In epistasis, one gene controls whether another gene is expressed, changing the expected ratios."
  - q: "A dihybrid cross gives a ratio of 9:3:4. What does this suggest?"
    o: ["Autosomal linkage", "Sex linkage", "Epistasis", "Codominance"]
    a: 2
    e: "9:3:4 is a typical ratio for recessive epistasis, where a homozygous recessive genotype at one gene masks the other gene."
  - q: "What is the formula for the chi-squared test?"
    o: ["χ² = Σ (E − O) ÷ O", "χ² = Σ O ÷ E", "χ² = (O + E)²", "χ² = Σ (O − E)² ÷ E"]
    a: 3
    e: "For each category, square the difference between observed and expected, divide by expected, then add them up."
  - q: "What is the null hypothesis in a chi-squared test of a genetic cross?"
    o: ["There is no significant difference between observed and expected results", "The results are significant", "The genes are linked", "The sample is too small"]
    a: 0
    e: "The null hypothesis assumes any difference is due to chance."
  - q: "A cross has 4 phenotype categories. How many degrees of freedom?"
    o: ["4", "3", "2", "5"]
    a: 1
    e: "Degrees of freedom = number of categories − 1 = 4 − 1 = 3."
  - q: "χ² = 2.1 and the critical value at p = 0.05 is 7.82. What do you conclude?"
    o: ["Reject the null hypothesis; the difference is significant", "The genes are definitely linked", "Accept the null hypothesis; the difference is not significant and is due to chance", "The test is invalid"]
    a: 2
    e: "χ² is less than the critical value, so the difference is likely due to chance."
  - q: "Observed: 70 purple, 30 white. Expected 3:1 from 100 offspring. What is χ²?"
    o: ["5.00", "0.67", "0.33", "1.33"]
    a: 3
    e: "Expected: 75 purple, 25 white. (70−75)²/75 = 0.33. (30−25)²/25 = 1.00. χ² = 1.33."
  - q: "What is a genotype?"
    o: ["The genetic constitution of an organism", "The appearance of an organism", "Its environment", "Its chromosome number"]
    a: 0
    e: "Genotype is the combination of alleles an organism has, e.g. Aa."
  - q: "A test cross of a dominant-phenotype organism with a homozygous recessive gives some recessive offspring. What is the dominant parent's genotype?"
    o: ["Homozygous dominant", "Heterozygous", "Homozygous recessive", "Cannot be determined"]
    a: 1
    e: "Recessive offspring need a recessive allele from each parent, so the dominant-looking parent must be heterozygous."
