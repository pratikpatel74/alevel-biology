<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 268"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><rect x="10" y="20" width="460" height="50" rx="8" class="at"/><text x="240" y="41" class="ta" text-anchor="middle" font-size="14">Totipotent</text><text x="240" y="59" class="tm" text-anchor="middle" font-size="11">zygote, very early embryo → any cell, including placenta</text><rect x="33" y="82" width="414" height="50" rx="8" class="bx"/><text x="240" y="103" text-anchor="middle" font-size="14">Pluripotent</text><text x="240" y="121" class="tm" text-anchor="middle" font-size="11">embryo → almost any body cell</text><rect x="56" y="144" width="368" height="50" rx="8" class="bx"/><text x="240" y="165" text-anchor="middle" font-size="14">Multipotent</text><text x="240" y="183" class="tm" text-anchor="middle" font-size="11">adult, e.g. bone marrow → a few related types</text><rect x="79" y="206" width="322" height="50" rx="8" class="bx"/><text x="240" y="227" text-anchor="middle" font-size="14">Unipotent</text><text x="240" y="245" class="tm" text-anchor="middle" font-size="11">adult tissue → one type, e.g. cardiomyocytes</text></svg>
