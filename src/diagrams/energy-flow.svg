<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 234"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><rect x="20" y="40" width="120" height="50" rx="6" class="at"/><text x="80" y="62" class="ta" text-anchor="middle" font-size="15">GPP</text><text x="80" y="80" class="tm" text-anchor="middle" font-size="12">producers</text><line x1="140" y1="65" x2="200" y2="65" class="ln" marker-end="url(#ah)"/><rect x="200" y="40" width="100" height="50" rx="6" class="at"/><text x="250" y="70" class="ta" text-anchor="middle" font-size="15">NPP</text><line x1="80" y1="90" x2="80" y2="130" class="lm" marker-end="url(#am)"/><text x="80" y="146" class="tm" text-anchor="middle" font-size="12">R (respiration)</text><line x1="300" y1="65" x2="350" y2="65" class="ln" marker-end="url(#ah)"/><text x="325" y="56" text-anchor="middle" font-size="14">I</text><rect x="350" y="40" width="110" height="50" rx="6" class="bx"/><text x="405" y="62" text-anchor="middle" font-size="13">consumer</text><text x="405" y="80" class="tm" text-anchor="middle" font-size="12">N = I − (F + R)</text><line x1="380" y1="90" x2="380" y2="130" class="lm" marker-end="url(#am)"/><text x="380" y="146" class="tm" text-anchor="middle" font-size="12">F (faeces, urine)</text><line x1="440" y1="90" x2="440" y2="170" class="lm" marker-end="url(#am)"/><text x="440" y="186" class="tm" text-anchor="end" font-size="12">R (heat)</text><line x1="250" y1="90" x2="250" y2="170" class="lm" marker-end="url(#am)"/><text x="250" y="186" class="tm" text-anchor="middle" font-size="12">not eaten (roots, bark)</text><text x="240" y="222" text-anchor="middle" font-size="14">NPP = GPP − R</text></svg>
