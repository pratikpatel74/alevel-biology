<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><path d="M140,150 L140,40 A110,110 0 0 1 210.7,234.3 Z" class="at"/><path d="M140,150 L210.7,234.3 A110,110 0 0 1 55.7,220.7 Z" class="gt"/><path d="M140,150 L55.7,220.7 A110,110 0 0 1 55.7,79.3 Z" class="at"/><path d="M140,150 L55.7,79.3 A110,110 0 0 1 120.9,41.7 Z" class="nt"/><path d="M140,150 L120.9,41.7 A110,110 0 0 1 140,40 Z" class="nt"/><text x="205.8" y="131.1" class="ta" text-anchor="middle" font-size="14">G1</text><text x="133.9" y="224.7" class="tg" text-anchor="middle" font-size="14">S</text><text x="70" y="155" class="ta" text-anchor="middle" font-size="14">G2</text><text x="76" y="44.1" text-anchor="middle" font-size="14">M</text><text x="131.1" y="27.3" text-anchor="middle" font-size="13">C</text><text x="280" y="50" font-size="14">Interphase</text><text x="280" y="68" class="tm" font-size="12">(most of the cycle)</text><text x="280" y="94" class="tm" font-size="12">G1: growth, organelles made</text><text x="280" y="112" class="tg" font-size="12">S: DNA replicates</text><text x="280" y="130" class="tm" font-size="12">G2: more growth, checks</text><text x="280" y="170" font-size="12">M: mitosis (nucleus divides)</text><text x="280" y="188" font-size="12">C: cytokinesis</text></svg>
