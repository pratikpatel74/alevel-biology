q": "Which is a consequence of the refractory period?", "o": ["Action potentials travel in both directions", "Action potentials merge", "There is no limit to frequency", "Action potentials travel in one direction only"], "a": 3, "e": "The region behind the action potential can't be stimulated again immediately, so the impulse moves forward only."}, {"q": "What is saltatory conduction?", "o": ["Depolarisation only at nodes of Ranvier, so the impulse jumps between nodes", "Conduction along unmyelinated axons", "Diffusion of ACh across the cleft", "Conduction through Purkyne tissue"], "a": 0, "e": "Myelin insulates the axon. Ion movement happens only at the gaps (nodes), so the action potential jumps, which is faster."}, {"q": "Which axon conducts impulses fastest?", "o": ["Narrow and unmyelinated", "Wide and myelinated", "Narrow and myelinated, at a low temperature", "Wide and unmyelinated"], "a": 1, "e": "Myelination allows saltatory conduction, and a wider diameter reduces resistance. Both increase speed."}, {"q": "What causes vesicles to release acetylcholine at a synapse?", "o": ["Na⁺ entering the presynaptic knob", "K⁺ leaving", "Ca²⁺ diffusing into the presynaptic knob", "ACh binding to receptors"], "a": 2, "e": "An action potential opens voltage-gated Ca²⁺ channels. Ca²⁺ causes vesicles to fuse with the membrane."}, {"q": "How is acetylcholine released into the synaptic cleft?", "o": ["Active transport", "Facilitated diffusion", "Osmosis", "Exocytosis"], "a": 3, "e": "Vesicles fuse with the presynaptic membrane and release ACh by exocytosis."}, {"q": "What happens when ACh binds to the postsynaptic membrane?", "o": ["Na⁺ channels open, Na⁺ enters and the membrane depolarises", "K⁺ channels open and the membrane hyperpolarises", "Ca²⁺ channels open", "The membrane becomes impermeable"], "a": 0, "e": "ACh binding opens Na⁺ channels. If enough Na⁺ enters to reach threshold, an action potential begins."}, {"q": "What is the role of acetylcholinesterase?", "o": ["It makes ACh", "It hydrolyses ACh, stopping continuous stimulation and recycling choline", "It opens Ca²⁺ channels", "It pumps Na⁺ out"], "a": 1, "e": "Hydrolysing ACh removes it from receptors, so the postsynaptic neurone isn't continuously stimulated. The products are recycled."}, {"q": "Why are synapses unidirectional?", "o": ["Na⁺ only moves one way", "The cleft is narrow", "Only the presynaptic side has vesicles of neurotransmitter, and only the postsynaptic side has receptors", "Acetylcholinesterase is on both sides"], "a": 2, "e": "Neurotransmitter is released from one side and detected on the other, so transmission is one-way."}, {"q": "What is temporal summation?", "o": ["Several presynaptic neurones release neurotransmitter at the same time", "Impulses travel faster", "Inhibitory neurotransmitters hyperpolarise the membrane", "One presynaptic neurone releases neurotransmitter repeatedly in quick succession, building up to threshold"], "a": 3, "e": "Repeated release from one neurone adds up over time until enough neurotransmitter has been released to reach threshold."}, {"q": "What is spatial summation?", "o": ["Several presynaptic neurones release neurotransmitter onto one postsynaptic neurone, together reaching threshold", "One neurone fires repeatedly", "The refractory period increases", "Neurotransmitter is recycled"], "a": 0, "e": "Neurotransmitter from several neurones combines to reach threshold in the postsynaptic neurone."}, {"q": "How do inhibitory synapses work?", "o": ["They open Na⁺ channels", "They open Cl⁻ channels (and K⁺ channels), hyperpolarising the postsynaptic membrane", "They release more ACh", "They destroy receptors"], "a": 1, "e": "Cl⁻ entering and K⁺ leaving make the inside more negative, so more excitatory input is needed to reach threshold."}, {"q": "A drug inhibits acetylcholinesterase. What is the effect?", "o": ["Less ACh is released", "Fewer action potentials in the postsynaptic neurone", "ACh stays bound to receptors, so the postsynaptic neurone is stimulated continuously", "Ca²⁺ channels close"], "a": 2, "e": "ACh isn't broken down, so Na⁺ channels stay open and the postsynaptic membrane keeps depolarising."}, {"q": "A drug has a similar shape to ACh and binds to its receptors without opening Na⁺ channels. What is the effect?", "o": ["Increased stimulation", "Faster impulses", "More Ca²⁺ enters", "Fewer action potentials, because ACh can't bind"], "a": 3, "e": "The drug blocks the receptors, so ACh can't open Na⁺ channels. Synaptic transmission is inhibited."}, {"q": "How does a neuromuscular junction differ from a cholinergic synapse between neurones?", "o": ["It is always excitatory, and the postsynaptic cell is a muscle fibre", "It uses noradrenaline only", "It is inhibitory", "It has no acetylcholinesterase"], "a": 0, "e": "At a neuromuscular junction, ACh always stimulates the muscle fibre. Synapses between neurones can be excitatory or inhibitory."}, {"q": "Why does temperature affect the speed of nerve impulses?", "o": ["It changes the myelin sheath", "Higher temperature increases the rate of ion diffusion and pump activity (until proteins denature)", "It changes axon diameter", "It reduces threshold"], "a": 1, "e": "Ions diffuse faster at higher temperatures, and the proteins involved work faster, up to the point where they denature."}]}, {"id": "3.6c", "order": 22, "section": "3.6", "spec": "3.6.3", "title": "Skeletal muscle", "desc": "Antagonistic muscles, sarcomere structure, the sliding filament theory, the roles of calcium ions and ATP, phosphocreatine, and slow and fast twitch fibres.", "practicals": [], "summary": [{"h": "Muscles and movement", "p": ["Skeletal muscles act in **antagonistic pairs** against an incompressible skeleton: when one contracts, the other relaxes, e.g. biceps and triceps.", "Muscle is made of **muscle fibres** (multinucleate cells). Each fibre contains many **myofibrils** made of repeating units called **sarcomeres**."]}, {"h": "Sarcomere structure", "p": ["**Actin**: thin filaments. **Myosin**: thick filaments with heads.", "**Z-line**: the boundary of each sarcomere, where actin is attached.", "**A-band** (dark): the length of the myosin filaments, including where they overlap with actin.", "**I-band** (light): actin only.", "**H-zone**: myosin only, in the centre of the sarcomere.", "During contraction, the **I-band and H-zone shorten**, the **sarcomere shortens**, and the **A-band stays the same length**."]}, {"h": "Sliding filament theory", "p": ["An action potential arrives at the neuromuscular junction and spreads along the **sarcolemma** and down **T-tubules**.", "**Ca²⁺** is released from the **sarcoplasmic reticulum**.", "Ca²⁺ binds to **troponin**, which pulls **tropomyosin** away from the binding sites on actin, exposing them.", "**Myosin heads** (with ADP attached) bind to actin, forming **actinomyosin cross-bridges**.", "The myosin head bends (power stroke), **pulling actin** towards the centre of the sarcomere, and **ADP is released**.", "**ATP** binds to the myosin head, causing it to **detach** from actin.", "Ca²⁺ activates **ATP hydrolase**, which hydrolyses ATP. The energy returns the myosin head to its original position, ready to bind again further along."]}, {"h": "Energy supply", "p": ["**Phosphocreatine** in muscle provides phosphate to regenerate ATP from ADP **anaerobically**. This supplies ATP rapidly at the start of intense exercise.", "ATP is also produced by aerobic respiration and anaerobic respiration."]}, {"h": "Slow and fast twitch fibres", "p": ["**Slow twitch**: contract slowly and for long periods, for endurance (e.g. posture muscles). Many **mitochondria**, lots of **myoglobin** (stores O₂, red colour), rich **blood supply**. Use **aerobic** respiration.", "**Fast twitch**: contract rapidly and powerfully for short periods (e.g. sprinting). Thicker, more myosin filaments, lots of **glycogen** and **phosphocreatine**. Use **anaerobic** respiration and fatigue quickly."]}], "pitfalls": ["The **A-band doesn't change** during contraction, because myosin filaments don't change length.", "ATP is needed for the myosin head to **detach** and to **re-cock**. Without ATP, muscles stay contracted (rigor mortis).", "Ca²⁺ binds to **troponin**, not to tropomyosin.", "Filaments **slide** past each other. They don't shorten themselves."], "questions": [{"q": "Why do skeletal muscles work in antagonistic pairs?", "o": ["Muscles can push and pull", "Muscles can only pull, so one muscle contracts while the other relaxes to move a bone back", "To increase strength only", "To produce heat"], "a": 1, "e": "Muscles can only contract (pull). An opposing muscle is needed to move the bone back."}, {"q": "What is a sarcomere?", "o": ["The repeating unit of a myofibril, between two Z-lines", "A muscle cell", "A type of neurone", "A bundle of muscle fibres"], "a": 0, "e": "Sarcomeres are the contractile units of myofibrils, bounded by Z-lines."}, {"q": "Which band contains only actin filaments?", "o": ["A-band", "H-zone", "I-band", "M-line"], "a": 2, "e": "The I-band is the light region where only thin actin filaments are present."}, {"q": "What does the H-zone contain?", "o": ["Actin only", "Both actin and myosin", "Z-lines only", "Myosin only"], "a": 3, "e": "The H-zone is the centre of the sarcomere where there is myosin but no overlapping actin."}, {"q": "During contraction, which band stays the same length?", "o": ["A-band", "I-band", "H-zone", "Sarcomere"], "a": 0, "e": "The A-band is the length of the myosin filaments, which don't change. Actin slides over them."}, {"q": "What happens to the I-band and H-zone during contraction?", "o": ["Both lengthen", "Both shorten", "The I-band shortens and the H-zone lengthens", "Neither changes"], "a": 1, "e": "As actin slides towards the centre, there is more overlap, so regions with only one type of filament get shorter."}, {"q": "Where are calcium ions released from during muscle contraction?", "o": ["Mitochondria", "T-tubules", "Sarcoplasmic reticulum", "Nucleus"], "a": 2, "e": "An action potential spreading through T-tubules causes the sarcoplasmic reticulum to release Ca²⁺."}, {"q": "What does Ca²⁺ bind to in muscle fibres?", "o": ["Actin", "Myosin", "Tropomyosin", "Troponin"], "a": 3, "e": "Ca²⁺ binds to troponin, which changes shape and pulls tropomyosin away from binding sites on actin."}, {"q": "What is the role of tropomyosin in resting muscle?", "o": ["It blocks the myosin-binding sites on actin", "It hydrolyses ATP", "It releases Ca²⁺", "It forms the Z-line"], "a": 0, "e": "In relaxed muscle, tropomyosin covers the binding sites, so myosin heads can't attach."}, {"q": "What happens when myosin heads bind to actin?", "o": ["ATP is made", "Actinomyosin cross-bridges form; the head bends, pulling actin towards the centre", "Ca²⁺ is released", "The A-band shortens"], "a": 1, "e": "The myosin head binds, then bends (the power stroke), sliding actin along and releasing ADP."}, {"q": "What causes a myosin head to detach from actin?", "o": ["Ca²⁺ binding", "ADP binding", "ATP binding to the myosin head", "Tropomyosin moving"], "a": 2, "e": "A new ATP molecule binding to the myosin head breaks the cross-bridge."}, {"q": "What is the energy from ATP hydrolysis used for in contraction?", "o": ["Releasing Ca²⁺", "Binding Ca²⁺ to troponin", "Moving tropomyosin", "Returning the myosin head to its original position"], "a": 3, "e": "ATP hydrolase in the myosin head hydrolyses ATP. The energy re-cocks the head, ready to bind further along actin."}, {"q": "Why does rigor mortis happen after death?", "o": ["No ATP is available, so myosin heads can't detach from actin", "Too much ATP", "Ca²⁺ is removed", "Actin is destroyed"], "a": 0, "e": "Without ATP, cross-bridges stay attached, so the muscles remain locked."}, {"q": "What is the role of phosphocreatine?", "o": ["It stores oxygen", "It provides phosphate to regenerate ATP from ADP rapidly and anaerobically", "It releases Ca²⁺", "It binds to troponin"], "a": 1, "e": "Phosphocreatine donates phosphate to ADP, quickly resupplying ATP at the start of intense exercise."}, {"q": "Which feature is typical of slow twitch fibres?", "o": ["Large stores of phosphocreatine", "Few mitochondria", "Lots of myoglobin and many mitochondria", "Rapid fatigue"], "a": 2, "e": "Slow twitch fibres respire aerobically. Myoglobin stores oxygen and many mitochondria make ATP."}, {"q": "Which feature is typical of fast twitch fibres?", "o": ["Rich blood supply", "Lots of myoglobin", "Many mitochondria", "Large stores of glycogen and phosphocreatine"], "a": 3, "e": "Fast twitch fibres rely on anaerobic respiration and phosphocreatine for rapid, powerful contraction."}, {"q": "Why do slow twitch fibres look red?", "o": ["They contain a lot of myoglobin and have a rich blood supply", "They contain more actin", "They contain Ca²⁺", "They have more glycogen"], "a": 0, "e": "Myoglobin is a red pigment that stores oxygen, and the many capillaries add to the colour."}, {"q": "Which sport mostly uses fast twitch fibres?", "o": ["Marathon running", "100 m sprint", "Long-distance cycling", "Holding posture"], "a": 1, "e": "Sprinting needs short, powerful contractions, provided by fast twitch fibres."}, {"q": "What carries an action potential deep into a muscle fibre?", "o": ["Myofibrils", "Z-lines", "T-tubules", "Sarcomeres"], "a": 2, "e": "T-tubules are extensions of the sarcolemma that carry the action potential into the fibre."}, {"q": "What is released from the myosin head during the power stroke?", "o": ["ATP", "Ca²⁺", "Tropomyosin", "ADP"], "a": 3, "e": "Myosin heads bind actin with ADP attached. ADP is released as the head bends and pulls actin."}, {"q": "Ca²⁺ activates which enzyme in muscle contraction?", "o": ["ATP hydrolase", "ATP synthase", "Acetylcholinesterase", "Rubisco"], "a": 0, "e": "Ca²⁺ activates ATP hydrolase, which hydrolyses ATP to provide energy for the myosin head to return."}, {"q": "A sarcomere is 2.5 µm long at rest and 2.0 µm when contracted. The A-band is 1.5 µm at rest. How long is the A-band when contracted?", "o": ["1.0 µm", "1.5 µm", "2.0 µm", "0.5 µm"], "a": 1, "e": "The A-band doesn't change length during contraction, because myosin filaments stay the same length."}]}, {"id": "3.6d", "order": 23, "section": "3.6", "spec": "3.6.4.1–3.6.4.2", "title": "Homeostasis and blood glucose", "desc": "Principles of homeostasis and negative feedback, insulin, glucagon and adrenaline, the second messenger model, and type I and type II diabetes.", "practicals": [11], "summary": [{"h": "Principles of homeostasis", "p": ["**Homeostasis** is the maintenance of a **stable internal environment** within restricted limits, by physiological control systems.", "**Core temperature** and **pH** are kept stable so enzymes and other proteins work efficiently and aren't denatured.", "**Blood glucose** is kept stable to maintain the **water potential** of blood and to provide a constant supply of glucose for **respiration**.", "**Negative feedback** restores systems to their original level. Having **separate mechanisms** for raising and lowering a level gives more control.", "**Positive feedback** results in greater departure from normal, e.g. during an action potential, Na⁺ entry opens more Na⁺ channels."]}, {"h": "Key processes in the liver", "p": ["**Glycogenesis**: converting glucose into **glycogen**.", "**Glycogenolysis**: hydrolysis of glycogen into **glucose**.", "**Gluconeogenesis**: making glucose from **non-carbohydrates**, such as glycerol and amino acids."]}, {"h": "Insulin: lowering blood glucose", "p": ["High blood glucose is detected by **β cells** in the **islets of Langerhans** in the pancreas, which secrete **insulin**.", "Insulin binds to specific receptors on cell membranes (e.g. liver and muscle cells).", "It causes **more glucose transport proteins (GLUT4)** to be inserted into membranes, so cells absorb more glucose.", "It activates enzymes that convert glucose to glycogen (**glycogenesis**).", "Overall, blood glucose falls."]}, {"h": "Glucagon and adrenaline: raising blood glucose", "p": ["Low blood glucose is detected by **α cells**, which secrete **glucagon**.", "Glucagon binds to receptors on **liver cells** and activates enzymes for **glycogenolysis** and **gluconeogenesis**. Blood glucose rises.", "**Adrenaline** (from the adrenal glands, e.g. during stress) also activates glycogenolysis and inhibits glycogenesis."]}, {"h": "Second messenger model", "p": ["Glucagon or adrenaline (the **first messenger**) binds to a receptor on the liver cell membrane.", "This activates **adenylate cyclase**, which converts **ATP** into **cyclic AMP (cAMP)**, the **second messenger**.", "cAMP activates **protein kinase A**, which starts a cascade leading to **glycogenolysis**."]}, {"h": "Diabetes", "p": ["**Type I**: the body **can't produce insulin**, usually because the immune system destroys β cells. Controlled by **insulin injections**, matched to diet and exercise.", "**Type II**: cells **don't respond properly to insulin** (receptors less responsive), often linked to **obesity**. Controlled by diet, exercise and sometimes drugs.", "Evaluate health advice from the food industry and government on sugar intake and obesity."]}], "pitfalls": ["**Glycogenesis**, **glycogenolysis** and **gluconeogenesis** are easily mixed up: genesis = making, lysis = splitting, neo = new.", "Glucagon acts mainly on the **liver**. Muscle cells don't have glucagon receptors.", "In the second messenger model, the hormone **doesn't enter** the cell. cAMP carries the signal inside.", "Type I is about **not producing** insulin. Type II is about **not responding** to it."], "questions": [{"q": "What is homeostasis?", "o": ["Changing the internal environment in response to temperature", "Maintenance of a stable internal environment within restricted limits", "The growth of cells", "The response of plants to light"], "a": 1, "e": "Homeostasis keeps conditions like temperature, pH and glucose within narrow limits."}, {"q": "Why is it important to keep blood glucose concentration stable?", "o": ["To maintain the water potential of the blood and provide a steady supply of glucose for respiration", "To stop enzymes working", "To increase heart rate", "To store fat"], "a": 0, "e": "Glucose affects water potential, and cells need a constant supply for respiration."}, {"q": "What is negative feedback?", "o": ["A change that moves conditions further from normal", "A response that stops all change", "A mechanism that restores a system to its original level", "A type of hormone"], "a": 2, "e": "In negative feedback, a change from the norm triggers a response that reverses the change."}, {"q": "Why are separate mechanisms for raising and lowering a factor useful?", "o": ["They save energy", "They prevent all change", "They are faster to evolve", "They give a greater degree of control"], "a": 3, "e": "Being able to actively raise and actively lower a factor gives finer and quicker control."}, {"q": "What is glycogenesis?", "o": ["Conversion of glucose into glycogen", "Hydrolysis of glycogen to glucose", "Making glucose from amino acids", "Breaking glucose down in respiration"], "a": 0, "e": "Glycogenesis means 'glycogen making': glucose molecules are joined to form glycogen."}, {"q": "What is gluconeogenesis?", "o": ["Breakdown of glycogen", "Production of glucose from non-carbohydrate sources such as glycerol and amino acids", "Conversion of glucose to glycogen", "Release of insulin"], "a": 1, "e": "Gluconeogenesis means 'making new glucose' from substances that aren't carbohydrates."}, {"q": "Which cells secrete insulin?", "o": ["α cells of the islets of Langerhans", "Liver cells", "β cells of the islets of Langerhans", "Adrenal glands"], "a": 2, "e": "β cells in the islets of Langerhans secrete insulin when blood glucose is high."}, {"q": "How does insulin lower blood glucose?", "o": ["It breaks down glycogen", "It activates gluconeogenesis", "It increases glucagon release", "It increases glucose transport proteins in membranes and activates glycogenesis"], "a": 3, "e": "Insulin causes more glucose carriers in cell membranes, so cells take up more glucose, and activates enzymes for glycogenesis."}, {"q": "Which hormone is secreted by α cells when blood glucose is low?", "o": ["Glucagon", "Insulin", "Adrenaline", "ADH"], "a": 0, "e": "α cells secrete glucagon, which raises blood glucose."}, {"q": "Glucagon acts mainly on which cells?", "o": ["Muscle cells", "Liver cells", "Red blood cells", "Neurones"], "a": 1, "e": "Liver cells have glucagon receptors. Glucagon activates glycogenolysis and gluconeogenesis there."}, {"q": "In the second messenger model, what does adenylate cyclase do?", "o": ["Breaks down glycogen directly", "Makes insulin", "Converts ATP into cyclic AMP", "Binds glucagon"], "a": 2, "e": "Activated adenylate cyclase converts ATP into cAMP, the second messenger."}, {"q": "What is the role of cyclic AMP in the second messenger model?", "o": ["It binds to the receptor on the membrane", "It is the hormone", "It is secreted into the blood", "It activates protein kinase A, leading to glycogenolysis"], "a": 3, "e": "cAMP activates protein kinase A, which triggers a cascade of enzyme reactions that break down glycogen."}, {"q": "Which is the first messenger in the second messenger model?", "o": ["The hormone, such as glucagon or adrenaline", "cAMP", "Protein kinase A", "ATP"], "a": 0, "e": "The hormone binding to the outside of the cell is the first messenger. cAMP inside the cell is the second messenger."}, {"q": "How does adrenaline affect blood glucose?", "o": ["It lowers it by activating glycogenesis", "It raises it by activating glycogenolysis and inhibiting glycogenesis", "It has no effect", "It increases insulin secretion"], "a": 1, "e": "Adrenaline prepares the body for action by releasing glucose from glycogen stores."}, {"q": "What is the cause of type I diabetes?", "o": ["Cells stop responding to insulin", "Too much insulin is made", "The body can't produce insulin, usually because β cells are destroyed", "Too much glucagon"], "a": 2, "e": "In type I diabetes, the immune system usually destroys β cells, so little or no insulin is produced."}, {"q": "What is the main cause of type II diabetes?", "o": ["β cells are destroyed", "No glucagon is made", "A virus", "Cells become less responsive to insulin"], "a": 3, "e": "In type II, insulin is produced but receptors respond less. It is strongly linked to obesity."}, {"q": "How is type I diabetes usually controlled?", "o": ["Insulin injections matched to diet and exercise", "Diet alone", "Glucagon injections", "Exercise only"], "a": 0, "e": "People with type I diabetes inject insulin, balancing doses with carbohydrate intake and activity."}, {"q": "How is type II diabetes usually controlled at first?", "o": ["Insulin injections only", "Changes to diet and exercise, sometimes with drugs", "Glucagon injections", "Surgery"], "a": 1, "e": "Weight loss, a healthy diet and exercise improve insulin sensitivity. Drugs or insulin may be added later."}, {"q": "Which is an example of positive feedback?", "o": ["Insulin lowering blood glucose", "Glucagon raising blood glucose", "Na⁺ entry during an action potential opening more Na⁺ channels", "Sweating when hot"], "a": 2, "e": "Positive feedback amplifies a change. In an action potential, depolarisation opens more voltage-gated Na⁺ channels."}, {"q": "In RP11, why must all glucose solutions be heated with Benedict's for the same time and temperature?", "o": ["To dissolve the precipitate", "To kill bacteria", "To change the colour of the filter", "So that only glucose concentration affects the result"], "a": 3, "e": "These are control variables. Differences in heating would affect how much precipitate forms."}, {"q": "In RP11, after filtering out the precipitate, a sample has high absorbance. What does this show?", "o": ["Low glucose concentration, because a lot of blue Cu²⁺ remains", "High glucose concentration", "No Benedict's was added", "The colorimeter is faulty"], "a": 0, "e": "Less glucose reduces less Cu²⁺, so more blue copper remains in solution and absorbance is higher."}, {"q": "Why must the unknown sample's reading fall within the range of the calibration curve?", "o": ["To save time", "Because values outside the range can't be reliably read off the curve", "Because the colorimeter can't measure them", "Because Benedict's stops working"], "a": 1, "e": "Extrapolating beyond the standards assumes the relationship continues, which may not be true."}]}, {"id": "3.6e", "order": 24, "section": "3.6", "spec": "3.6.4.3", "title": "Control of blood water potential", "desc": "Nephron structure, ultrafiltration, selective reabsorption, the loop of Henle, and control of water potential by ADH.", "practicals": [], "summary": [{"h": "The nephron", "p": ["Kidneys contain about a million **nephrons**. Parts: **glomerulus** and **Bowman's capsule**, **proximal convoluted tubule (PCT)**, **loop of Henle**, **distal convoluted tubule (DCT)** and **collecting duct**.", "Blood enters the glomerulus through the wider **afferent arteriole** and leaves through the narrower **efferent arteriole**."]}, {"h": "Ultrafiltration", "p": ["The efferent arteriole is narrower than the afferent, so **hydrostatic pressure** in the glomerulus is high.", "This forces small molecules (water, glucose, urea, mineral ions, amino acids) out of the capillary and into the Bowman's capsule, forming **glomerular filtrate**.", "**Large proteins** and **blood cells** are too big to pass through, so they stay in the blood."]}, {"h": "Selective reabsorption in the PCT", "p": ["All **glucose**, most water and many ions are reabsorbed from the filtrate in the PCT.", "Epithelial cells have **microvilli** (large surface area) and many **mitochondria** (ATP for active transport).", "Na⁺ is actively transported out of the epithelial cells into the blood. Na⁺ then diffuses into the cells from the filtrate, **co-transporting glucose** and amino acids.", "Water follows by **osmosis**."]}, {"h": "Loop of Henle", "p": ["The loop creates a **gradient of water potential** in the **medulla**, which becomes more negative deeper in.", "**Ascending limb**: Na⁺ and Cl⁻ are **actively transported out** into the medulla. The ascending limb is **impermeable to water**.", "This **lowers the water potential** of the medulla tissue fluid.", "**Descending limb**: permeable to water, so water leaves by osmosis into the medulla and is carried away by capillaries.", "Water then leaves the **collecting duct** by osmosis as it passes down through the medulla.", "Animals in dry habitats have **longer loops of Henle**, creating a steeper gradient so more water is reabsorbed."]}, {"h": "Control by ADH", "p": ["**Osmoreceptors** in the **hypothalamus** detect changes in blood water potential.", "When water potential **falls** (e.g. dehydration), the hypothalamus sends signals and the **posterior pituitary** releases more **ADH** (antidiuretic hormone).", "ADH binds to receptors on cells of the **DCT and collecting duct**, causing **aquaporins** (water channels) to be inserted into their membranes. Walls become **more permeable to water**.", "More water is reabsorbed into the blood, so a **smaller volume of more concentrated urine** is produced.", "When water potential rises (too much water), less ADH is released, so less water is reabsorbed."]}], "pitfalls": ["The **ascending** limb is impermeable to water and actively pumps out ions. The **descending** limb lets water out.", "ADH makes the collecting duct **more permeable**. It doesn't actively 'pump' water.", "Glucose in urine means **not all** glucose was reabsorbed, because carrier proteins were saturated (e.g. untreated diabetes).", "ADH is **made in the hypothalamus** and **released from the posterior pituitary**."], "questions": [{"q": "Why is the hydrostatic pressure in the glomerulus high?", "o": ["The efferent arteriole is narrower than the afferent arteriole", "The heart pumps directly into it", "The afferent arteriole is narrower", "The glomerulus contains muscle"], "a": 0, "e": "Blood enters through a wider vessel and leaves through a narrower one, building up pressure that forces fluid out."}, {"q": "Which substance is NOT normally found in the glomerular filtrate?", "o": ["Glucose", "Urea", "Large plasma proteins", "Water"], "a": 2, "e": "Large proteins and blood cells are too big to pass through the filtration barrier."}, {"q": "Where is all the glucose reabsorbed in a healthy nephron?", "o": ["Loop of Henle", "Collecting duct", "Distal convoluted tubule", "Proximal convoluted tubule"], "a": 3, "e": "All glucose is reabsorbed in the PCT by co-transport with sodium ions."}, {"q": "How are PCT epithelial cells adapted for reabsorption?", "o": ["They have microvilli and many mitochondria", "They have thick walls", "They have no carrier proteins", "They are impermeable to water"], "a": 0, "e": "Microvilli give a large surface area, and mitochondria provide ATP for active transport of Na⁺."}, {"q": "How is glucose reabsorbed in the PCT?", "o": ["By osmosis", "By co-transport with Na⁺, which diffuses in after being actively transported out the other side", "By ultrafiltration", "By simple diffusion through the bilayer"], "a": 1, "e": "Na⁺ is pumped out into the blood. Na⁺ then diffuses in from the filtrate, carrying glucose with it."}, {"q": "Why is glucose found in the urine of someone with untreated diabetes?", "o": ["The glomerulus filters too little", "ADH stops working", "Glucose concentration in the filtrate is so high that carrier proteins are saturated, so not all is reabsorbed", "Glucose is secreted into the urine"], "a": 2, "e": "There is a limited number of co-transporters. When they are all working at maximum rate, excess glucose stays in the filtrate."}, {"q": "What happens in the ascending limb of the loop of Henle?", "o": ["Water leaves by osmosis", "Glucose is reabsorbed", "Urea is added", "Na⁺ and Cl⁻ are actively transported out, while the wall is impermeable to water"], "a": 3, "e": "Ions are pumped into the medulla, lowering its water potential. Water can't follow because the wall is impermeable."}, {"q": "What happens in the descending limb of the loop of Henle?", "o": ["Water moves out by osmosis into the medulla", "Na⁺ is actively pumped out", "Glucose is reabsorbed", "ADH is made"], "a": 0, "e": "The medulla has a low water potential, so water leaves the permeable descending limb by osmosis."}, {"q": "What is the main role of the loop of Henle?", "o": ["To filter the blood", "To create a low (more negative) water potential in the medulla, so water can be reabsorbed from the collecting duct", "To reabsorb glucose", "To secrete ADH"], "a": 1, "e": "The gradient it creates lets water leave the collecting duct by osmosis as it passes through the medulla."}, {"q": "Desert rodents have very long loops of Henle. Why?", "o": ["To filter more blood", "To reabsorb more glucose", "To create a steeper water potential gradient in the medulla, so more water is reabsorbed", "To make more dilute urine"], "a": 2, "e": "A longer loop pumps more ions into the medulla, making its water potential more negative, so more water is reabsorbed."}, {"q": "Where are osmoreceptors that detect blood water potential?", "o": ["In the kidney", "In the posterior pituitary", "In the aorta", "In the hypothalamus"], "a": 3, "e": "Osmoreceptors in the hypothalamus detect changes in blood water potential."}, {"q": "Where is ADH released into the blood?", "o": ["Posterior pituitary gland", "Hypothalamus directly", "Kidney", "Pancreas"], "a": 0, "e": "ADH is made in the hypothalamus and released into the blood from the posterior pituitary."}, {"q": "How does ADH increase water reabsorption?", "o": ["It actively pumps water into the blood", "It causes aquaporins to be inserted into the membranes of the DCT and collecting duct, increasing permeability to water", "It raises blood pressure in the glomerulus", "It increases the length of the loop of Henle"], "a": 1, "e": "More aquaporins mean more water leaves the collecting duct by osmosis into the medulla and blood."}, {"q": "After a person drinks a lot of water, what happens?", "o": ["More ADH is released and urine becomes concentrated", "ADH release stays the same", "Less ADH is released, so less water is reabsorbed and a large volume of dilute urine is made", "Glucose appears in urine"], "a": 2, "e": "Blood water potential rises, so the hypothalamus reduces ADH release. Collecting ducts become less permeable."}, {"q": "A person is dehydrated after exercise. What happens?", "o": ["Less ADH, more dilute urine", "No change", "Glucagon is released", "More ADH is released, so a small volume of concentrated urine is produced"], "a": 3, "e": "Low blood water potential is detected, more ADH is released, and more water is reabsorbed."}, {"q": "What is the glomerular filtrate?", "o": ["The fluid forced from the glomerulus into the Bowman's capsule", "Urine", "Blood in the efferent arteriole", "Tissue fluid in the medulla"], "a": 0, "e": "Filtrate contains water and small solutes forced out by ultrafiltration. Most is later reabsorbed."}, {"q": "What is the effect of a drug that blocks ADH receptors?", "o": ["Small volumes of concentrated urine", "Large volumes of dilute urine", "Glucose in urine", "No change in urine"], "a": 1, "e": "Without ADH action, few aquaporins are inserted, so little water is reabsorbed from the collecting duct."}, {"q": "Which part of the nephron is impermeable to water?", "o": ["Descending limb of the loop of Henle", "Proximal convoluted tubule", "Ascending limb of the loop of Henle", "Collecting duct with ADH"], "a": 2, "e": "The ascending limb doesn't let water out, so the ions it pumps out lower the medulla's water potential."}, {"q": "How does water move from the collecting duct into the blood?", "o": ["Active transport", "Co-transport", "Ultrafiltration", "Osmosis"], "a": 3, "e": "Water moves by osmosis down a water potential gradient into the medulla, then into capillaries."}, {"q": "Which structure receives blood from the renal artery and forms the filtration site?", "o": ["Glomerulus", "Loop of Henle", "Collecting duct", "Ureter"], "a": 0, "e": "The glomerulus is a knot of capillaries inside the Bowman's capsule where ultrafiltration happens."}, {"q": "What is the effect of ADH on urine?", "o": ["It increases urine volume", "It decreases urine volume and makes it more concentrated", "It adds glucose", "It removes urea"], "a": 1, "e": "ADH increases water reabsorption, so less water ends up in urine."}, {"q": "Why does the medulla have a lower water potential deeper down?", "o": ["Glucose builds up there", "Water is pumped in", "Ions pumped out of the ascending limb accumulate, concentrating towards the deepest part", "ADH is made there"], "a": 2, "e": "Ions are pumped out along the ascending limb, and the concentration builds up towards the bottom of the loop."}]}, {"id": "3.7a", "order": 25, "section": "3.7", "spec": "3.7.1", "title": "Inheritance", "desc": "Genotype and phenotype, monohybrid and dihybrid crosses, codominance and multiple alleles, sex linkage, autosomal linkage, epistasis and the chi-squared test.", "practicals": [], "summary": [{"h": "Key terms", "p": ["**Genotype**: the genetic constitution of an organism. **Phenotype**: the expression of the genotype and its interaction with the environment.", "**Alleles** are different versions of the same gene, at the same locus. Diploid organisms have **two alleles** of each gene.", "**Homozygous**: two identical alleles. **Heterozygous**: two different alleles.", "**Dominant**: always expressed in the phenotype. **Recessive**: only expressed when two copies are present (homozygous).", "**Codominant**: both alleles are expressed in the heterozygote, e.g. red and white flowers giving roan or pink.", "**Multiple alleles**: more than two alleles exist for a gene, e.g. ABO blood groups (Iᴬ and Iᴮ codominant, Iᴼ recessive)."]}, {"h": "Monohybrid and dihybrid crosses", "p": ["**Monohybrid**: one gene. Heterozygous × heterozygous gives a **3:1** phenotypic ratio (dominant:recessive).", "**Dihybrid**: two genes on different chromosomes. Heterozygous for both × heterozygous for both gives **9:3:3:1**.", "Use **genetic diagrams**: parental phenotypes, parental genotypes, gametes, Punnett square, offspring genotypes and phenotypes, ratio."]}, {"h": "Sex linkage", "p": ["Genes on the **X chromosome** are **sex-linked**. Males (XY) have only **one copy**, so a recessive X-linked allele is always expressed.", "Examples: haemophilia, red-green colour blindness. These are far more common in males.", "Write X-linked alleles as superscripts, e.g. Xᴴ and Xʰ."]}, {"h": "Autosomal linkage", "p": ["Two genes on the **same autosome** are **linked**, so they tend to be inherited together.", "Offspring ratios differ from 9:3:3:1, with **more parental combinations** than expected.", "**Recombinants** (new combinations) are produced only when **crossing over** happens between the two loci. The further apart the genes, the more recombinants."]}, {"h": "Epistasis", "p": ["**Epistasis**: the allele of one gene **affects or masks** the expression of another gene.", "This gives modified dihybrid ratios, e.g. **9:3:4** (recessive epistasis) or **12:3:1** (dominant epistasis)."]}, {"h": "Chi-squared test", "p": ["Tests whether the difference between **observed** and **expected** results is **significant**, or just due to chance.", "`χ² = Σ (O − E)² ÷ E`", "**Null hypothesis**: there is no significant difference between observed and expected results.", "Degrees of freedom = number of categories − 1. Compare χ² with the **critical value** at **p = 0.05**.", "If χ² is **greater than** the critical value, **reject** the null hypothesis: the difference is significant (e.g. genes may be linked)."]}], "pitfalls": ["Always write the **gametes** in a genetic diagram, with circles. Examiners award marks for them.", "A χ² value **smaller** than the critical value means you **accept** the null hypothesis.", "Fathers can't pass X-linked alleles to **sons**: sons get the Y from their father.", "More parental types than expected suggests **autosomal linkage**. Odd ratios like 9:3:4 suggest **epistasis**."], "questions": [{"q": "What is a phenotype?", "o": ["The alleles an organism has", "The expression of the genotype and its interaction with the environment", "The position of a gene", "A type of mutation"], "a": 1, "e": "Phenotype is the observable characteristics, which depend on genotype and environment."}, {"q": "What is meant by heterozygous?", "o": ["Having two different alleles of a gene", "Having two identical alleles", "Having only one allele", "Having no alleles"], "a": 0, "e": "A heterozygous organism carries two different alleles for a gene, e.g. Aa."}, {"q": "Two heterozygous pea plants (Tt) are crossed. Tall is dominant. What is the expected ratio of tall to short?", "o": ["1:1", "1:2:1", "3:1", "9:3:3:1"], "a": 2, "e": "Tt × Tt gives TT, Tt, Tt, tt. Three have a T allele (tall) and one is tt (short), so 3:1."}, {"q": "What is codominance?", "o": ["One allele masks the other", "Genes on the same chromosome", "One gene masks another gene", "Both alleles are expressed in the phenotype of a heterozygote"], "a": 3, "e": "With codominance, neither allele is recessive, so both are expressed, e.g. roan cattle with red and white hairs."}, {"q": "A person with blood group AB has which genotype?", "o": ["IᴬIᴮ", "IᴬIᴼ", "IᴮIᴼ", "IᴼIᴼ"], "a": 0, "e": "Iᴬ and Iᴮ are codominant, so a person with both has blood group AB."}, {"q": "Parents with genotypes IᴬIᴼ and IᴮIᴼ have a child. What is the probability the child has blood group O?", "o": ["0", "0.25", "0.5", "0.75"], "a": 1, "e": "Possible offspring: IᴬIᴮ, IᴬIᴼ, IᴮIᴼ, IᴼIᴼ. One in four is IᴼIᴼ, so 0.25."}, {"q": "Two parents heterozygous for two unlinked genes (AaBb × AaBb) are crossed. What is the expected phenotypic ratio?", "o": ["3:1", "1:1:1:1", "9:3:3:1", "9:3:4"], "a": 2, "e": "For two unlinked genes, a dihybrid cross of double heterozygotes gives 9:3:3:1."}, {"q": "Why are sex-linked recessive conditions more common in males?", "o": ["Males have two X chromosomes", "The Y chromosome carries the dominant allele", "Females can't inherit them", "Males have only one X chromosome, so a single recessive allele is expressed"], "a": 3, "e": "There is no second X in males to carry a dominant allele that could mask the recessive one."}, {"q": "A carrier mother (XᴴXʰ) and an unaffected father (XᴴY) have a son. What is the probability he has haemophilia?", "o": ["0.5", "0.25", "0", "1"], "a": 0, "e": "A son gets Y from his father and one X from his mother. Half her X chromosomes carry Xʰ, so the probability is 0.5."}, {"q": "Can an affected father pass an X-linked condition to his son?", "o": ["Yes, always", "No, because the son receives the father's Y chromosome", "Only if the mother is a carrier", "Yes, half the time"], "a": 1, "e": "Sons inherit their X from their mother. Fathers pass their Y to sons."}, {"q": "What is autosomal linkage?", "o": ["Genes on the X chromosome", "Alleles that are codominant", "Two genes on the same autosome, tending to be inherited together", "One gene masking another"], "a": 2, "e": "Genes close together on the same non-sex chromosome are usually inherited together unless crossing over separates them."}, {"q": "In a dihybrid cross, there are far more parental phenotypes than expected from 9:3:3:1. What is the most likely explanation?", "o": ["Epistasis", "Codominance", "Sex linkage", "The two genes are linked on the same autosome"], "a": 3, "e": "Linked genes stay together, so parental combinations are more common. Recombinants appear only after crossing over."}, {"q": "How are recombinant offspring produced when genes are linked?", "o": ["By crossing over between the two loci during meiosis", "By independent segregation", "By mutation", "By codominance"], "a": 0, "e": "Crossing over in prophase I can separate linked alleles, creating new combinations."}, {"q": "What is epistasis?", "o": ["Two genes on the same chromosome", "The allele of one gene affects or masks the expression of another gene", "Both alleles being expressed", "An allele on the X chromosome"], "a": 1, "e": "In epistasis, one gene controls whether another gene is expressed, changing the expected ratios."}, {"q": "A dihybrid cross gives a ratio of 9:3:4. What does this suggest?", "o": ["Autosomal linkage", "Sex linkage", "Epistasis", "Codominance"], "a": 2, "e": "9:3:4 is a typical ratio for recessive epistasis, where a homozygous recessive genotype at one gene masks the other gene."}, {"q": "What is the formula for the chi-squared test?", "o": ["χ² = Σ (E − O) ÷ O", "χ² = Σ O ÷ E", "χ² = (O + E)²", "χ² = Σ (O − E)² ÷ E"], "a": 3, "e": "For each category, square the difference between observed and expected, divide by expected, then add them up."}, {"q": "What is the null hypothesis in a chi-squared test of a genetic cross?", "o": ["There is no significant difference between observed and expected results", "The results are significant", "The genes are linked", "The sample is too small"], "a": 0, "e": "The null hypothesis assumes any difference is due to chance."}, {"q": "A cross has 4 phenotype categories. How many degrees of freedom?", "o": ["4", "3", "2", "5"], "a": 1, "e": "Degrees of freedom = number of categories − 1 = 4 − 1 = 3."}, {"q": "χ² = 2.1 and the critical value at p = 0.05 is 7.82. What do you conclude?", "o": ["Reject the null hypothesis; the difference is significant", "The genes are definitely linked", "Accept the null hypothesis; the difference is not significant and is due to chance", "The test is invalid"], "a": 2, "e": "χ² is less than the critical value, so the difference is likely due to chance."}, {"q": "Observed: 70 purple, 30 white. Expected 3:1 from 100 offspring. What is χ²?", "o": ["5.00", "0.67", "0.33", "1.33"], "a": 3, "e": "Expected: 75 purple, 25 white. (70−75)²/75 = 0.33. (30−25)²/25 = 1.00. χ² = 1.33."}, {"q": "What is a genotype?", "o": ["The genetic constitution of an organism", "The appearance of an organism", "Its environment", "Its chromosome number"], "a": 0, "e": "Genotype is the combination of alleles an organism has, e.g. Aa."}, {"q": "A test cross of a dominant-phenotype organism with a homozygous recessive gives some recessive offspring. What is the dominant parent's genotype?", "o": ["Homozygous dominant", "Heterozygous", "Homozygous recessive", "Cannot be determined"], "a": 1, "e": "Recessive offspring need a recessive allele from each parent, so the dominant-looking parent must be heterozygous."}]}, {"id": "3.7b", "order": 26, "section": "3.7", "spec": "3.7.2", "title": "Populations and Hardy–Weinberg", "desc": "Gene pools and allele frequencies, the Hardy–Weinberg principle and its conditions, and calculating allele, genotype and phenotype frequencies.", "practicals": [], "summary": [{"h": "Key terms", "p": ["A **species** exists as one or more **populations**.", "A **population** is a group of organisms of the **same species** occupying a particular space at a particular time that can **potentially interbreed**.", "A **gene pool** is **all the alleles** of all the genes in a population at a given time.", "**Allele frequency** is the proportion of a particular allele in the gene pool."]}, {"h": "Hardy–Weinberg principle", "p": ["Predicts that **allele frequencies will not change** from generation to generation, provided certain conditions are met.", "Conditions: **large** population, **no mutation**, **no migration** in or out, **no natural selection**, and **random mating**.", "`p + q = 1` (allele frequencies), where p = frequency of the **dominant** allele and q = frequency of the **recessive** allele.", "`p² + 2pq + q² = 1` (genotype frequencies), where p² = homozygous dominant, 2pq = heterozygous, q² = homozygous recessive."]}, {"h": "How to calculate", "p": ["Start from the **homozygous recessive** frequency, because it is the only genotype you can identify from the phenotype.", "Example: 1 in 2500 people has cystic fibrosis. q² = 1/2500 = 0.0004, so q = √0.0004 = 0.02. Then p = 1 − 0.02 = 0.98.", "Carriers (heterozygous) = 2pq = 2 × 0.98 × 0.02 = **0.0392**, about 3.9%, or roughly 1 in 25.", "If allele frequencies in real populations **do change** over time, at least one condition isn't met, e.g. selection is acting."]}], "pitfalls": ["Don't take the square root of the dominant phenotype frequency. **p² + 2pq** together give the dominant phenotype.", "q² is a **genotype** frequency. q is an **allele** frequency. Keep track of which you're asked for.", "If asked for a percentage or 'number of people', convert the frequency at the end."], "questions": [{"q": "What is a population?", "o": ["All the species in an area", "A group of organisms of the same species in a particular space at a particular time that can interbreed", "All the alleles in a species", "Organisms that look the same"], "a": 1, "e": "A population is a group of interbreeding organisms of one species living in the same place at the same time."}, {"q": "What is a gene pool?", "o": ["All the alleles of all the genes in a population at a given time", "All the genes in one cell", "The number of individuals", "The DNA of one organism"], "a": 0, "e": "The gene pool is the total collection of alleles in an interbreeding population."}, {"q": "What does the Hardy–Weinberg principle predict?", "o": ["Allele frequencies always increase", "Dominant alleles become more common", "Allele frequencies stay constant between generations, if certain conditions are met", "Populations always evolve"], "a": 2, "e": "In an ideal population, allele frequencies don't change from one generation to the next."}, {"q": "Which is NOT a condition for the Hardy–Weinberg principle?", "o": ["Large population", "No mutation", "Random mating", "Strong natural selection"], "a": 3, "e": "Hardy–Weinberg requires no natural selection. Selection would change allele frequencies."}, {"q": "In the Hardy–Weinberg equation, what does 2pq represent?", "o": ["Frequency of heterozygotes", "Frequency of the dominant allele", "Frequency of homozygous dominants", "Frequency of the recessive phenotype"], "a": 0, "e": "p² = homozygous dominant, 2pq = heterozygous, q² = homozygous recessive."}, {"q": "The frequency of a recessive allele (q) is 0.3. What is p?", "o": ["0.3", "0.7", "0.09", "0.49"], "a": 1, "e": "p + q = 1, so p = 1 − 0.3 = 0.7."}, {"q": "q = 0.3. What is the frequency of homozygous recessive individuals?", "o": ["0.3", "0.6", "0.09", "0.42"], "a": 2, "e": "Homozygous recessive frequency = q² = 0.3² = 0.09."}, {"q": "p = 0.7 and q = 0.3. What is the frequency of heterozygotes?", "o": ["0.21", "0.49", "0.09", "0.42"], "a": 3, "e": "2pq = 2 × 0.7 × 0.3 = 0.42."}, {"q": "In a population, 16% of individuals show the recessive phenotype. What is q?", "o": ["0.4", "0.16", "0.84", "0.6"], "a": 0, "e": "q² = 0.16, so q = √0.16 = 0.4."}, {"q": "In a population, 16% show the recessive phenotype. What proportion are heterozygous?", "o": ["0.36", "0.48", "0.16", "0.24"], "a": 1, "e": "q = 0.4, p = 0.6. 2pq = 2 × 0.6 × 0.4 = 0.48."}, {"q": "In a population, 36% show the recessive phenotype. What percentage show the dominant phenotype?", "o": ["36%", "40%", "64%", "48%"], "a": 2, "e": "Dominant phenotype = p² + 2pq = 1 − q² = 1 − 0.36 = 0.64, so 64%."}, {"q": "Why do Hardy–Weinberg calculations start from the homozygous recessive frequency?", "o": ["It is always the largest", "It equals p", "Dominant individuals are rare", "It is the only genotype that can be identified directly from the phenotype"], "a": 3, "e": "Homozygous dominant and heterozygous individuals look the same, but homozygous recessive individuals have a distinct phenotype."}, {"q": "1 in 10 000 people has a recessive condition. What is the frequency of the recessive allele?", "o": ["0.01", "0.0001", "0.1", "0.99"], "a": 0, "e": "q² = 1/10 000 = 0.0001. q = √0.0001 = 0.01."}, {"q": "1 in 10 000 people has a recessive condition. What is the frequency of carriers?", "o": ["0.0001", "Approximately 0.0198", "0.99", "0.01"], "a": 1, "e": "q = 0.01, p = 0.99. 2pq = 2 × 0.99 × 0.01 = 0.0198, about 2%."}, {"q": "Why is a large population a condition of Hardy–Weinberg?", "o": ["Large populations mutate more", "Large populations select more", "In small populations, chance events (genetic drift) can change allele frequencies", "Small populations always mate randomly"], "a": 2, "e": "In small populations, random changes in which individuals breed can significantly change allele frequencies."}, {"q": "Why does migration affect Hardy–Weinberg predictions?", "o": ["It causes mutation", "It stops mating", "It removes all alleles", "Individuals moving in or out can bring or remove alleles, changing allele frequencies"], "a": 3, "e": "Immigration and emigration (gene flow) add or remove alleles from the gene pool."}, {"q": "Allele frequencies in a population change significantly over several generations. What does this suggest?", "o": ["At least one Hardy–Weinberg condition is not being met, e.g. selection is acting", "The population is in equilibrium", "The calculation was wrong", "The population is very large"], "a": 0, "e": "Changes in allele frequency mean something such as selection, mutation, migration or non-random mating is happening."}, {"q": "In p² + 2pq + q² = 1, what does p² represent?", "o": ["Heterozygous frequency", "Homozygous dominant frequency", "Dominant allele frequency", "Recessive phenotype frequency"], "a": 1, "e": "p² is the frequency of individuals with two dominant alleles."}, {"q": "In a population of 5000 plants, q = 0.2. How many plants would be expected to be homozygous recessive?", "o": ["1000", "100", "200", "800"], "a": 2, "e": "q² = 0.04. 0.04 × 5000 = 200 plants."}, {"q": "What is the sum of p and q always equal to?", "o": ["0", "2", "0.5", "1"], "a": 3, "e": "For a gene with two alleles, their frequencies add up to 1."}, {"q": "Why does non-random mating affect the Hardy–Weinberg principle?", "o": ["Some genotypes reproduce more than others, changing genotype and allele frequencies", "It causes mutation", "It increases population size", "It has no effect"], "a": 0, "e": "If individuals choose mates based on phenotype, certain alleles are passed on more often."}, {"q": "The frequency of the dominant allele is 0.8. What proportion of the population is homozygous dominant?", "o": ["0.8", "0.64", "0.32", "0.04"], "a": 1, "e": "p² = 0.8² = 0.64."}]}, {"id": "3.7c", "order": 27, "section": "3.7", "spec": "3.7.3", "title": "Evolution and speciation", "desc": "Causes of variation, stabilising, directional and disruptive selection, genetic drift, and allopatric and sympatric speciation.", "practicals": [], "summary": [{"h": "Variation", "p": ["Individuals in a population vary in phenotype because of **genetic factors** and **environmental factors**.", "Genetic variation arises from **mutation**, **meiosis** (independent segregation and crossing over), and **random fertilisation** of gametes."]}, {"h": "Natural selection and evolution", "p": ["Predation, disease and **competition** for limited resources result in **differential survival and reproduction**.", "Organisms with advantageous alleles survive and reproduce, passing on these alleles. **Allele frequencies change** over generations: this is **evolution**.", "**Stabilising selection**: favours the **mean** phenotype; variation decreases.", "**Directional selection**: favours **one extreme**; the mean shifts.", "**Disruptive selection**: favours **both extremes** over the mean; can lead to two distinct groups and eventually speciation."]}, {"h": "Genetic drift", "p": ["**Genetic drift**: allele frequencies change by **chance**, not because of selection.", "It has a much bigger effect in **small populations**, e.g. after a **founder effect** (a few individuals start a new population) or a **bottleneck**."]}, {"h": "Speciation", "p": ["**Speciation** happens when populations become **reproductively isolated**: they can't interbreed to produce fertile offspring.", "Isolated populations experience **different mutations**, **different selection pressures** and **genetic drift**, so their gene pools diverge.", "**Allopatric speciation**: populations are separated **geographically** (e.g. by a river, mountain or sea).", "**Sympatric speciation**: populations in the **same area** become reproductively isolated, e.g. by mutations affecting courtship, mating times, or the shape of reproductive organs.", "Types of reproductive isolation: **seasonal** (breed at different times), **mechanical** (incompatible genitalia), **behavioural** (different courtship)."]}], "pitfalls": ["Genetic drift is **random**. Natural selection is not random, because it depends on advantage.", "For speciation, always say populations are **reproductively isolated** and that **gene pools** change, until they can no longer produce **fertile** offspring.", "Disruptive selection favours **both extremes**, and is the type most likely to lead to sympatric speciation."], "questions": [{"q": "What are the two broad causes of phenotypic variation?", "o": ["Mitosis and meiosis", "Genetic factors and environmental factors", "Mutation and evolution", "Selection and drift"], "a": 1, "e": "Phenotype depends on the alleles an individual has and the environment it develops in."}, {"q": "Which is NOT a source of genetic variation?", "o": ["Mitosis in body cells", "Mutation", "Crossing over in meiosis", "Random fertilisation"], "a": 0, "e": "Mitosis produces genetically identical cells, so it doesn't create new genetic variation."}, {"q": "What is evolution?", "o": ["An individual changing to suit its environment", "Mutation in one organism", "A change in allele frequencies in a population over time", "The creation of a new organ"], "a": 2, "e": "Evolution is a change in allele frequencies within a population, through natural selection or genetic drift."}, {"q": "What is disruptive selection?", "o": ["The mean phenotype is favoured", "One extreme is favoured", "No phenotype is favoured", "Both extremes are favoured over the mean"], "a": 3, "e": "Individuals at both ends have an advantage. This can split a population into two groups."}, {"q": "Which type of selection reduces variation around the mean?", "o": ["Stabilising", "Directional", "Disruptive", "Genetic drift"], "a": 0, "e": "Stabilising selection favours the mean and removes extremes, narrowing the range."}, {"q": "What is genetic drift?", "o": ["Change in allele frequency due to selection", "A change in allele frequencies due to chance", "Movement of alleles between populations", "Mutation of a gene"], "a": 1, "e": "In genetic drift, alleles become more or less common by chance, not because they give an advantage."}, {"q": "Why does genetic drift have a greater effect in small populations?", "o": ["Small populations mutate more", "Selection is stronger", "Chance events affect a larger proportion of the gene pool", "Small populations mate randomly"], "a": 2, "e": "When only a few individuals breed, random differences in who reproduces can quickly change allele frequencies."}, {"q": "What is the founder effect?", "o": ["A large population splitting", "Selection favouring extremes", "Rapid mutation", "A few individuals start a new population, so its gene pool differs from the original population"], "a": 3, "e": "The founders carry only a sample of the original alleles, which may not be representative. Drift then acts strongly."}, {"q": "What is speciation?", "o": ["The formation of new species from existing ones", "Classification of species", "A mutation", "The extinction of species"], "a": 0, "e": "Speciation is the evolution of a new species, when populations can no longer interbreed to produce fertile offspring."}, {"q": "What must happen for speciation to occur?", "o": ["Populations must stay in contact", "Populations must become reproductively isolated, so their gene pools diverge", "All individuals must mutate", "The population must grow"], "a": 1, "e": "Reproductive isolation stops gene flow. Different mutations, selection and drift then change each gene pool."}, {"q": "What is allopatric speciation?", "o": ["Speciation in the same area", "Speciation caused by hybridisation", "Speciation after geographical separation of populations", "Speciation caused by drift only"], "a": 2, "e": "A physical barrier separates populations. Different conditions lead to different changes in each gene pool."}, {"q": "What is sympatric speciation?", "o": ["Speciation after a mountain range forms", "Speciation in different continents", "Speciation caused by a river", "Speciation without geographical separation, e.g. due to changes in courtship or mating times"], "a": 3, "e": "In sympatric speciation, populations living in the same area become reproductively isolated by other means."}, {"q": "Two populations of frogs breed in different months. What type of isolation is this?", "o": ["Seasonal", "Mechanical", "Geographical", "Behavioural"], "a": 0, "e": "Breeding at different times of year is seasonal (temporal) isolation."}, {"q": "Two closely related insects have reproductive organs that are not compatible. What type of isolation is this?", "o": ["Seasonal", "Mechanical", "Behavioural", "Geographical"], "a": 1, "e": "Differences in the shape of reproductive organs prevent mating: mechanical isolation."}, {"q": "Birds with different courtship songs don't mate. What type of isolation is this?", "o": ["Mechanical", "Seasonal", "Behavioural", "Geographical"], "a": 2, "e": "Different courtship behaviour means individuals don't recognise each other as mates: behavioural isolation."}, {"q": "Why do separated populations' gene pools become different?", "o": ["They have identical environments", "They mutate in the same way", "They have more individuals", "They experience different mutations, selection pressures and genetic drift"], "a": 3, "e": "With no gene flow between them, each population changes independently."}, {"q": "Which test confirms two populations have become separate species?", "o": ["They can no longer interbreed to produce fertile offspring", "They look different", "They live in different habitats", "They have different numbers"], "a": 0, "e": "The biological species definition depends on producing fertile offspring."}, {"q": "Which type of selection is most likely to lead to sympatric speciation?", "o": ["Stabilising", "Disruptive", "Directional", "None"], "a": 1, "e": "Disruptive selection favours two extremes, which can lead to two groups that become reproductively isolated."}, {"q": "How does competition contribute to natural selection?", "o": ["It increases mutation rate", "It stops reproduction", "Limited resources mean only some individuals survive and reproduce", "It causes genetic drift"], "a": 2, "e": "When resources are limited, individuals with advantageous traits are more likely to get them, survive and reproduce."}, {"q": "A population of plants on a mountain is split by a landslide. Over thousands of years, the two groups can't interbreed. What has happened?", "o": ["Sympatric speciation", "Genetic drift only", "Stabilising selection", "Allopatric speciation"], "a": 3, "e": "Geographical separation led to reproductive isolation and different gene pools: allopatric speciation."}, {"q": "Which statement about genetic drift and natural selection is correct?", "o": ["Drift is random; selection depends on advantage", "Both are random", "Selection only affects small populations", "Drift only happens in large populations"], "a": 0, "e": "Natural selection favours alleles that give an advantage. Drift changes allele frequencies by chance."}, {"q": "Random fertilisation increases variation because:", "o": ["It produces mutations", "Any gamete can fuse with any other, giving new allele combinations", "It doubles the chromosome number", "It removes harmful alleles"], "a": 1, "e": "Each gamete is unique, and which ones fuse is random, increasing the range of genotypes."}]}, {"id": "3.7d", "order": 28, "section": "3.7", "spec": "3.7.4", "title": "Populations in ecosystems", "desc": "Ecosystems, niches and carrying capacity, factors affecting population size, sampling methods and mark-release-recapture, succession and conservation.", "practicals": [12], "summary": [{"h": "Ecosystems and niches", "p": ["An **ecosystem** includes all the **communities** (populations of different species) and the **non-living (abiotic)** components of an area.", "Each species occupies a **niche**, governed by its adaptation to both abiotic and biotic conditions.", "Two species can't occupy exactly the same niche: one would outcompete the other.", "An ecosystem supports a certain size of population of a species, called the **carrying capacity**."]}, {"h": "Factors affecting population size", "p": ["**Abiotic** factors: temperature, light, pH, water, humidity.", "**Biotic** factors: **interspecific competition** (between species), **intraspecific competition** (within a species), and **predation**.", "Predator and prey populations often fluctuate in cycles: prey numbers rise, then predators rise, so prey fall, then predators fall."]}, {"h": "Sampling methods", "p": ["**Randomly placed quadrats**: compare two areas. Use a grid and random number generator for coordinates.", "**Quadrats along a belt transect**: show how a species' distribution changes along an environmental gradient.", "Measure **percentage cover**, **frequency** or **density**.", "**Mark-release-recapture** for **mobile animals**: capture a sample, mark them, release, then capture a second sample.", "`Estimated population size = (number in first sample × number in second sample) ÷ number of marked individuals recaptured`", "Assumptions: marks don't affect survival or behaviour, marks aren't lost, marked individuals mix fully, no births, deaths or migration between samples."]}, {"h": "Succession", "p": ["**Primary succession** starts on bare rock or sand. **Pioneer species** colonise first (e.g. lichens). They are adapted to harsh conditions.", "Each stage **changes the environment** (especially the **abiotic** conditions, e.g. forming soil), making it **less hostile** for new species, which may outcompete earlier ones.", "Over time, **biodiversity** and **biomass** usually increase. The final stable community is the **climax community**.", "**Secondary succession** happens where soil already exists, e.g. after a fire."]}, {"h": "Conservation", "p": ["Conservation of habitats often involves **managing succession**, e.g. grazing or mowing to stop a climax community forming and keep a heathland or meadow.", "There is often **conflict** between conservation and human needs such as farming or development, so management must balance them."]}], "pitfalls": ["Use **random** sampling to compare areas, and **systematic** (transect) sampling when there is a gradient.", "Mark-release-recapture is only valid if the **assumptions** hold. Learn them.", "In succession, each stage changes the **abiotic** environment so it suits new species. Pioneer species don't 'want' to help others.", "Interspecific = between species. Intraspecific = within a species."], "questions": [{"q": "What is an ecosystem?", "o": ["All the individuals of one species", "All the communities and the non-living components of an area", "A single habitat", "The role of a species"], "a": 1, "e": "An ecosystem includes the living community and the abiotic factors, and the interactions between them."}, {"q": "What is a niche?", "o": ["The role of a species in its habitat, governed by its adaptation to biotic and abiotic conditions", "Where an organism lives", "The number of individuals", "A type of community"], "a": 0, "e": "A niche includes how a species interacts with its environment and other organisms, not just where it lives."}, {"q": "What is carrying capacity?", "o": ["The number of species in an area", "The rate of population growth", "The maximum population size an ecosystem can support", "The energy in a food chain"], "a": 2, "e": "Carrying capacity is the largest population a habitat can sustain given its resources."}, {"q": "What is interspecific competition?", "o": ["Competition between members of the same species", "Predation", "Mutualism", "Competition between different species for the same resources"], "a": 3, "e": "Interspecific competition is between individuals of different species, e.g. red and grey squirrels."}, {"q": "What is intraspecific competition?", "o": ["Competition between individuals of the same species", "Competition between predators and prey", "Competition between different species", "Cooperation between species"], "a": 0, "e": "Individuals of the same species compete for the same resources, such as food, mates and territory."}, {"q": "Why do predator and prey populations often fluctuate in cycles?", "o": ["They both depend on light", "More prey lets predators increase; more predators reduce prey; fewer prey then reduce predators", "Predators are always more numerous", "Prey mutate more often"], "a": 1, "e": "Changes in one population affect the other with a time lag, creating cycles."}, {"q": "When should random quadrats be used rather than a transect?", "o": ["When studying a gradient", "When studying mobile animals", "When comparing the abundance of a species in two different areas", "When counting birds"], "a": 2, "e": "Random sampling avoids bias when comparing two areas. Transects are used along gradients."}, {"q": "When is a belt transect most suitable?", "o": ["For counting mobile animals", "For comparing two random fields", "For estimating population size of fish", "To study how distribution changes along an environmental gradient"], "a": 3, "e": "A transect samples at regular intervals along a line, showing changes across a gradient such as from a shore inland."}, {"q": "In mark-release-recapture, 40 snails are marked. In a second sample of 50, 10 are marked. What is the estimated population?", "o": ["200", "100", "500", "2000"], "a": 0, "e": "Population = (40 × 50) ÷ 10 = 200."}, {"q": "Which is an assumption of mark-release-recapture?", "o": ["Marked individuals stay in one place", "Marking doesn't affect the survival of individuals", "Many births occur between samples", "Marks wash off quickly"], "a": 1, "e": "If marks made animals more visible to predators, fewer would be recaptured, giving an overestimate."}, {"q": "Why must marked animals mix fully with the population before recapture?", "o": ["So they can reproduce", "So marks dry", "So the proportion marked in the second sample represents the whole population", "So they can't be recaptured"], "a": 2, "e": "If marked animals stay together, the second sample might contain too many or too few marked individuals."}, {"q": "What are pioneer species?", "o": ["The last species to colonise", "Climax species", "Predators", "The first species to colonise bare ground, adapted to harsh conditions"], "a": 3, "e": "Pioneer species, such as lichens, can survive with little soil or water, and start soil formation."}, {"q": "How does each stage of succession allow the next stage to colonise?", "o": ["It changes the abiotic environment, making it less hostile, e.g. forming soil", "It removes all nutrients", "It increases predation", "It makes the habitat more extreme"], "a": 0, "e": "Organisms change conditions, e.g. adding organic matter to soil, so new species can survive and may outcompete earlier ones."}, {"q": "What usually happens to biodiversity during succession?", "o": ["It decreases", "It increases", "It stays the same", "It drops to zero"], "a": 1, "e": "As conditions become less hostile, more species can survive, so biodiversity generally increases."}, {"q": "What is a climax community?", "o": ["The first community to colonise", "A community after a fire", "The final stable community at the end of succession", "A community of pioneer species"], "a": 2, "e": "The climax community is stable and stays the same unless disturbed."}, {"q": "How is succession managed to conserve a heathland?", "o": ["By planting trees", "By leaving it untouched", "By adding fertilisers", "By grazing, mowing or controlled burning to prevent later stages taking over"], "a": 3, "e": "Stopping succession from progressing keeps the plagioclimax community, such as heathland, and its species."}, {"q": "What is secondary succession?", "o": ["Succession on land where soil already exists, e.g. after a fire", "Succession on bare rock", "Succession in the sea", "The final stage of succession"], "a": 0, "e": "Secondary succession starts from soil, so it is usually faster than primary succession."}, {"q": "Percentage cover is used rather than counting individual plants when:", "o": ["Plants are large", "Individual plants are hard to count, e.g. grass", "Plants are rare", "The area is small"], "a": 1, "e": "For plants that grow in mats or clumps, estimating cover is quicker and more practical."}, {"q": "Which statistical test checks whether the abundance of a species is correlated with an environmental factor?", "o": ["Chi-squared", "Standard deviation", "Spearman's rank correlation", "Hardy–Weinberg"], "a": 2, "e": "Spearman's rank tests for a correlation between two variables. Correlation doesn't prove causation."}, {"q": "Which is an abiotic factor?", "o": ["Predation", "Competition", "Disease", "Soil pH"], "a": 3, "e": "Abiotic factors are non-living, such as pH, light, temperature and water."}, {"q": "Why is there often conflict over conservation?", "o": ["Human needs such as farming or building compete with protecting habitats", "Conservation increases biodiversity", "All species are protected", "Succession stops naturally"], "a": 0, "e": "Land used for food or development can't also be a protected habitat, so management balances different needs."}, {"q": "In RP12, why should many quadrats be used?", "o": ["To increase bias", "So that the sample is representative; use enough that the running mean levels off", "To reduce the area sampled", "Because quadrats are cheap"], "a": 1, "e": "A larger sample reduces the effect of anomalies and gives a more reliable mean."}]}, {"id": "3.8a", "order": 29, "section": "3.8", "spec": "3.8.1–3.8.2.1", "title": "Gene mutations and stem cells", "desc": "Types of gene mutation and their effects, totipotent, pluripotent, multipotent and unipotent stem cells, induced pluripotent stem cells and their uses.", "practicals": [], "summary": [{"h": "Types of gene mutation", "p": ["Gene mutations can involve **addition**, **deletion**, **substitution**, **inversion**, **duplication** or **translocation** of bases.", "**Substitution**: one base replaced. May change one amino acid, or none (degenerate code), or create a stop codon.", "**Addition, deletion** (and duplication): cause a **frame shift**, changing every triplet after the mutation.", "**Inversion**: a group of bases is reversed. **Translocation**: a group of bases moves to a different place, possibly on another chromosome.", "Mutations can change the amino acid sequence, so the **tertiary structure** and **function** of the protein may change.", "Mutations happen **spontaneously**. The rate is increased by **mutagenic agents**. Some mutations are harmful, some neutral, a few beneficial."]}, {"h": "Stem cells", "p": ["**Stem cells** are **undifferentiated** cells that can divide continuously and become specialised.", "**Totipotent**: can divide and produce **any type of body cell**, including extra-embryonic (placenta) cells. Found only in the early embryo.", "During development, totipotent cells **translate only part of their DNA**, so they become specialised.", "**Pluripotent**: found in **embryos**; can become almost any cell type, but not extra-embryonic cells.", "**Multipotent**: found in **mature mammals**; can become a **limited number** of cell types, e.g. bone marrow stem cells forming blood cells.", "**Unipotent**: can become only **one type** of cell, e.g. the cells that form **cardiomyocytes** (heart muscle cells)."]}, {"h": "Induced pluripotent stem cells (iPS cells)", "p": ["**iPS cells** are made from adult **unipotent** body cells by using appropriate **transcription factors** to switch on genes that had been switched off.", "Uses: treating disorders, e.g. replacing damaged cells. Because iPS cells come from the patient's own cells, there is less risk of **rejection**.", "Ethical issues: embryonic stem cells involve destroying embryos. iPS cells avoid this, but they may carry a risk of causing tumours."]}], "pitfalls": ["Totipotent cells can also form **placenta** cells. Pluripotent can't. That is the key difference.", "Cells specialise because only **part of the DNA is translated**. All cells still contain the full genome.", "iPS cells are made using **transcription factors**, not by changing the DNA sequence."], "questions": [{"q": "Which type of mutation causes a frame shift?", "o": ["Substitution", "Deletion", "Inversion within a triplet", "Silent mutation"], "a": 1, "e": "Removing a base shifts the reading frame, so every following triplet changes."}, {"q": "What is a translocation mutation?", "o": ["A group of bases moves to a different position, possibly on another chromosome", "One base is replaced", "Bases are reversed", "A base is added"], "a": 0, "e": "In translocation, a section of DNA breaks off and attaches elsewhere in the genome."}, {"q": "What is an inversion mutation?", "o": ["One base is deleted", "A section is copied", "A section of bases is reversed", "A section moves to another chromosome"], "a": 2, "e": "In an inversion, a group of bases breaks off and rejoins in reverse order."}, {"q": "What is a duplication mutation?", "o": ["A base is replaced", "Bases are reversed", "A base is removed", "One or more bases are repeated"], "a": 3, "e": "Duplication repeats bases. Like addition, it can cause a frame shift."}, {"q": "A substitution produces a stop codon in the middle of a gene. What is the likely effect?", "o": ["A shortened, usually non-functional polypeptide", "No change", "A longer polypeptide", "A frame shift"], "a": 0, "e": "Translation stops early, so the polypeptide is incomplete and likely won't fold correctly."}, {"q": "How can a gene mutation change the function of a protein?", "o": ["It changes the DNA into RNA", "It changes the amino acid sequence, so the tertiary structure changes", "It removes all peptide bonds", "It stops transcription in all cells"], "a": 1, "e": "A different primary structure can change how the protein folds, altering its shape and function."}, {"q": "What is a stem cell?", "o": ["A specialised cell", "A cell in the plant stem only", "An undifferentiated cell that can divide and become specialised", "A cell that can't divide"], "a": 2, "e": "Stem cells are undifferentiated, keep the ability to divide, and can develop into other cell types."}, {"q": "Which type of stem cell can produce any body cell, including placenta cells?", "o": ["Pluripotent", "Multipotent", "Unipotent", "Totipotent"], "a": 3, "e": "Totipotent cells, from the very early embryo, can form all body cells and extra-embryonic cells."}, {"q": "Where are pluripotent stem cells found?", "o": ["In embryos", "Only in bone marrow", "In heart muscle", "In plant roots only"], "a": 0, "e": "Pluripotent stem cells are found in embryos and can become almost any type of cell."}, {"q": "Bone marrow stem cells can form several types of blood cell. What type are they?", "o": ["Totipotent", "Multipotent", "Unipotent", "Pluripotent"], "a": 1, "e": "Multipotent stem cells in adults can produce a limited range of cell types."}, {"q": "What is an example of unipotent stem cells?", "o": ["Embryonic cells", "Bone marrow cells", "Cells that form cardiomyocytes (heart muscle cells)", "Zygotes"], "a": 2, "e": "Unipotent cells can only differentiate into one type of cell, such as cardiomyocytes."}, {"q": "How do totipotent cells become specialised?", "o": ["They lose genes", "They mutate", "They gain DNA", "Only part of their DNA is translated"], "a": 3, "e": "All the genes are still present, but only some are expressed, so the cell develops specific proteins and functions."}, {"q": "How are induced pluripotent stem cells (iPS cells) made?", "o": ["Adult unipotent cells are treated with transcription factors that switch on genes that had been switched off", "Embryos are destroyed", "Bone marrow is transplanted", "Cells are exposed to radiation"], "a": 0, "e": "Specific transcription factors reactivate genes, making the adult cells behave like pluripotent stem cells."}, {"q": "Why are iPS cells less likely to be rejected than donor stem cells?", "o": ["They have no antigens", "They are made from the patient's own cells, so they have the patient's own antigens", "They are made from embryos", "They divide more slowly"], "a": 1, "e": "Cells with the patient's own antigens aren't recognised as foreign by the immune system."}, {"q": "What is the main ethical advantage of iPS cells over embryonic stem cells?", "o": ["They are cheaper", "They divide faster", "No embryos are destroyed", "They can form placenta"], "a": 2, "e": "Obtaining embryonic stem cells destroys embryos. iPS cells come from adult tissue."}, {"q": "Which is a possible risk of using stem cells in treatment?", "o": ["They can't divide", "They have no DNA", "They are always rejected", "They might divide uncontrollably and form tumours"], "a": 3, "e": "Because stem cells keep dividing, there is a risk they form tumours."}, {"q": "Mutations occur spontaneously. What effect do mutagenic agents have?", "o": ["They increase the rate of mutation", "They prevent mutation", "They repair DNA", "They cause only beneficial mutations"], "a": 0, "e": "Agents such as U
