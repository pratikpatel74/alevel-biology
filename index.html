V, ionising radiation and some chemicals increase how often mutations happen."}, {"q": "Why might a substitution mutation have no effect on the protein?", "o": ["It causes a frame shift", "The new triplet codes for the same amino acid (degenerate code)", "It always produces a stop codon", "It changes many amino acids"], "a": 1, "e": "Because the code is degenerate, some substitutions don't change the amino acid."}, {"q": "Which type of stem cell can become almost any cell type but not extra-embryonic cells?", "o": ["Totipotent", "Unipotent", "Pluripotent", "Multipotent"], "a": 2, "e": "Pluripotent cells can form all body cell types, but not the placenta."}, {"q": "Why does an addition mutation usually have a larger effect than an inversion?", "o": ["It changes only one amino acid", "Inversions always cause frame shifts", "Additions are always silent", "An addition causes a frame shift, changing all following triplets"], "a": 3, "e": "An inversion changes bases only within one section. An addition shifts every triplet after it."}, {"q": "Stem cells could be used to treat which kind of condition?", "o": ["Conditions where cells are damaged or lost, e.g. heart damage or some blood disorders", "Bacterial infections", "Viral infections only", "Broken bones only"], "a": 0, "e": "Stem cells can replace damaged or lost cells, e.g. bone marrow transplants for blood disorders."}, {"q": "All specialised cells in an organism contain the same genes. Why do they have different functions?", "o": ["They contain different chromosomes", "Different genes are expressed in different cells", "Some cells lose their nucleus", "They mutate differently"], "a": 1, "e": "Each cell type switches on the genes it needs and switches off others."}]}, {"id": "3.8b", "order": 30, "section": "3.8", "spec": "3.8.2.2–3.8.2.3", "title": "Gene expression, epigenetics and cancer", "desc": "Transcription factors and oestrogen, RNA interference, epigenetic control by methylation and acetylation, tumours, oncogenes and tumour suppressor genes.", "practicals": [], "summary": [{"h": "Regulating transcription", "p": ["In eukaryotes, transcription of target genes can be **stimulated or inhibited** when specific **transcription factors** move from the **cytoplasm into the nucleus**.", "Transcription factors bind to a specific **promoter** region of DNA, helping or blocking **RNA polymerase** binding.", "**Oestrogen** is a lipid-soluble steroid hormone. It **diffuses** through the cell membrane and binds to a **receptor** on a transcription factor in the cytoplasm.", "This changes the transcription factor's shape, releasing it from an inhibitor. It enters the nucleus, binds to DNA and **stimulates transcription**."]}, {"h": "Epigenetics", "p": ["**Epigenetics**: heritable changes in gene function **without changes to the base sequence** of DNA. Caused by changes in the environment that **inhibit transcription**.", "**Increased methylation of DNA**: methyl groups added to **cytosine** in the promoter region. This prevents transcription factors binding, so the gene is **switched off**.", "**Decreased acetylation of histones**: DNA wraps more **tightly** around histones (condensed chromatin), so transcription factors can't access it. The gene is **switched off**.", "Epigenetic changes can be passed on to daughter cells, and may play a role in diseases such as cancer. Drugs can target these marks."]}, {"h": "RNA interference (RNAi)", "p": ["Translation of mRNA can be inhibited by **RNA interference**.", "Small double-stranded RNA (e.g. **siRNA**) is processed into single strands that bind to a protein complex.", "The single strand binds to **complementary mRNA**, and the mRNA is **cut up** (hydrolysed), so it can't be translated."]}, {"h": "Tumours and cancer", "p": ["A **tumour** forms from **uncontrolled cell division** (mitosis).", "**Benign** tumours: grow slowly, are surrounded by a capsule, don't spread, and cells stay specialised.", "**Malignant** tumours (cancers): grow rapidly, can **spread** to other tissues (**metastasis**) through the blood or lymph, and cells become unspecialised.", "**Oncogenes**: mutated forms of **proto-oncogenes**. They can be **permanently activated**, causing continuous cell division.", "**Tumour suppressor genes** normally slow cell division or cause apoptosis. Mutation can **inactivate** them, so division is uncontrolled.", "**Abnormal methylation**: **hypermethylation** of tumour suppressor genes switches them off. **Hypomethylation** of oncogenes switches them on.", "**Increased oestrogen** concentrations are linked to some **breast cancers**, by stimulating transcription of genes that promote cell division."]}], "pitfalls": ["Epigenetic changes **don't alter the base sequence**. That's the defining feature.", "**More** methylation switches genes **off**. **Less** acetylation also switches genes **off**.", "Oncogenes cause cancer when **activated**. Tumour suppressor genes cause cancer when **inactivated**.", "RNAi works on **mRNA**, after transcription, not on DNA."], "questions": [{"q": "What is a transcription factor?", "o": ["An enzyme that joins nucleotides", "A protein that binds to a specific DNA promoter region to stimulate or inhibit transcription", "A type of mRNA", "A hormone made in the nucleus"], "a": 1, "e": "Transcription factors move from the cytoplasm into the nucleus and bind to promoters, controlling whether RNA polymerase can transcribe a gene."}, {"q": "How does oestrogen enter a cell?", "o": ["It diffuses through the phospholipid bilayer because it is lipid-soluble", "By active transport", "Through a channel protein", "By co-transport"], "a": 0, "e": "Oestrogen is a steroid hormone, so it can diffuse straight through the membrane."}, {"q": "How does oestrogen stimulate transcription?", "o": ["It binds directly to RNA polymerase", "It changes the DNA sequence", "It binds to a receptor on a transcription factor, releasing it to enter the nucleus and bind DNA", "It cuts mRNA"], "a": 2, "e": "Binding changes the transcription factor's shape, freeing it from an inhibitor so it can activate transcription."}, {"q": "What is epigenetics?", "o": ["Changes in the base sequence of DNA", "Mutation of a gene", "Translation of mRNA", "Heritable changes in gene function without changes to the base sequence of DNA"], "a": 3, "e": "Epigenetic changes affect whether genes are expressed, without altering the DNA sequence."}, {"q": "How does increased methylation of DNA affect a gene?", "o": ["It inhibits transcription, switching the gene off", "It stimulates transcription", "It causes a frame shift", "It creates a stop codon"], "a": 0, "e": "Methyl groups on cytosine in the promoter stop transcription factors binding, so the gene isn't transcribed."}, {"q": "How does decreased acetylation of histones affect transcription?", "o": ["DNA becomes looser and transcription increases", "Chromatin becomes more condensed, so transcription factors can't access the DNA and transcription is inhibited", "It has no effect", "It creates more histones"], "a": 1, "e": "Less acetylation makes histones bind DNA more tightly, so the gene is less accessible."}, {"q": "Which base is methylated in epigenetic control?", "o": ["Adenine", "Thymine", "Cytosine", "Uracil"], "a": 2, "e": "Methyl groups are added to cytosine bases, usually in promoter regions."}, {"q": "What is RNA interference?", "o": ["Addition of methyl groups to DNA", "Splicing of pre-mRNA", "Binding of transcription factors", "Small RNA binding to complementary mRNA, causing it to be cut up so it isn't translated"], "a": 3, "e": "siRNA guides a protein complex to complementary mRNA, which is then broken down."}, {"q": "At which stage does RNA interference affect gene expression?", "o": ["Translation", "Transcription", "DNA replication", "Mitosis"], "a": 0, "e": "RNAi destroys mRNA, so translation is prevented. Transcription has already happened."}, {"q": "Which is a feature of a malignant tumour?", "o": ["Grows slowly and stays in one place", "Can spread to other parts of the body (metastasis)", "Is surrounded by a capsule", "Cells remain specialised"], "a": 1, "e": "Malignant tumours invade nearby tissue and can spread through the blood or lymph to form secondary tumours."}, {"q": "Which is a feature of a benign tumour?", "o": ["Spreads by metastasis", "Grows very rapidly", "Is usually surrounded by a capsule and doesn't spread", "Cells become unspecialised"], "a": 2, "e": "Benign tumours grow slowly within a capsule and don't invade other tissues, though they can still cause harm by pressure."}, {"q": "What is an oncogene?", "o": ["A gene that slows cell division", "A gene that causes apoptosis", "A gene for methylation", "A mutated proto-oncogene that can cause uncontrolled cell division"], "a": 3, "e": "Oncogenes are permanently activated versions of genes that normally stimulate cell division."}, {"q": "How can a mutated tumour suppressor gene lead to cancer?", "o": ["It becomes inactivated, so it no longer slows cell division", "It becomes overactive", "It produces too many antibodies", "It stops mitosis"], "a": 0, "e": "Tumour suppressor genes normally restrain division. Inactivation removes this brake."}, {"q": "Hypermethylation of a tumour suppressor gene would:", "o": ["Increase its transcription", "Switch it off, increasing the risk of uncontrolled division", "Cause a deletion", "Have no effect"], "a": 1, "e": "Too much methylation stops transcription, so the protective protein isn't made."}, {"q": "Hypomethylation of an oncogene would:", "o": ["Switch it off", "Remove the gene", "Switch it on, increasing cell division", "Repair it"], "a": 2, "e": "Less methylation allows transcription, so the oncogene is expressed more."}, {"q": "How might increased oestrogen be linked to some breast cancers?", "o": ["It destroys tumour suppressor genes", "It causes mutations directly", "It stops apoptosis completely", "It stimulates transcription of genes that promote cell division"], "a": 3, "e": "Oestrogen activates transcription factors, which can switch on genes that increase cell division in breast tissue."}, {"q": "Where do transcription factors move from and to?", "o": ["From the cytoplasm into the nucleus", "From the nucleus to the ribosome", "From the blood to the nucleus", "From the mitochondria to the nucleus"], "a": 0, "e": "Transcription factors are made in the cytoplasm and move through nuclear pores into the nucleus."}, {"q": "What is a promoter region?", "o": ["The start codon on mRNA", "A region of DNA where transcription factors and RNA polymerase bind", "An intron", "A histone"], "a": 1, "e": "The promoter is the DNA sequence near a gene where transcription begins."}, {"q": "Why can epigenetic changes be passed to daughter cells?", "o": ["They change the base sequence", "They are stored in mRNA", "Methylation and histone patterns can be copied when cells divide", "They are carried in the blood"], "a": 2, "e": "Epigenetic marks can be maintained through mitosis, so daughter cells inherit the same pattern of gene expression."}, {"q": "What could cause epigenetic changes?", "o": ["Only mutations", "Only viruses", "Only meiosis", "Environmental factors such as diet, stress or chemicals"], "a": 3, "e": "Epigenetic changes are triggered by environmental factors that affect methylation or acetylation."}, {"q": "A drug increases acetylation of histones. What would it likely do to a silenced tumour suppressor gene?", "o": ["Switch it back on by loosening chromatin", "Silence it further", "Delete it", "Methylate it"], "a": 0, "e": "More acetylation loosens DNA from histones, making genes accessible for transcription again."}, {"q": "Which statement about cancer is correct?", "o": ["It is always caused by viruses", "It results from uncontrolled cell division caused by mutations or epigenetic changes", "It only affects old cells", "It is caused by meiosis"], "a": 1, "e": "Cancer involves loss of control of the cell cycle, through mutations or abnormal gene expression."}]}, {"id": "3.8c", "order": 31, "section": "3.8", "spec": "3.8.3–3.8.4", "title": "Genome projects and gene technologies", "desc": "Genome sequencing, producing DNA fragments, PCR and in vivo cloning, genetic modification, DNA probes and screening, and genetic fingerprinting.", "practicals": [], "summary": [{"h": "Genome projects", "p": ["Sequencing projects have read the genomes of many organisms, from bacteria to humans.", "In **simpler organisms** (e.g. bacteria), the genome can be used to determine the **proteome**, which could help identify antigens for **vaccines**.", "In **complex organisms**, the genome can't easily be translated into the proteome, because of **non-coding DNA** and **regulatory genes**.", "Sequencing methods are continually updated and **automated**, making them faster and cheaper."]}, {"h": "Making DNA fragments", "p": ["**Reverse transcriptase**: makes **cDNA** from **mRNA**. Useful because cells making a protein have lots of its mRNA, and it has **no introns**.", "**Restriction endonucleases**: cut DNA at specific **recognition sequences**. Many make a staggered cut, leaving **sticky ends**.", "**Gene machine**: synthesises the gene from nucleotides, based on a known amino acid sequence."]}, {"h": "PCR (in vitro amplification)", "p": ["**Polymerase chain reaction** makes many copies of a DNA fragment.", "Mix: DNA, **primers**, free **nucleotides** and **Taq polymerase** (heat-stable DNA polymerase).", "**95 °C**: DNA strands separate (hydrogen bonds break). **55 °C**: primers **anneal** to complementary bases at the ends. **72 °C**: Taq polymerase joins nucleotides.", "Each cycle **doubles** the DNA: after n cycles, there are 2ⁿ copies of each starting molecule."]}, {"h": "In vivo cloning", "p": ["Add a **promoter** and **terminator** region to the fragment, so it can be transcribed in the host.", "Cut a **vector** (e.g. a **plasmid**) with the **same restriction enzyme**, so the sticky ends are complementary.", "**DNA ligase** joins the fragment into the vector, forming **recombinant DNA**.", "**Transform** host cells (e.g. bacteria) by taking up the vector, helped by calcium ions and heat shock.", "Identify transformed cells using **marker genes**, e.g. antibiotic resistance, or genes for fluorescence or an enzyme that gives a colour change.", "**GMOs** have uses in agriculture, industry and medicine (e.g. insulin-producing bacteria). Issues include ethics, financial costs, and patents that may limit access in poorer countries.", "**Gene therapy** adds a working allele to treat a genetic disorder."]}, {"h": "DNA probes and screening", "p": ["A **DNA probe** is a short, single strand of DNA with a **label** (radioactive or fluorescent), complementary to a target allele.", "**DNA hybridisation**: the probe binds to complementary single-stranded DNA. Detecting the label shows the allele is present.", "Uses: **screening** for inherited conditions, drug responses, or health risks. Can lead to **genetic counselling** and **personalised medicine**."]}, {"h": "Genetic fingerprinting", "p": ["Genomes contain **variable number tandem repeats (VNTRs)**. The pattern of VNTR lengths is unique to each individual (except identical twins).", "DNA is extracted, amplified by PCR, cut with restriction enzymes, and separated by **gel electrophoresis**: DNA is negatively charged and moves towards the **positive electrode**; **smaller fragments move further**.", "Fragments are labelled with probes and compared.", "Uses: determining genetic relationships (paternity), genetic variability within a population, **forensic science**, medical diagnosis, and animal and plant **breeding**."]}], "pitfalls": ["Use the **same** restriction enzyme to cut the vector and gene, so the sticky ends are complementary.", "In PCR, **primers** stop the strands rejoining and give a starting point for Taq polymerase.", "In gel electrophoresis, **smaller** fragments travel **further**.", "cDNA from mRNA has **no introns**, which is why it works in bacteria (which can't splice)."], "questions": [{"q": "Why is it easier to determine the proteome of a bacterium than of a human from its genome?", "o": ["Bacteria have more genes", "Human genomes contain much non-coding DNA and regulatory genes", "Bacteria have no DNA", "Humans have no proteome"], "a": 1, "e": "Bacteria have little non-coding DNA. In complex organisms, non-coding and regulatory sequences make it hard to predict proteins from the genome."}, {"q": "What does reverse transcriptase do?", "o": ["Makes cDNA from mRNA", "Makes mRNA from DNA", "Cuts DNA", "Joins DNA fragments"], "a": 0, "e": "Reverse transcriptase uses mRNA as a template to make complementary DNA (cDNA)."}, {"q": "Why is using mRNA a good way to obtain a gene for a protein?", "o": ["mRNA contains introns", "mRNA is double-stranded", "Cells making the protein contain lots of its mRNA, and it has no introns", "mRNA is very stable"], "a": 2, "e": "Specialised cells produce many mRNA copies of the gene they express, and mRNA has already been spliced."}, {"q": "What are restriction endonucleases?", "o": ["Enzymes that join DNA fragments", "Enzymes that make DNA from RNA", "Heat-stable polymerases", "Enzymes that cut DNA at specific recognition sequences"], "a": 3, "e": "Each restriction enzyme cuts at a particular base sequence, often leaving sticky ends."}, {"q": "What are sticky ends?", "o": ["Short single-stranded overhangs left by a staggered cut", "Methyl groups", "Primers", "Promoter regions"], "a": 0, "e": "Staggered cuts leave unpaired bases that can base-pair with complementary sticky ends on other fragments."}, {"q": "What happens at 95 °C in PCR?", "o": ["Primers anneal", "DNA strands separate as hydrogen bonds break", "Taq polymerase joins nucleotides", "DNA is cut"], "a": 1, "e": "High temperature breaks hydrogen bonds between complementary bases, separating the strands."}, {"q": "Why is Taq polymerase used in PCR?", "o": ["It cuts DNA", "It works at low temperatures", "It is heat-stable, so it isn't denatured at high PCR temperatures", "It joins sticky ends"], "a": 2, "e": "Taq polymerase comes from a thermophilic bacterium, so it survives the 95 °C step."}, {"q": "What is the role of primers in PCR?", "o": ["To cut DNA", "To provide energy", "To label the DNA", "To bind to the ends of target DNA, giving Taq polymerase a starting point and stopping strands rejoining"], "a": 3, "e": "Primers are short complementary sequences that anneal at 55 °C and mark where copying starts."}, {"q": "Starting with one DNA molecule, how many copies are there after 5 PCR cycles?", "o": ["32", "10", "25", "5"], "a": 0, "e": "Each cycle doubles the DNA: 2⁵ = 32."}, {"q": "Why must the same restriction enzyme cut the vector and the DNA fragment?", "o": ["To make the DNA longer", "So the sticky ends are complementary and can join", "To remove introns", "To add a promoter"], "a": 1, "e": "The same enzyme produces matching sticky ends, which base-pair and are then joined by DNA ligase."}, {"q": "What is the role of DNA ligase in in vivo cloning?", "o": ["To cut plasmids", "To copy DNA", "To join the DNA fragment into the vector by forming phosphodiester bonds", "To transcribe the gene"], "a": 2, "e": "DNA ligase seals the sugar-phosphate backbone, making recombinant DNA."}, {"q": "Why are promoter and terminator regions added to a DNA fragment?", "o": ["To make it shorter", "To mark transformed cells", "To cut the plasmid", "So that the gene can be transcribed in the host cell"], "a": 3, "e": "The promoter allows RNA polymerase to bind and start transcription. The terminator stops it."}, {"q": "What is the purpose of marker genes in in vivo cloning?", "o": ["To identify cells that have taken up the recombinant DNA", "To cut DNA", "To speed up transcription", "To remove introns"], "a": 0, "e": "Marker genes, such as antibiotic resistance or fluorescence, show which cells were transformed."}, {"q": "What is a DNA probe?", "o": ["An enzyme that cuts DNA", "A short, labelled, single strand of DNA complementary to a target sequence", "A double-stranded plasmid", "A type of primer used in PCR only"], "a": 1, "e": "The probe binds to its complementary sequence, and its label (radioactive or fluorescent) shows where it bound."}, {"q": "What is DNA hybridisation?", "o": ["Cutting DNA with enzymes", "Copying DNA by PCR", "Binding of a single-stranded probe to complementary single-stranded DNA", "Joining sticky ends"], "a": 2, "e": "When DNA is made single-stranded, a probe can base-pair with its complementary sequence."}, {"q": "How can genetic screening lead to personalised medicine?", "o": ["It changes a person's DNA", "It removes faulty genes", "It cures all diseases", "It shows which alleles a person has, so treatments and doses can be matched to them"], "a": 3, "e": "Knowing someone's alleles can show how they will respond to drugs, so treatments can be personalised."}, {"q": "What are VNTRs?", "o": ["Variable number tandem repeats: non-coding sequences repeated a different number of times in different people", "Viral nucleic acids", "Types of restriction enzyme", "Coding regions of genes"], "a": 0, "e": "The number of repeats varies between individuals, giving each person a unique pattern."}, {"q": "In gel electrophoresis, which fragments move furthest?", "o": ["The largest fragments", "The smallest fragments", "Positively charged fragments", "Fragments with the most G and C"], "a": 1, "e": "Smaller fragments move more easily through the gel, so they travel further towards the positive electrode."}, {"q": "Why does DNA move towards the positive electrode in electrophoresis?", "o": ["DNA is positively charged", "It is pulled by the gel", "DNA is negatively charged because of its phosphate groups", "It is heavier"], "a": 2, "e": "Phosphate groups in the backbone give DNA an overall negative charge."}, {"q": "Which is NOT a use of genetic fingerprinting?", "o": ["Forensic science", "Paternity testing", "Animal and plant breeding", "Increasing an organism's mutation rate"], "a": 3, "e": "Genetic fingerprinting identifies individuals and relationships. It doesn't change DNA."}, {"q": "What is gene therapy?", "o": ["Inserting a working allele into cells to treat a genetic disorder", "Using drugs to cure infections", "Removing genes from bacteria", "Testing for alleles"], "a": 0, "e": "Gene therapy introduces functional alleles into a patient's cells to make up for faulty ones."}, {"q": "What is one concern about genetically modified crops?", "o": ["They always have lower yields", "Patents may stop poorer farmers accessing the seeds, and there may be ecological risks", "They contain no DNA", "They can't be grown"], "a": 1, "e": "Concerns include patents and costs limiting access, and possible effects on wild plants and ecosystems."}]}], "practicals": [{"n": 1, "year": 1, "unit": "3.1b", "spec": "3.1.4.2", "title": "Effect of a variable on the rate of an enzyme-controlled reaction", "aim": "Measure how one factor (usually temperature, pH, or enzyme or substrate concentration) changes the initial rate of an enzyme-controlled reaction, e.g. trypsin digesting casein in milk powder, or catalase breaking down hydrogen peroxide.", "method": ["Set up a water bath at the chosen temperature and let the enzyme and substrate solutions **equilibrate separately** for about 10 minutes before mixing.", "Add a buffer of known pH so pH stays constant (unless pH is the independent variable).", "Mix the enzyme and substrate, start the stopwatch immediately and record the change over time, e.g. time for cloudy milk to clear, or volume of oxygen collected in a gas syringe at regular intervals.", "Repeat at least three times at each value of the independent variable and calculate a mean.", "Plot product formed (or substrate used) against time. Draw a **tangent at t = 0** to find the initial rate, or use rate = 1/time for end-point methods."], "iv": "Temperature, pH, or enzyme or s function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('theme', next);
  const b = $('#theme-btn'); if (b) b.innerHTML = isDark() ? ICON_SUN : ICON_MOON;
}

  $('#app').innerHTML = topbar(`<a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="page wrap"><div class="page-head"><div class="page-eyebrow">Practical skills · Apparatus and techniques</div><h1 class="page-title">Required practicals</h1>
  <p class="page-sub">Practicals 1–6 are Year 1 content and 7–12 are Year 2. Questions on them can appear on any paper.</p></div>
  ${list.map(rpCard).join('')}${list.length < 12 ? `<div class="pending">${12 - list.length} more practicals being written.</div>` : ''}</main>` + footer();
  if (focus) { const el = document.getElementById('rp-card-' + focus); if (el) el.scrollIntoView(); }
}

/* ---------- Quiz ---------- */
const DRAW = 10;
let Q = null, timerInterval = null;
function renderQuiz(u, retry) {
  clearInterval(timerInterval);
  let pool = u.questions.map((q, i) => Object.assign({ _id: i }, q));
  if (retry) {
    const m = store.get('missed_' + u.id, []);
    const p2 = pool.filter(q => m.includes(q._id));
    if (p2.length) pool = p2;
  } else store.del('missed_' + u.id);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  Q = { u, qs: pool.slice(0, Math.min(DRAW, pool.length)), cur: 0, score: 0, answered: false, done: false, timer: store.get('timer', false), secs: 60 };
  const cls = secClass(u);
  $('#app').innerHTML = topbar(`<button class="pill-btn ${Q.timer ? 'active' : ''}" id="timer-btn" onclick="toggleTimer()">Timer: ${Q.timer ? 'On' : 'Off'}</button><a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="quiz wrap ${cls}"><div class="quiz-head"><div class="page-eyebrow">${esc(u.section)} · Spec ${esc(u.spec)}</div><h1 class="page-title">${esc(u.title)}</h1>
  <p class="page-sub">${retry ? 'Retrying the questions you missed' : `10 questions drawn from a pool of ${u.questions.length}`} · <a href="#s-${u.id}">Read the summary</a></p></div>
  <div id="qa"></div></main>` + footer();
  drawQ();
}
function drawQ() {
  const q = Q.qs[Q.cur], L = ['A', 'B', 'C', 'D'];
  Q.answered = false;
  $('#qa').innerHTML = `<div class="prog-label"><span>Question ${Q.cur + 1} of ${Q.qs.length}</span><span>Score: ${Q.score}</span></div>
  <div class="prog"><div style="width:${(Q.cur + 1) / Q.qs.length * 100}%"></div></div>
  <div class="q-card"><div class="q-num"><span>Question ${Q.cur + 1}</span>${Q.timer ? `<span class="q-timer" id="q-timer">60s</span>` : ''}</div>
  <div class="q-text">${fmt(q.q)}</div><div class="options">${q.o.map((o, i) => `<button class="option" id="opt${i}" onclick="pick(${i})"><span class="letter">${L[i]}</span><span>${fmt(o)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>
  <div class="quiz-foot"><span class="key-hint">Keys: 1–4 to answer · Enter for next</span><button class="btn-next" id="next" hidden onclick="nextQ()">Next →</button></div>`;
  if (Q.timer) startTimer();
}
function startTimer() {
  clearInterval(timerInterval); Q.secs = 60;
  timerInterval = setInterval(() => {
    Q.secs--; const el = $('#q-timer');
    if (el) { el.textContent = Q.secs + 's'; if (Q.secs <= 10) el.classList.add('warn'); }
    if (Q.secs <= 0) { clearInterval(timerInterval); pick(-1); }
  }, 1000);
}
function pick(i) {
  if (!Q || Q.answered || Q.done) return;
  Q.answered = true; clearInterval(timerInterval);
  const q = Q.qs[Q.cur];
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  const ok = i === q.a;
  if (ok) Q.score++;
  else {
    if (i >= 0) $('#opt' + i).classList.add('wrong');
    const m = store.get('missed_' + Q.u.id, []); if (!m.includes(q._id)) { m.push(q._id); store.set('missed_' + Q.u.id, m); }
  }
  $('#opt' + q.a).classList.add('correct');
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'correct' : 'wrong'}"><b>${ok ? 'Correct.' : i === -1 ? "Time's up." : 'Not quite.'}</b> ${fmt(q.e)}</div>`;
  const nb = $('#next'); nb.hidden = false; nb.textContent = Q.cur < Q.qs.length - 1 ? 'Next →' : 'See results'; nb.focus({ preventScroll: true });
  document.querySelector('.prog-label span:last-child').textContent = 'Score: ' + Q.score;
}
function nextQ() { if (!Q.answered) return; Q.cur++; if (Q.cur >= Q.qs.length) return showResult(); drawQ(); window.scrollTo(0, 0); }
function showResult() {
  Q.done = true; clearInterval(timerInterval);
  const pct = Math.round(Q.score / Q.qs.length * 100);
  store.set('last_' + Q.u.id, { score: Q.score, total: Q.qs.length, pct, date: new Date().toISOString() });
  const missed = store.get('missed_' + Q.u.id, []).length;
  const msg = pct >= 80 ? 'Excellent. This topic is in good shape.' : pct >= 60 ? 'Good effort. Read the explanations for the ones you missed.' : 'Worth another pass through the summary, then retry.';
  $('#qa').innerHTML = `<div class="result"><div class="result-score">${Q.score}/${Q.qs.length}</div><div class="result-pct">${pct}% correct</div><div class="result-msg">${msg}</div>
  <div class="actions"><button class="btn primary" onclick="renderQuiz(Q.u,false)">New quiz</button>${missed ? `<button class="btn warn" onclick="renderQuiz(Q.u,true)">Retry ${missed} missed</button>` : ''}<a class="btn" href="#s-${Q.u.id}">Summary</a><a class="btn" href="#hub">Hub</a></div></div>`;
}
function toggleTimer() {
  Q.timer = !Q.timer; store.set('timer', Q.timer);
  const b = $('#timer-btn'); b.textContent = 'Timer: ' + (Q.timer ? 'On' : 'Off'); b.classList.toggle('active', Q.timer);
}
document.addEventListener('keydown', e => {
  if (!Q || Q.done || !$('#qa')) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (!Q.answered && ['1', '2', '3', '4'].includes(e.key)) pick(+e.key - 1);
  else if (Q.answered && (e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.id !== 'next') { e.preventDefault(); nextQ(); }
});

/* ---------- Router ---------- */
function route() {
  clearInterval(timerInterval); Q = null;
  const h = location.hash.replace('#', '');
  let m;
  if ((m = h.match(/^q-(.+)$/)) && unitById(m[1])) renderQuiz(unitById(m[1]), false);
  else if ((m = h.match(/^s-(.+)$/)) && unitById(m[1])) renderSummary(unitById(m[1]));
  else if (h === 'practicals') renderPracticals();
  else if ((m = h.match(/^rp-(\d+)$/))) renderPracticals(m[1]);
  else renderHub();
  if (!/^rp-/.test(h)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
