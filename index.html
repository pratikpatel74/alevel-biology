<title>AQA Biology Study Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: Finance Study Hub design carried over — dark-first, gold brand accent, one colour per AQA spec section. */
:root {
  color-scheme: dark;
  --bg:#09090f; --surface:#111118; --card:#16161e; --card-hover:#1c1c26;
  --border:#2a2a38; --border-hi:#3d3d52; --text:#f0efff; --muted:#8b8aab; --dim:#6a6985;
  --gold:#e8b84b; --gold-dim:#a8832a; --gold-bg:rgba(232,184,75,0.08);
  --topbar:rgba(9,9,15,0.85);
  --correct:#34d399; --correct-bg:rgba(52,211,153,0.12); --wrong:#f87171; --wrong-bg:rgba(248,113,113,0.12);
  --on-accent:#0b0b12;
  --s1:#818cf8; --s2:#38bdf8; --s3:#2dd4bf; --s4:#a78bfa; --s5:#fbbf24; --s6:#fb7185; --s7:#34d399; --s8:#e879f9;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#f5f4f0; --surface:#eeede8; --card:#ffffff; --card-hover:#fafaf8;
    --border:#dddbd4; --border-hi:#c8c5bc; --text:#1a1814; --muted:#635f54; --dim:#8a867a;
    --gold:#9a6f12; --gold-dim:#c9982c; --gold-bg:rgba(184,134,26,0.08);
    --topbar:rgba(245,244,240,0.9);
    --correct:#047857; --correct-bg:rgba(5,150,105,0.10); --wrong:#c81e1e; --wrong-bg:rgba(220,38,38,0.09);
    --on-accent:#ffffff;
    --s1:#4f46e5; --s2:#0369a1; --s3:#0f766e; --s4:#6d28d9; --s5:#b45309; --s6:#be123c; --s7:#047857; --s8:#a21caf;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#f5f4f0; --surface:#eeede8; --card:#ffffff; --card-hover:#fafaf8;
  --border:#dddbd4; --border-hi:#c8c5bc; --text:#1a1814; --muted:#635f54; --dim:#8a867a;
  --gold:#9a6f12; --gold-dim:#c9982c; --gold-bg:rgba(184,134,26,0.08);
  --topbar:rgba(245,244,240,0.9);
  --correct:#047857; --correct-bg:rgba(5,150,105,0.10); --wrong:#c81e1e; --wrong-bg:rgba(220,38,38,0.09);
  --on-accent:#ffffff;
  --s1:#4f46e5; --s2:#0369a1; --s3:#0f766e; --s4:#6d28d9; --s5:#b45309; --s6:#be123c; --s7:#047857; --s8:#a21caf;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.5; min-height:100%; }
button { font-family:inherit; }
a { color:inherit; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

.sec1{--acc:var(--s1)} .sec2{--acc:var(--s2)} .sec3{--acc:var(--s3)} .sec4{--acc:var(--s4)}
.sec5{--acc:var(--s5)} .sec6{--acc:var(--s6)} .sec7{--acc:var(--s7)} .sec8{--acc:var(--s8)}

/* Top bar */
.topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--topbar);
  backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--border); height:52px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.brand { font-size:0.92rem; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:var(--text); }
.brand span { font-size:0.66rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; background:var(--gold-bg); color:var(--gold); border:1px solid var(--gold-dim); border-radius:4px; padding:2px 8px; white-space:nowrap; }
.brand b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
.top-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.icon-btn, .pill-btn { background:var(--surface); border:1px solid var(--border); border-radius:8px; height:34px; cursor:pointer; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
.icon-btn { width:34px; }
.icon-btn svg { width:16px; height:16px; }
.pill-btn { padding:0 12px; font-size:0.74rem; font-weight:700; white-space:nowrap; }
.icon-btn:hover, .pill-btn:hover { border-color:var(--border-hi); color:var(--text); }
.pill-btn.active { border-color:var(--correct); color:var(--correct); background:var(--correct-bg); }

.wrap { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }

/* Hero */
.hero { padding-block:64px 52px; text-align:center; position:relative; overflow:hidden; }
.hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 0%, var(--gold-bg) 0%, transparent 70%); pointer-events:none; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin-bottom:20px; }
.eyebrow::before, .eyebrow::after { content:''; width:28px; height:1px; background:var(--gold-dim); }
.hero h1 { font-size:clamp(2.2rem, 7vw, 3.8rem); font-weight:800; line-height:1.05; letter-spacing:-0.03em; margin-bottom:14px; text-wrap:balance; }
.hero h1 em { font-style:italic; color:var(--gold); }
.hero-sub { color:var(--muted); font-size:1rem; max-width:470px; margin:0 auto 34px; line-height:1.7; }
.stats { display:inline-flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); position:relative; }
.stat { padding:14px 26px; text-align:center; border-right:1px solid var(--border); }
.stat:last-child { border-right:none; }
.stat-num { font-size:1.6rem; font-weight:800; color:var(--gold); line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.stat-label { font-size:0.66rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); margin-top:4px; }

/* Hub */
.main { max-width:900px; margin:0 auto; padding-block:24px 72px; }
.year-tabs { display:flex; gap:8px; margin-bottom:32px; flex-wrap:wrap; }
.year-tab { background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:0.8rem; font-weight:700; cursor:pointer; }
.year-tab[aria-pressed="true"] { background:var(--gold-bg); color:var(--gold); border-color:var(--gold-dim); }
.year-tab small { font-weight:500; opacity:0.8; margin-left:4px; }
.sec-block { margin-bottom:40px; }
.section-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.section-head .code { font-size:0.72rem; font-weight:800; color:var(--acc); letter-spacing:0.04em; font-variant-numeric:tabular-nums; }
.section-head .label { font-size:0.72rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
.section-head .line { flex:1; height:1px; background:var(--border); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap:14px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s, transform .2s, background .2s; min-width:0; }
.card:hover { border-color:var(--border-hi); background:var(--card-hover); transform:translateY(-2px); }
.card-accent { height:2px; background:var(--acc); }
.card-body { padding:20px; flex:1; display:flex; flex-direction:column; }
.card-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.sec-badge { width:44px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:color-mix(in srgb, var(--acc) 12%, transparent); color:var(--acc); font-size:0.78rem; font-weight:800; font-variant-numeric:tabular-nums; }
.card-meta { min-width:0; flex:1; }
.card-num { font-size:0.64rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
.card-title { font-size:1rem; font-weight:700; line-height:1.25; letter-spacing:-0.01em; text-wrap:balance; }
.score { font-size:0.66rem; font-weight:700; padding:2px 8px; border-radius:5px; letter-spacing:0.04em; margin-top:3px; white-space:nowrap; }
.score.pass { background:var(--correct-bg); color:var(--correct); }
.score.fail { background:var(--wrong-bg); color:var(--wrong); }
.divider { height:1px; background:var(--border); margin-bottom:12px; }
.card-desc { color:var(--muted); font-size:0.835rem; line-height:1.6; flex:1; margin-bottom:18px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-size:0.78rem; font-weight:600; text-decoration:none; border:1px solid var(--border); cursor:pointer; background:var(--surface); color:var(--muted); transition:opacity .15s, transform .12s, border-color .15s, color .15s; }
.btn:hover { border-color:var(--border-hi); color:var(--text); transform:translateY(-1px); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--on-accent); }
.btn.primary:hover { color:var(--on-accent); opacity:0.88; }
.btn.off { opacity:0.4; pointer-events:none; }
.rp-banner { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:36px; }
.rp-banner h2 { font-size:1rem; font-weight:700; }
.rp-banner p { color:var(--muted); font-size:0.84rem; }
.pending { border:1px dashed var(--border-hi); border-radius:14px; padding:20px; color:var(--dim); font-size:0.85rem; }

/* Reading views */
.page { max-width:720px; margin:0 auto; padding-block:40px 80px; }
.page-head { margin-bottom:32px; }
.page-eyebrow { font-size:0.68rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--acc, var(--gold)); margin-bottom:10px; }
.page-title { font-size:clamp(1.6rem, 5vw, 2.1rem); font-weight:800; letter-spacing:-0.03em; line-height:1.15; text-wrap:balance; margin-bottom:8px; }
.page-sub { color:var(--muted); font-size:0.92rem; max-width:62ch; }
.sum-sec { margin-bottom:30px; }
.sum-sec h2 { font-size:1.08rem; font-weight:700; letter-spacing:-0.01em; margin-bottom:12px; display:flex; gap:10px; align-items:baseline; }
.sum-sec h2 .n { color:var(--acc); font-size:0.8rem; font-weight:800; font-variant-numeric:tabular-nums; }
.sum-sec ul { list-style:none; display:flex; flex-direction:column; gap:8px; }
.sum-sec li { position:relative; padding-left:18px; font-size:0.93rem; line-height:1.65; max-width:68ch; }
.sum-sec li::before { content:''; position:absolute; left:2px; top:0.68em; width:6px; height:6px; border-radius:2px; background:var(--acc); opacity:0.7; }
.sum-sec li strong, .rp li strong { font-weight:700; color:var(--text); }
.callout { background:var(--wrong-bg); border:1px solid color-mix(in srgb, var(--wrong) 40%, transparent); border-radius:12px; padding:18px 20px; margin-bottom:30px; }
.callout h2 { font-size:0.74rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--wrong); margin-bottom:10px; }
.callout ul { padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:0.9rem; line-height:1.6; }
.eq { font-variant-numeric:tabular-nums; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:1px 6px; overflow-wrap:anywhere; }
.page-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }

.rp { scroll-margin-top:68px; min-width:0; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:16px; }
.rp-top { display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
.rp-no { font-size:0.7rem; font-weight:800; letter-spacing:0.08em; background:color-mix(in srgb, var(--acc) 14%, transparent); color:var(--acc); border-radius:6px; padding:4px 8px; white-space:nowrap; }
.rp-top h3 { font-size:1rem; font-weight:700; line-height:1.3; }
.rp-top .spec { font-size:0.74rem; color:var(--dim); margin-top:2px; }
.rp h4 { font-size:0.68rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin:14px 0 6px; }
.rp ol, .rp ul { padding-left:20px; display:flex; flex-direction:column; gap:5px; font-size:0.9rem; line-height:1.6; }
.vars { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,180px),1fr)); gap:8px; }
.var { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:0.84rem; min-width:0; }
.var b { display:block; font-size:0.64rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }

/* Quiz */
.quiz { max-width:680px; margin:0 auto; padding-block:40px 80px; }
.quiz-head { text-align:center; margin-bottom:34px; }
.quiz-head .page-sub { margin:0 auto; }
.prog-label { display:flex; justify-content:space-between; font-size:0.74rem; color:var(--dim); margin-bottom:8px; font-variant-numeric:tabular-nums; }
.prog { background:var(--surface); border-radius:99px; height:6px; margin-bottom:26px; overflow:hidden; }
.prog > div { height:100%; background:var(--acc); border-radius:99px; transition:width .4s ease; }
.q-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:26px; margin-bottom:18px; }
.q-num { font-size:0.68rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin-bottom:10px; display:flex; justify-content:space-between; }
.q-timer { color:var(--acc); font-variant-numeric:tabular-nums; }
.q-timer.warn { color:var(--wrong); }
.q-text { font-size:1.04rem; font-weight:600; line-height:1.5; margin-bottom:20px; }
.options { display:flex; flex-direction:column; gap:10px; }
.option { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:0.9rem; font-weight:500; cursor:pointer; text-align:left; color:var(--text); display:flex; align-items:center; gap:12px; line-height:1.45; }
.option:hover:not(:disabled) { border-color:var(--border-hi); background:var(--card-hover); }
.option:disabled { cursor:default; }
.option.correct { border-color:var(--correct); background:var(--correct-bg); color:var(--correct); }
.option.wrong { border-color:var(--wrong); background:var(--wrong-bg); color:var(--wrong); }
.letter { width:24px; height:24px; border-radius:6px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; flex-shrink:0; }
.option.correct .letter { background:var(--correct); border-color:var(--correct); color:var(--on-accent); }
.option.wrong .letter { background:var(--wrong); border-color:var(--wrong); color:var(--on-accent); }
.feedback { margin-top:14px; padding:12px 16px; border-radius:8px; font-size:0.87rem; line-height:1.6; }
.feedback.correct { background:var(--correct-bg); border:1px solid var(--correct); }
.feedback.wrong { background:var(--wrong-bg); border:1px solid var(--wrong); }
.feedback b { color:var(--correct); }
.feedback.wrong b { color:var(--wrong); }
.quiz-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.key-hint { font-size:0.72rem; color:var(--dim); }
.btn-next { background:var(--acc); color:var(--on-accent); border:none; border-radius:10px; padding:11px 26px; font-size:0.88rem; font-weight:700; cursor:pointer; margin-left:auto; }
.result { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:36px 24px; text-align:center; }
.result-score { font-size:3.4rem; font-weight:800; letter-spacing:-0.04em; color:var(--acc); line-height:1; font-variant-numeric:tabular-nums; }
.result-pct { color:var(--muted); margin:6px 0 4px; }
.result-msg { font-size:1.04rem; font-weight:600; margin-bottom:24px; }
.result .actions { justify-content:center; }
.btn.warn { color:var(--wrong); border-color:var(--wrong); background:var(--wrong-bg); }

.footer { text-align:center; padding-block:26px 44px; border-top:1px solid var(--border); color:var(--dim); font-size:0.76rem; }

@media (max-width:540px) {
  .hero { padding-block:44px 36px; }
  .stats { display:flex; width:100%; }
  .stat { flex:1; padding:12px 8px; }
  .brand span { display:none; }
  .q-card { padding:20px 16px; }
}
</style>

<script>
const DATA = {"plan": [{"code": "3.1", "name": "Biological molecules", "year": 1, "units": 3}, {"code": "3.2", "name": "Cells", "year": 1, "units": 4}, {"code": "3.3", "name": "Organisms exchange substances with their environment", "year": 1, "units": 4}, {"code": "3.4", "name": "Genetic information, variation and relationships between organisms", "year": 1, "units": 4}, {"code": "3.5", "name": "Energy transfers in and between organisms", "year": 2, "units": 4}, {"code": "3.6", "name": "Organisms respond to changes in their internal and external environments", "year": 2, "units": 5}, {"code": "3.7", "name": "Genetics, populations, evolution and ecosystems", "year": 2, "units": 4}, {"code": "3.8", "name": "The control of gene expression", "year": 2, "units": 3}], "sections": {"3.1": "Biological molecules", "3.2": "Cells", "3.3": "Organisms exchange substances with their environment", "3.4": "Genetic information, variation and relationships between organisms", "3.5": "Energy transfers in and between organisms", "3.6": "Organisms respond to changes in their internal and external environments", "3.7": "Genetics, populations, evolution and ecosystems", "3.8": "The control of gene expression"}, "units": [{"id": "3.1a", "order": 1, "section": "3.1", "spec": "3.1.1–3.1.3", "title": "Monomers, carbohydrates and lipids", "desc": "Condensation and hydrolysis, glucose isomers, disaccharides, starch, glycogen and cellulose, triglycerides and phospholipids, and food tests.", "practicals": [], "summary": [{"h": "Monomers and polymers", "p": ["**Monomers** are small units that join to form **polymers**. Examples: monosaccharides, amino acids and nucleotides.", "A **condensation** reaction joins two molecules with a chemical bond and **releases a water molecule**.", "A **hydrolysis** reaction breaks a chemical bond between two molecules and **uses a water molecule**."]}, {"h": "Monosaccharides and disaccharides", "p": ["Common monosaccharides: **glucose**, **galactose** and **fructose**.", "Glucose has two isomers. In **α-glucose** the OH on carbon 1 is **below** the ring. In **β-glucose** it is **above** the ring.", "Two monosaccharides join by condensation to form a **glycosidic bond**.", "**Maltose** = glucose + glucose. **Sucrose** = glucose + fructose. **Lactose** = glucose + galactose."]}, {"h": "Polysaccharides", "p": ["**Starch** (plants) is a mix of amylose and amylopectin, made of **α-glucose**. Amylose is unbranched and coils into a helix (1,4 bonds), so it is compact. Amylopectin is branched (1,4 and 1,6 bonds), so enzymes can hydrolyse it quickly.", "**Glycogen** (animals) is α-glucose with **many more branches**, so it can be hydrolysed rapidly to release glucose for respiration. It is compact.", "Starch and glycogen are **insoluble**, so they don't affect water potential and can't diffuse out of cells.", "**Cellulose** is made of **β-glucose**. Alternate monomers are inverted, so chains are **straight and unbranched**. Parallel chains are linked by **hydrogen bonds** to form **microfibrils**, which give strength to plant cell walls."]}, {"h": "Lipids: triglycerides", "p": ["A **triglyceride** forms when one **glycerol** molecule and **three fatty acids** join by condensation. The bonds are **ester bonds**, and **3 water** molecules are released.", "**Saturated** fatty acids have no C=C double bonds. **Unsaturated** fatty acids have at least one C=C, which causes a kink in the chain.", "Triglycerides are good energy stores because they have many C–H bonds (high energy to mass ratio). Being **insoluble**, they don't affect water potential. They release metabolic water when oxidised."]}, {"h": "Lipids: phospholipids", "p": ["In a **phospholipid**, one fatty acid is replaced by a **phosphate-containing group**.", "The phosphate head is **hydrophilic**. The two fatty acid tails are **hydrophobic**. So phospholipids form a **bilayer** in water, which is the basis of cell membranes."]}, {"h": "Biochemical tests", "p": ["**Reducing sugars** (all monosaccharides, maltose, lactose): heat with Benedict's reagent. Blue changes to green, yellow, orange or **brick-red precipitate**.", "**Non-reducing sugars** (sucrose): negative Benedict's first. Then boil with dilute **HCl** to hydrolyse, neutralise with **sodium hydrogencarbonate**, and repeat Benedict's. A brick-red precipitate is positive.", "**Starch**: add iodine in potassium iodide solution. Orange-brown changes to **blue-black**.", "**Lipids**: emulsion test. Shake with **ethanol**, then add water. A **milky white emulsion** is positive.", "**Proteins**: biuret test. Blue changes to **purple**."]}], "pitfalls": ["Say a glycosidic bond is formed by **condensation**, and broken by **hydrolysis**. Mentioning water alone isn't enough.", "Cellulose gives strength because **hydrogen bonds link parallel chains**. Don't say cellulose chains are 'branched' or made of α-glucose.", "Triglycerides have **ester** bonds, not glycosidic or peptide bonds.", "Benedict's is semi-quantitative. For an exact concentration, use a colorimeter."], "questions": [{"q": "Which reaction joins two monosaccharides together?", "o": ["Hydrolysis, which uses a water molecule", "Condensation, which releases a water molecule", "Oxidation, which releases carbon dioxide", "Phosphorylation, which uses ATP"], "a": 1, "e": "Monosaccharides join by condensation, forming a glycosidic bond and releasing water. Hydrolysis is the reverse: it breaks the bond and uses water."}, {"q": "How does β-glucose differ from α-glucose?", "o": ["β-glucose has five carbon atoms", "The OH group on carbon 1 is above the ring in β-glucose", "β-glucose cannot form glycosidic bonds", "The OH group on carbon 4 is missing in β-glucose"], "a": 1, "e": "Both are six-carbon isomers. In β-glucose the OH on carbon 1 is above the ring. In α-glucose it is below."}, {"q": "Which monosaccharides make up sucrose?", "o": ["Glucose and galactose", "Glucose and glucose", "Glucose and fructose", "Fructose and galactose"], "a": 2, "e": "Sucrose = glucose + fructose. Maltose = glucose + glucose. Lactose = glucose + galactose."}, {"q": "Lactose is formed from which two monosaccharides?", "o": ["Glucose and galactose", "Glucose and fructose", "Galactose and fructose", "Two α-glucose molecules"], "a": 0, "e": "Lactose, the sugar in milk, is a disaccharide of glucose and galactose."}, {"q": "Why is glycogen well suited as an energy store in animals?", "o": ["It is soluble, so it moves easily around the body", "It is highly branched, so it can be hydrolysed rapidly to release glucose", "It contains β-glucose, which forms strong fibres", "It contains many ester bonds which store energy"], "a": 1, "e": "Glycogen's many branches give many ends for enzymes to work on, so glucose is released quickly. It is also insoluble and compact."}, {"q": "Amylose coils into a helix. What is the main advantage of this?", "o": ["It makes amylose soluble in water", "It allows hydrogen bonds to link it to cellulose", "It makes the molecule compact, so a lot can be stored in a small space", "It allows rapid hydrolysis from many ends"], "a": 2, "e": "The unbranched 1,4-linked chain of amylose coils into a helix, making it compact for storage. Rapid hydrolysis from many ends is a feature of branched molecules such as amylopectin and glycogen."}, {"q": "Why are starch and glycogen insoluble, and why does this matter?", "o": ["They are large molecules, so they don't affect the water potential of the cell", "They are charged, so they cannot cross membranes", "They contain lipids, so they repel water", "They are small, so they don't trigger osmosis"], "a": 0, "e": "Being large and insoluble, they don't lower water potential, so water doesn't move into cells by osmosis. They also can't diffuse out of the cell."}, {"q": "Which feature of cellulose gives plant cell walls their strength?", "o": ["Branched chains of α-glucose", "Ester bonds between chains", "Hydrogen bonds between parallel straight chains, forming microfibrils", "Disulfide bridges between chains"], "a": 2, "e": "β-glucose chains are straight because alternate monomers are inverted. Parallel chains form many hydrogen bonds and group into microfibrils, which give strength."}, {"q": "In cellulose, why are alternate β-glucose molecules turned upside down?", "o": ["To allow branching at carbon 6", "Because the OH groups on carbons 1 and 4 are on opposite sides, so a glycosidic bond can only form if alternate molecules are inverted", "To make cellulose soluble", "To allow cellulose to form a helix"], "a": 1, "e": "In β-glucose, the OH on carbon 1 points up and the OH on carbon 4 points down. So each monomer must be flipped relative to the next to form a 1,4 glycosidic bond, giving straight chains."}, {"q": "How many water molecules are released when a triglyceride is formed?", "o": ["One", "Two", "Four", "Three"], "a": 3, "e": "Glycerol has three OH groups. Each condenses with one fatty acid, forming three ester bonds and releasing three water molecules."}, {"q": "What type of bond joins a fatty acid to glycerol?", "o": ["Ester bond", "Glycosidic bond", "Peptide bond", "Hydrogen bond"], "a": 0, "e": "Fatty acids are joined to glycerol by ester bonds, formed in condensation reactions."}, {"q": "What is the difference between a saturated and an unsaturated fatty acid?", "o": ["Saturated fatty acids contain more oxygen", "Unsaturated fatty acids have no double bonds", "Saturated fatty acids are always shorter", "Unsaturated fatty acids have at least one C=C double bond"], "a": 3, "e": "Saturated fatty acids have only single C–C bonds. Unsaturated fatty acids have at least one C=C double bond, which makes a kink in the chain."}, {"q": "Why do phospholipids form a bilayer in water?", "o": ["The fatty acid tails are hydrophilic and face the water", "The phosphate heads are hydrophilic and face the water, while the hydrophobic tails face inwards", "The phosphate heads repel each other", "Phospholipids are insoluble, so they sink to form a layer"], "a": 1, "e": "The phosphate head is hydrophilic and faces water on both sides. The hydrophobic fatty acid tails face inward, away from water."}, {"q": "Which statement about triglycerides as energy stores is correct?", "o": ["They are soluble, so they are easily transported", "They have a low ratio of energy to mass", "They have many C–H bonds, so they release a lot of energy when oxidised", "They affect water potential, drawing water into cells"], "a": 2, "e": "Triglycerides have many C–H bonds, a high energy-to-mass ratio, and are insoluble, so they don't affect water potential."}, {"q": "A student heats a solution with Benedict's reagent and gets a brick-red precipitate. What does this show?", "o": ["Starch is present", "A non-reducing sugar is present", "Protein is present", "A reducing sugar is present"], "a": 3, "e": "A brick-red precipitate with Benedict's shows a reducing sugar, such as glucose, maltose or lactose."}, {"q": "Sucrose gives a negative Benedict's test. What must be done to show it is present?", "o": ["Boil with dilute HCl, neutralise with sodium hydrogencarbonate, then repeat Benedict's", "Add iodine solution", "Add biuret reagent and warm", "Shake with ethanol and add water"], "a": 0, "e": "Acid hydrolyses sucrose into glucose and fructose, which are reducing sugars. Neutralise first, because Benedict's needs alkaline conditions."}, {"q": "Which test result shows starch is present?", "o": ["Purple colour with biuret reagent", "Milky emulsion with ethanol and water", "Blue-black colour with iodine solution", "Brick-red precipitate with Benedict's"], "a": 2, "e": "Iodine in potassium iodide turns from orange-brown to blue-black with starch."}, {"q": "Describe a positive emulsion test for lipids.", "o": ["The solution turns purple", "A milky white emulsion forms when water is added to the ethanol mixture", "A brick-red precipitate forms on heating", "The solution turns blue-black"], "a": 1, "e": "Lipids dissolve in ethanol. When water is added, they come out of solution as tiny droplets, forming a milky white emulsion."}, {"q": "Which of these is a non-reducing sugar?", "o": ["Sucrose", "Maltose", "Glucose", "Lactose"], "a": 0, "e": "Sucrose is non-reducing. All monosaccharides, maltose and lactose are reducing sugars."}, {"q": "Amylopectin differs from amylose because amylopectin:", "o": ["Is made of β-glucose", "Is unbranched", "Is found only in animals", "Has 1,6 glycosidic bonds that form branches"], "a": 3, "e": "Amylopectin has 1,4 bonds in its chains and 1,6 bonds at branch points. Amylose has only 1,4 bonds and is unbranched."}, {"q": "Hydrolysis of maltose produces:", "o": ["Two α-glucose molecules", "Glucose and fructose", "Two β-glucose molecules", "Glucose and galactose"], "a": 0, "e": "Maltose is two α-glucose molecules joined by a 1,4 glycosidic bond. Hydrolysis uses water to break the bond."}, {"q": "Why is a phospholipid different from a triglyceride?", "o": ["It has four fatty acids", "It contains no glycerol", "One fatty acid is replaced by a phosphate-containing group", "It contains glycosidic bonds"], "a": 2, "e": "A phospholipid has glycerol, two fatty acids and a phosphate-containing group in place of the third fatty acid."}]}, {"id": "3.1b", "order": 2, "section": "3.1", "spec": "3.1.4", "title": "Proteins and enzymes", "desc": "Amino acids and peptide bonds, the four levels of protein structure, induced-fit model, and factors affecting enzyme activity including inhibitors.", "practicals": [1], "summary": [{"h": "Amino acids and peptide bonds", "p": ["Amino acids are the monomers of proteins. There are **20** that are common to all organisms.", "General structure: a central carbon with an **amine group (–NH₂)**, a **carboxyl group (–COOH)**, a hydrogen atom and a variable **R group**.", "Two amino acids join by **condensation** to form a **peptide bond** and a dipeptide. Many amino acids form a **polypeptide**."]}, {"h": "Levels of protein structure", "p": ["**Primary**: the sequence of amino acids in a polypeptide chain.", "**Secondary**: hydrogen bonds between the amino acids fold the chain into an **α-helix** or **β-pleated sheet**.", "**Tertiary**: further folding into a specific 3D shape, held by **hydrogen bonds, ionic bonds and disulfide bridges** between R groups.", "**Quaternary**: more than one polypeptide chain, e.g. haemoglobin (four chains). Some proteins also have a prosthetic group.", "Biuret test: blue changes to **purple** when peptide bonds are present."]}, {"h": "How enzymes work", "p": ["Enzymes are biological catalysts. They **lower the activation energy** of a reaction.", "The **active site** has a specific shape, determined by the tertiary structure, that is complementary to the substrate.", "**Induced-fit model**: as the substrate binds, the active site **changes shape slightly** to fit more closely. This puts strain on bonds in the substrate, lowering the activation energy. An **enzyme–substrate complex** forms.", "The older lock-and-key model said the active site was rigid. Induced fit explains why enzymes are flexible."]}, {"h": "Factors affecting rate", "p": ["**Temperature**: rate rises with temperature as molecules have more kinetic energy, so there are more successful collisions. Above the optimum, bonds in the tertiary structure break (especially hydrogen bonds). The active site changes shape and the enzyme is **denatured**, so fewer enzyme–substrate complexes form.", "**pH**: changes in H⁺ concentration affect **ionic and hydrogen bonds** in the tertiary structure. The active site changes shape away from the optimum pH.", "**Substrate concentration**: rate increases until all active sites are occupied. Then **enzyme concentration** is the limiting factor and the curve levels off.", "**Enzyme concentration**: rate increases as long as there is excess substrate."]}, {"h": "Inhibitors", "p": ["**Competitive inhibitors** are similar in shape to the substrate and **bind to the active site**. Adding more substrate **reduces** their effect.", "**Non-competitive inhibitors** bind at a site **other than the active site** (allosteric site). This changes the shape of the active site, so substrate can't bind. More substrate **does not** reduce the effect."]}], "pitfalls": ["Write that the active site is **complementary** to the substrate. Never say they are 'the same shape'.", "Denaturing is about **bonds in the tertiary structure breaking** and the **active site changing shape**. Enzymes are not 'killed'.", "Name the bonds: hydrogen, ionic and disulfide hold tertiary structure. Disulfide bridges are not broken by heat, but hydrogen and ionic bonds are.", "When reading graphs, at low substrate concentration **substrate** is limiting. On the plateau, **enzyme concentration** is limiting."], "questions": [{"q": "Which groups are found on every amino acid?", "o": ["An amine group, a carboxyl group and a variable R group", "A phosphate group, a pentose sugar and a base", "Glycerol and three fatty acids", "An amine group and a phosphate group only"], "a": 0, "e": "Every amino acid has a central carbon bonded to an amine group, a carboxyl group, a hydrogen and an R group. The 20 amino acids differ only in their R group."}, {"q": "Which bond forms when two amino acids join by condensation?", "o": ["Glycosidic bond", "Ester bond", "Peptide bond", "Disulfide bridge"], "a": 2, "e": "A peptide bond forms between the carboxyl group of one amino acid and the amine group of the next, releasing water."}, {"q": "What is the primary structure of a protein?", "o": ["The folding of the chain into an α-helix", "The sequence of amino acids in the polypeptide chain", "The 3D shape held by disulfide bridges", "The number of polypeptide chains"], "a": 1, "e": "Primary structure is the amino acid sequence. It determines how the chain folds, and therefore the protein's final shape and function."}, {"q": "Which bonds hold the secondary structure of a protein?", "o": ["Ionic bonds between R groups", "Disulfide bridges", "Peptide bonds", "Hydrogen bonds"], "a": 3, "e": "Hydrogen bonds between the –NH and –C=O groups of the polypeptide backbone hold the α-helix and β-pleated sheet."}, {"q": "Which bonds help maintain the tertiary structure of a protein?", "o": ["Hydrogen bonds, ionic bonds and disulfide bridges", "Peptide bonds only", "Glycosidic and ester bonds", "Phosphodiester bonds"], "a": 0, "e": "Tertiary structure is held by hydrogen bonds, ionic bonds and disulfide bridges between R groups."}, {"q": "Haemoglobin has quaternary structure because it:", "o": ["Contains an α-helix", "Is made of more than one polypeptide chain", "Contains disulfide bridges", "Has a specific primary sequence"], "a": 1, "e": "Quaternary structure means more than one polypeptide chain. Haemoglobin has four, plus haem prosthetic groups."}, {"q": "What is the positive result for the biuret test?", "o": ["Brick-red precipitate", "Blue-black colour", "Milky emulsion", "Purple colour"], "a": 3, "e": "Biuret reagent turns from blue to purple when peptide bonds are present."}, {"q": "How do enzymes speed up reactions?", "o": ["By raising the temperature of the reaction", "By lowering the activation energy", "By increasing the kinetic energy of substrate molecules", "By supplying energy from ATP"], "a": 1, "e": "Enzymes lower the activation energy, so more molecules have enough energy to react at a given temperature."}, {"q": "Which statement best describes the induced-fit model?", "o": ["The active site is a rigid shape that exactly matches the substrate", "The substrate changes the enzyme's primary structure", "The active site changes shape slightly as the substrate binds, putting strain on substrate bonds", "The enzyme binds permanently to the substrate"], "a": 2, "e": "In induced fit, the active site moulds around the substrate as it binds. This distorts substrate bonds and lowers the activation energy."}, {"q": "Why does an enzyme only catalyse one type of reaction?", "o": ["Only one substrate has a shape complementary to the active site", "Enzymes are only made for one reaction per cell", "The active site is identical in shape to the substrate", "Each enzyme contains only one amino acid"], "a": 0, "e": "The active site's specific tertiary shape is complementary to only one substrate, so only that substrate can form an enzyme–substrate complex."}, {"q": "Why does the rate of an enzyme-controlled reaction fall above the optimum temperature?", "o": ["The substrate molecules move too slowly", "Hydrogen and ionic bonds break, the active site changes shape, and fewer enzyme–substrate complexes form", "Peptide bonds in the primary structure break", "The enzyme runs out of ATP"], "a": 1, "e": "High temperature breaks the hydrogen and ionic bonds holding the tertiary structure. The active site changes shape and is no longer complementary to the substrate. The enzyme is denatured."}, {"q": "Why does the rate of reaction rise as temperature increases up to the optimum?", "o": ["Enzymes and substrates gain kinetic energy, so there are more successful collisions and more enzyme–substrate complexes", "The active site becomes larger", "More enzymes are made", "The activation energy increases"], "a": 0, "e": "More kinetic energy means more frequent collisions between substrate and active site, so more enzyme–substrate complexes form per second."}, {"q": "How does a change in pH affect an enzyme?", "o": ["It changes the primary structure", "It increases kinetic energy", "It alters hydrogen and ionic bonds in the tertiary structure, changing the shape of the active site", "It breaks peptide bonds immediately"], "a": 2, "e": "H⁺ and OH⁻ ions interact with charged R groups. This disrupts ionic and hydrogen bonds, changing the shape of the active site."}, {"q": "On a graph of rate against substrate concentration, why does the curve level off?", "o": ["The enzyme is denatured", "The substrate has run out", "Temperature becomes the limiting factor", "All active sites are occupied, so enzyme concentration is limiting"], "a": 3, "e": "At high substrate concentration, every active site is in use at any moment. Adding more substrate makes no difference, so enzyme concentration limits the rate."}, {"q": "A competitive inhibitor reduces the rate of reaction because it:", "o": ["Binds to the active site, so fewer substrate molecules can bind", "Binds elsewhere and changes the active site's shape", "Denatures the enzyme permanently", "Lowers the activation energy"], "a": 0, "e": "A competitive inhibitor has a similar shape to the substrate and occupies the active site, so fewer enzyme–substrate complexes form."}, {"q": "How can the effect of a competitive inhibitor be reduced?", "o": ["By raising the temperature well above the optimum", "By increasing the substrate concentration", "By adding a non-competitive inhibitor", "It cannot be reduced"], "a": 1, "e": "With more substrate, substrate molecules are more likely than inhibitor molecules to collide with active sites. The maximum rate can still be reached."}, {"q": "Where does a non-competitive inhibitor bind?", "o": ["To the active site", "To the substrate", "To a site other than the active site, changing the active site's shape", "To the enzyme–substrate complex only"], "a": 2, "e": "Non-competitive inhibitors bind at an allosteric site. This changes the tertiary structure so the active site no longer fits the substrate."}, {"q": "Why does adding more substrate not reduce the effect of a non-competitive inhibitor?", "o": ["Substrate and inhibitor don't compete for the same site, and affected active sites can't bind substrate anyway", "The inhibitor is used up by the substrate", "The substrate denatures the inhibitor", "Non-competitive inhibitors are always permanent"], "a": 0, "e": "The inhibitor binds away from the active site, so substrate can't displace it. While it is bound, the altered active site can't form complexes."}, {"q": "In the required practical on enzyme rate, why is the initial rate measured?", "o": ["Because the enzyme denatures over time", "Because temperature rises during the reaction", "Because the reaction only starts after a delay", "Because substrate concentration falls as the reaction proceeds, so the rate slows"], "a": 3, "e": "As substrate is used up, the rate falls. The initial rate, found from a tangent at t = 0, reflects only the independent variable."}, {"q": "Why are enzyme and substrate solutions left separately in the water bath before mixing?", "o": ["To denature any contaminating enzymes", "So both reach the test temperature before the reaction starts", "To allow the enzyme to bind the buffer", "To increase the concentration of enzyme"], "a": 1, "e": "Equilibrating separately means the reaction runs at the intended temperature from the start."}, {"q": "Which control best shows that the enzyme caused the change in a rate experiment?", "o": ["Using a higher substrate concentration", "Running the reaction without a buffer", "Using enzyme that has been boiled and cooled", "Using a different water bath"], "a": 2, "e": "Boiled enzyme is denatured. If no reaction happens, the change in the test must be due to active enzyme."}, {"q": "Which type of bond in a protein is NOT broken by moderately high temperatures?", "o": ["Hydrogen bonds", "Ionic bonds", "Weak interactions between R groups", "Disulfide bridges"], "a": 3, "e": "Disulfide bridges are strong covalent bonds between sulfur atoms in cysteine. Heat mainly breaks the weaker hydrogen and ionic bonds."}]}, {"id": "3.1c", "order": 3, "section": "3.1", "spec": "3.1.5–3.1.8", "title": "Nucleic acids, ATP, water and ions", "desc": "DNA and RNA structure, semi-conservative replication, ATP hydrolysis and synthesis, properties of water, and inorganic ions.", "practicals": [], "summary": [{"h": "Nucleotides, DNA and RNA", "p": ["A **nucleotide** has a **pentose sugar**, a **phosphate group** and a **nitrogen-containing organic base**.", "DNA nucleotide: sugar is **deoxyribose**, and bases are adenine (A), thymine (T), cytosine (C) and guanine (G). RNA nucleotide: sugar is **ribose**, and **uracil (U)** replaces thymine.", "Nucleotides join by condensation, forming **phosphodiester bonds** between the phosphate of one and the sugar of the next. This makes a **sugar-phosphate backbone**.", "DNA is a **double helix** of two antiparallel polynucleotide strands joined by **hydrogen bonds** between **complementary base pairs**: A–T and C–G.", "RNA is a relatively short **single** polynucleotide chain."]}, {"h": "Why DNA suits its function", "p": ["The sugar-phosphate backbone protects the bases inside the helix. Many hydrogen bonds make the molecule stable.", "Weak hydrogen bonds let the strands **separate** for replication and transcription.", "Complementary base pairing allows **accurate copying**. DNA is very long, so it holds a lot of information."]}, {"h": "Semi-conservative replication", "p": ["**DNA helicase** breaks the hydrogen bonds between bases, so the double helix unwinds and separates.", "Each strand acts as a **template**. Free DNA nucleotides line up by **complementary base pairing**.", "**DNA polymerase** joins adjacent nucleotides by condensation, forming phosphodiester bonds.", "Each new DNA molecule has **one original strand and one new strand**, which is why it is called semi-conservative.", "**Meselson and Stahl** grew bacteria in heavy ¹⁵N, then moved them to light ¹⁴N. After one generation all DNA was **intermediate** density. After two, there was half intermediate and half light. This supported semi-conservative replication."]}, {"h": "ATP", "p": ["**ATP** (adenosine triphosphate) is a nucleotide derivative: **ribose**, **adenine** and **three phosphate groups**.", "**ATP hydrolase** catalyses hydrolysis: ATP + H₂O → ADP + Pi, releasing a small, manageable amount of energy.", "The released Pi can **phosphorylate** other compounds, often making them more reactive.", "**ATP synthase** resynthesises ATP from ADP and Pi by condensation during respiration and photosynthesis."]}, {"h": "Water", "p": ["Water is **polar**, so hydrogen bonds form between molecules.", "**Metabolite**: used in condensation and hydrolysis reactions.", "**Solvent**: metabolic reactions happen in solution, and it transports substances.", "**High specific heat capacity**: buffers temperature changes, so habitats and body temperature are stable.", "**High latent heat of vaporisation**: evaporating sweat gives cooling with little water loss.", "**Strong cohesion**: supports columns of water in xylem and gives surface tension."]}, {"h": "Inorganic ions", "p": ["**H⁺**: determines pH, which affects enzymes. Involved in chemiosmosis.", "**Fe²⁺**: part of the haem group in haemoglobin, which binds oxygen.", "**Na⁺**: needed for co-transport of glucose and amino acids, and for nerve impulses.", "**PO₄³⁻**: part of DNA, RNA and ATP, and phospholipids."]}], "pitfalls": ["DNA has **deoxyribose** and thymine. RNA has **ribose** and uracil. Don't mix them up.", "DNA polymerase joins nucleotides. **Helicase** separates strands. Neither is 'unzipping enzyme'.", "ATP releases a **small** amount of energy per molecule. That is a key advantage, not a weakness.", "In Meselson–Stahl questions, the first generation rules out conservative replication. The second generation rules out dispersive."], "questions": [{"q": "What are the three components of a nucleotide?", "o": ["A pentose sugar, a phosphate group and a nitrogen-containing base", "Glycerol, a fatty acid and a phosphate group", "An amine group, a carboxyl group and an R group", "A hexose sugar, a phosphate group and a base"], "a": 0, "e": "Every nucleotide has a pentose sugar (deoxyribose or ribose), a phosphate group and a nitrogen-containing base."}, {"q": "Which statement correctly compares DNA and RNA nucleotides?", "o": ["DNA contains ribose and uracil", "RNA contains deoxyribose and thymine", "DNA contains deoxyribose and thymine; RNA contains ribose and uracil", "Both contain ribose"], "a": 2, "e": "DNA: deoxyribose with A, T, C, G. RNA: ribose with A, U, C, G."}, {"q": "What type of bond joins nucleotides in a polynucleotide chain?", "o": ["Peptide bond", "Phosphodiester bond", "Hydrogen bond", "Glycosidic bond"], "a": 1, "e": "Phosphodiester bonds form by condensation between the phosphate of one nucleotide and the sugar of the next."}, {"q": "What holds the two strands of a DNA double helix together?", "o": ["Phosphodiester bonds between the backbones", "Disulfide bridges", "Ionic bonds between phosphates", "Hydrogen bonds between complementary bases"], "a": 3, "e": "A pairs with T and C pairs with G by hydrogen bonds. These are weak individually but strong in large numbers."}, {"q": "A DNA sample contains 22% thymine. What percentage is guanine?", "o": ["28%", "22%", "44%", "56%"], "a": 0, "e": "T = A = 22%, so A + T = 44%. That leaves 56% for C + G. G = 56 ÷ 2 = 28%."}, {"q": "What is the role of DNA helicase in replication?", "o": ["It joins adjacent nucleotides", "It breaks hydrogen bonds between bases, separating the strands", "It adds free nucleotides to the template", "It forms phosphodiester bonds"], "a": 1, "e": "Helicase unwinds the double helix by breaking hydrogen bonds between complementary bases."}, {"q": "What is the role of DNA polymerase?", "o": ["It breaks hydrogen bonds", "It attaches free nucleotides to the template by hydrogen bonds", "It joins adjacent nucleotides by condensation, forming phosphodiester bonds", "It removes introns"], "a": 2, "e": "DNA polymerase catalyses condensation reactions between adjacent nucleotides, forming the new sugar-phosphate backbone."}, {"q": "Why is DNA replication described as semi-conservative?", "o": ["Half the genes are copied", "Each new DNA molecule contains one original strand and one new strand", "Only one strand acts as a template", "Half the bases are replaced by uracil"], "a": 1, "e": "Each original strand acts as a template, so each daughter molecule has one parent strand and one new strand."}, {"q": "In the Meselson–Stahl experiment, bacteria grown in ¹⁵N were moved to ¹⁴N for one generation. What did they observe?", "o": ["One heavy band and one light band", "Only a heavy band", "Only a light band", "Only an intermediate band"], "a": 3, "e": "All DNA was intermediate density, with one ¹⁵N strand and one ¹⁴N strand. This ruled out conservative replication."}, {"q": "After two generations in ¹⁴N, what did Meselson and Stahl find?", "o": ["Half intermediate and half light DNA", "All intermediate DNA", "Half heavy and half light DNA", "All heavy DNA"], "a": 0, "e": "Two bands, intermediate and light, in equal amounts. Dispersive replication would have given a single band, so this supports semi-conservative."}, {"q": "What is ATP made of?", "o": ["Deoxyribose, adenine and three phosphate groups", "Ribose, adenine and three phosphate groups", "Ribose, adenine and one phosphate group", "Glucose and three phosphate groups"], "a": 1, "e": "ATP is adenine + ribose (together adenosine) with three phosphate groups."}, {"q": "Which enzyme catalyses the breakdown of ATP to release energy?", "o": ["ATP synthase", "DNA polymerase", "Helicase", "ATP hydrolase"], "a": 3, "e": "ATP hydrolase catalyses hydrolysis of ATP into ADP and inorganic phosphate, releasing energy."}, {"q": "Why is ATP a good immediate energy source?", "o": ["It releases a small, manageable amount of energy in a single step", "It stores large amounts of energy for long periods", "It can be transported easily between cells", "It is a polymer of glucose"], "a": 0, "e": "ATP hydrolysis is a single reaction releasing a small amount of energy, so little is wasted as heat. It is quickly resynthesised."}, {"q": "How can inorganic phosphate released from ATP be used?", "o": ["It forms peptide bonds", "It phosphorylates other compounds, often making them more reactive", "It acts as a solvent", "It binds oxygen in haemoglobin"], "a": 1, "e": "Pi can be added to other molecules (phosphorylation), lowering their activation energy or changing their shape, e.g. in active transport."}, {"q": "Which property of water reduces temperature fluctuations in aquatic habitats?", "o": ["Strong cohesion", "Being a metabolite", "High specific heat capacity", "Being a solvent"], "a": 2, "e": "Many hydrogen bonds must be broken to raise water's temperature, so it takes a lot of energy to heat. Its temperature changes slowly."}, {"q": "Sweating cools mammals effectively because water has:", "o": ["A high latent heat of vaporisation", "A low specific heat capacity", "Weak cohesion", "No polarity"], "a": 0, "e": "Evaporating water absorbs a lot of heat energy from the skin, giving effective cooling for little water lost."}, {"q": "Which property of water allows columns of water to be pulled up xylem?", "o": ["High specific heat capacity", "Strong cohesion between water molecules due to hydrogen bonds", "Being a metabolite", "Low density as ice"], "a": 1, "e": "Hydrogen bonds make water molecules stick together (cohesion), so a continuous column can be pulled up the xylem."}, {"q": "Water acts as a metabolite in which kind of reaction?", "o": ["Hydrolysis reactions only", "Condensation and hydrolysis reactions", "Only in photosynthesis", "Only in respiration"], "a": 1, "e": "Water is used in hydrolysis, released in condensation, and is a reactant in photosynthesis. It is a metabolite in many reactions."}, {"q": "Which ion is a component of haemoglobin and binds oxygen?", "o": ["Na⁺", "PO₄³⁻", "H⁺", "Fe²⁺"], "a": 3, "e": "Fe²⁺ in the haem group binds oxygen."}, {"q": "Which ion is needed for co-transport of glucose into ileum epithelial cells?", "o": ["Na⁺", "Fe²⁺", "H⁺", "Cl⁻"], "a": 0, "e": "Na⁺ moves down its concentration gradient into the cell through a co-transporter protein, carrying glucose with it against its gradient."}, {"q": "The concentration of which ion determines pH?", "o": ["PO₄³⁻", "Na⁺", "H⁺", "Fe²⁺"], "a": 2, "e": "pH is a measure of H⁺ concentration. More H⁺ means lower pH."}, {"q": "Phosphate ions are a component of which molecules?", "o": ["DNA, RNA, ATP and phospholipids", "Triglycerides and starch", "Haemoglobin and enzymes", "Cellulose and glycogen"], "a": 0, "e": "Phosphate is in nucleotides (DNA, RNA, ATP) and in phospholipids."}]}, {"id": "3.2a", "order": 4, "section": "3.2", "spec": "3.2.1", "title": "Cell structure and studying cells", "desc": "Eukaryotic organelles, prokaryotic cells and viruses, light and electron microscopes, magnification calculations and cell fractionation.", "practicals": [6], "summary": [{"h": "Eukaryotic organelles", "p": ["**Nucleus**: nuclear envelope with pores, chromatin and nucleolus. Holds genetic information and controls the cell's activities. The nucleolus makes ribosomal RNA.", "**Mitochondria**: double membrane, inner membrane folded into **cristae**, with a matrix. Site of **aerobic respiration**, producing ATP.", "**Chloroplasts** (plants and algae): double membrane, **thylakoids** stacked into **grana**, fluid **stroma**. Site of photosynthesis.", "**Golgi apparatus and vesicles**: modify, package and transport proteins and lipids. Golgi also forms **lysosomes**.", "**Lysosomes**: contain hydrolytic enzymes (lysozymes). Digest invading cells and break down worn-out organelles.", "**Ribosomes**: made of RNA and protein, site of protein synthesis. Cytoplasm of eukaryotes has larger **80S** ribosomes.", "**Rough ER** (ribosomes on surface) synthesises and transports proteins. **Smooth ER** synthesises and processes lipids.", "**Cell wall**: cellulose in plants and algae, chitin in fungi. Provides strength.", "**Cell vacuole** (plants): contains cell sap, keeps the cell turgid."]}, {"h": "Specialised cells", "p": ["In complex multicellular organisms, cells are specialised and organised into **tissues**, **organs** and **organ systems**.", "Specialised cells have more of the organelles they need, e.g. many mitochondria in muscle cells, microvilli on epithelial cells of the ileum."]}, {"h": "Prokaryotic cells and viruses", "p": ["Prokaryotes are much **smaller**, have **no membrane-bound organelles**, no nucleus, smaller **70S ribosomes**, and **circular DNA not associated with histones**.", "Their cell wall contains **murein** (a glycoprotein). Some also have **plasmids**, a **capsule** and one or more **flagella**.", "Prokaryotes divide by **binary fission** (see Cell division).", "**Viruses** are acellular and non-living. They have genetic material, a **capsid** (protein coat) and **attachment proteins**. Some also have a lipid envelope and enzymes such as reverse transcriptase."]}, {"h": "Microscopes and magnification", "p": ["`magnification = size of image ÷ size of real object`. Convert units first: 1 mm = 1000 µm, and 1 µm = 1000 nm.", "**Resolution** is the minimum distance two objects can be apart and still be seen as separate. **Magnification** is how many times larger the image is than the object.", "**Optical (light) microscope**: low resolution (about 0.2 µm) because of the long wavelength of light. Living cells can be seen, in colour.", "**TEM**: electrons pass through a thin specimen, giving very high resolution and internal detail. The image is 2D, specimens must be in a vacuum (so dead), and preparation can create **artefacts**.", "**SEM**: electrons are scattered off the surface, giving a 3D image. Lower resolution than TEM.", "Use a **stage micrometer** to calibrate an **eyepiece graticule** at each magnification."]}, {"h": "Cell fractionation and ultracentrifugation", "p": ["Homogenise tissue in a solution that is **cold** (slows enzymes that break down organelles), **isotonic** (stops osmotic damage) and **buffered** (keeps pH stable, so proteins aren't denatured).", "**Filter** to remove large debris and whole cells.", "**Ultracentrifugation** (differential centrifugation): spin at increasing speeds. The heaviest organelles form a pellet first: **nuclei**, then **chloroplasts** (plant cells) and **mitochondria**, then lysosomes, then ER and **ribosomes**."]}], "pitfalls": ["Resolution and magnification are different. Higher magnification without higher resolution just gives a bigger blur.", "Prokaryotic DNA is **not associated with histones**. Eukaryotic DNA is.", "Viruses are **not** prokaryotes: they are acellular and have no ribosomes.", "Explain each condition of fractionation separately: cold, isotonic and buffered, each with its own reason."], "questions": [{"q": "Which organelle is the site of aerobic respiration?", "o": ["Chloroplast", "Golgi apparatus", "Mitochondrion", "Ribosome"], "a": 2, "e": "Mitochondria are the site of aerobic respiration, producing ATP. The folded inner membrane (cristae) gives a large surface area for respiratory enzymes."}, {"q": "What is the function of the Golgi apparatus?", "o": ["Modifies and packages proteins and lipids, and forms lysosomes", "Synthesises proteins", "Contains hydrolytic enzymes that digest invading cells", "Produces ATP"], "a": 0, "e": "The Golgi apparatus modifies proteins (e.g. adding carbohydrate), packages them into vesicles and makes lysosomes."}, {"q": "Lysosomes contain:", "o": ["Chlorophyll", "DNA", "Ribosomes", "Hydrolytic enzymes"], "a": 3, "e": "Lysosomes are a type of Golgi vesicle containing hydrolytic enzymes, which digest pathogens and old organelles."}, {"q": "What is the main difference between rough and smooth endoplasmic reticulum?", "o": ["Rough ER has ribosomes and makes proteins; smooth ER makes and processes lipids", "Smooth ER has ribosomes and makes proteins", "Rough ER is found only in plants", "Smooth ER is the site of respiration"], "a": 0, "e": "Ribosomes on rough ER make proteins, which are transported through it. Smooth ER has no ribosomes and synthesises and processes lipids."}, {"q": "Which feature is found in prokaryotic cells but not in eukaryotic cells?", "o": ["80S ribosomes", "A cell wall containing murein", "A nucleus", "Mitochondria"], "a": 1, "e": "Prokaryotic cell walls contain murein. Eukaryotes have 80S ribosomes and membrane-bound organelles such as the nucleus and mitochondria."}, {"q": "How does prokaryotic DNA differ from eukaryotic nuclear DNA?", "o": ["It is linear and associated with histones", "It is made of RNA", "It is circular and not associated with histones", "It is found inside a nucleus"], "a": 2, "e": "Prokaryotic DNA is a circular molecule, not associated with histone proteins. Eukaryotic DNA is linear and wound around histones."}, {"q": "What size are the ribosomes in prokaryotic cells?", "o": ["80S", "70S", "90S", "They have no ribosomes"], "a": 1, "e": "Prokaryotes have smaller 70S ribosomes. Eukaryotic cytoplasmic ribosomes are 80S."}, {"q": "Which of these structures is found in all viruses?", "o": ["A capsid and attachment proteins", "Ribosomes", "A cell wall", "Plasmids"], "a": 0, "e": "Viruses are acellular and contain genetic material, a protein capsid and attachment proteins. They have no ribosomes or cytoplasm."}, {"q": "An image of a mitochondrion is 30 mm long. The magnification is ×15 000. What is the actual length?", "o": ["0.5 µm", "20 µm", "45 µm", "2 µm"], "a": 3, "e": "Actual size = image ÷ magnification = 30 mm ÷ 15 000 = 0.002 mm = 2 µm."}, {"q": "A cell is 50 µm long and its image is 25 mm long. What is the magnification?", "o": ["×500", "×50", "×2", "×5000"], "a": 0, "e": "Convert 25 mm to 25 000 µm. Magnification = 25 000 ÷ 50 = ×500."}, {"q": "What is meant by the resolution of a microscope?", "o": ["How many times larger the image is than the object", "The minimum distance between two objects at which they can still be seen as separate", "The depth of the specimen", "The brightness of the image"], "a": 1, "e": "Resolution is the ability to distinguish two close objects. Electron microscopes have higher resolution because electrons have a shorter wavelength than light."}, {"q": "Why does a transmission electron microscope have higher resolution than an optical microscope?", "o": ["It uses a stronger lens", "It uses a thinner specimen", "It produces a 3D image", "Electrons have a much shorter wavelength than light"], "a": 3, "e": "Resolution depends on wavelength. Electron beams have a far shorter wavelength than light, so much finer detail can be resolved."}, {"q": "Which is a limitation of the transmission electron microscope?", "o": ["It has a lower resolution than a light microscope", "Specimens must be in a vacuum, so living cells cannot be viewed", "It can only show the surface of specimens", "It produces colour images"], "a": 1, "e": "TEM requires a vacuum, so specimens are dead. It also needs very thin sections, which can create artefacts. Images are 2D and black and white."}, {"q": "How does a scanning electron microscope differ from a TEM?", "o": ["SEM scatters electrons off the surface to give a 3D image, with lower resolution", "SEM passes electrons through the specimen", "SEM uses light", "SEM has higher resolution"], "a": 0, "e": "SEM scans a beam over the surface and detects scattered electrons, producing a 3D image of the surface. Its resolution is lower than TEM."}, {"q": "Why must an eyepiece graticule be calibrated with a stage micrometer?", "o": ["To focus the image", "Because the graticule divisions represent different real distances at each magnification", "To increase resolution", "To stain the specimen"], "a": 1, "e": "The graticule stays the same size but the specimen is magnified differently by each objective, so the real length of one division changes."}, {"q": "Why is tissue homogenised in ice-cold solution during cell fractionation?", "o": ["To keep the pH constant", "To prevent osmosis", "To reduce the activity of enzymes that break down organelles", "To make organelles heavier"], "a": 2, "e": "Low temperature slows enzyme activity, so enzymes released during homogenisation don't digest the organelles."}, {"q": "Why is an isotonic solution used for cell fractionation?", "o": ["To keep enzymes inactive", "So the water potential is the same as the organelles, preventing them bursting or shrinking", "To keep pH constant", "To help the homogeniser break cells"], "a": 1, "e": "An isotonic solution has the same water potential as the organelles, so no net water movement by osmosis damages them."}, {"q": "Why is a buffer used in cell fractionation?", "o": ["To stop organelles bursting by osmosis", "To slow down enzymes", "To separate organelles by density", "To keep the pH constant so proteins are not denatured"], "a": 3, "e": "A buffer resists pH changes, so enzymes and other proteins in organelles keep their shape."}, {"q": "In ultracentrifugation of liver cells, which organelle forms the first pellet?", "o": ["Ribosomes", "Mitochondria", "Nuclei", "Lysosomes"], "a": 2, "e": "Nuclei are the largest and densest organelles, so they sediment first at the lowest speed."}, {"q": "During ultracentrifugation, the supernatant from the nuclei pellet is spun at higher speed. What forms the next pellet in an animal cell?", "o": ["Mitochondria", "Ribosomes", "Nuclei", "Cell walls"], "a": 0, "e": "After nuclei, mitochondria are next densest and form the next pellet. Ribosomes need the highest speeds."}, {"q": "What are microvilli on epithelial cells of the ileum an adaptation for?", "o": ["Movement of the cell", "Increasing surface area for absorption", "Producing mucus", "Protein synthesis"], "a": 1, "e": "Microvilli are folds of the cell-surface membrane that increase surface area for absorption of digested food."}, {"q": "Which structures might be present in some, but not all, prokaryotic cells?", "o": ["Ribosomes and a cell-surface membrane", "Cytoplasm and DNA", "Plasmids, a capsule and flagella", "A murein cell wall and ribosomes"], "a": 2, "e": "All prokaryotes have cytoplasm, ribosomes, a membrane, a murein wall and DNA. Plasmids, a capsule and flagella are present in some."}]}, {"id": "3.2b", "order": 5, "section": "3.2", "spec": "3.2.2", "title": "Cell division", "desc": "The cell cycle, the stages of mitosis, the mitotic index, cancer as uncontrolled division, binary fission and virus replication.", "practicals": [2], "summary": [{"h": "The cell cycle", "p": ["Within multicellular organisms, not all cells keep the ability to divide.", "The cycle has **interphase** (most of the time), then **mitosis** (nuclear division), then **cytokinesis** (cytoplasm divides).", "During interphase, **DNA replicates** (semi-conservatively) and the cell grows, makes organelles and stores energy as ATP."]}, {"h": "Mitosis", "p": ["Mitosis produces **two genetically identical** daughter cells. It is used for growth, repair and asexual reproduction.", "**Prophase**: chromosomes condense and become visible as two **sister chromatids** joined at a **centromere**. The nuclear envelope breaks down. **Centrioles** move to opposite poles and spindle fibres form.", "**Metaphase**: chromosomes line up at the **equator** of the cell, attached to spindle fibres by their centromeres.", "**Anaphase**: centromeres divide. Spindle fibres shorten and pull **sister chromatids** to opposite poles.", "**Telophase**: chromatids reach the poles and uncoil. A **nuclear envelope** reforms around each set.", "**Cytokinesis** then divides the cytoplasm, giving two cells."]}, {"h": "Mitotic index", "p": ["`Mitotic index = number of cells in mitosis ÷ total number of cells observed`", "A high mitotic index means rapid growth or repair, e.g. a root tip or a tumour."]}, {"h": "Cancer", "p": ["Cancer results from **mutations in genes that regulate mitosis** and the cell cycle. This causes **uncontrolled cell division** and a **tumour**.", "Many cancer treatments target the cell cycle, e.g. blocking DNA replication or the formation of spindle fibres. These also harm healthy dividing cells (such as hair follicles), causing side effects."]}, {"h": "Binary fission in prokaryotes", "p": ["The **circular DNA** replicates, and **plasmids** replicate (any number of copies).", "The cytoplasm divides, giving two daughter cells, each with **one copy of the circular DNA** and a variable number of plasmids."]}, {"h": "Viruses don't undergo cell division", "p": ["Being non-living, viruses don't divide. Their **attachment proteins** bind to complementary **receptors** on the host cell.", "Their genetic material is injected or enters the host cell. The host cell's machinery **replicates** the virus particles."]}], "pitfalls": ["DNA replication happens in **interphase**, not in prophase.", "In anaphase, it is **sister chromatids** (not homologous chromosomes) that separate. Homologous pairs separate in meiosis I.", "Binary fission is **not** mitosis: prokaryotes have no nucleus or spindle.", "In mitotic index questions, count only cells **in mitosis** in the numerator. Interphase cells go only in the total."], "questions": [{"q": "During which stage of the cell cycle does DNA replicate?", "o": ["Prophase", "Anaphase", "Interphase", "Cytokinesis"], "a": 2, "e": "DNA replicates during interphase, so each chromosome has two identical sister chromatids by the time mitosis starts."}, {"q": "What happens during prophase?", "o": ["Chromosomes condense, the nuclear envelope breaks down and the spindle forms", "Chromosomes line up at the equator", "Sister chromatids move to opposite poles", "Nuclear envelopes reform"], "a": 0, "e": "In prophase, chromosomes condense and become visible, the nuclear envelope breaks down and spindle fibres begin to form."}, {"q": "What happens during metaphase?", "o": ["Chromatids uncoil", "Chromosomes line up at the equator, attached to spindle fibres by their centromeres", "Centromeres divide", "The cytoplasm divides"], "a": 1, "e": "Metaphase is when chromosomes are lined up along the equator, each attached to spindle fibres at its centromere."}, {"q": "What happens during anaphase of mitosis?", "o": ["Homologous chromosomes separate", "Nuclear envelopes reform", "DNA replicates", "Centromeres divide and sister chromatids are pulled to opposite poles"], "a": 3, "e": "Spindle fibres shorten, pulling sister chromatids apart to opposite poles. Their V shape shows they are being pulled at the centromere."}, {"q": "What happens during telophase?", "o": ["Chromatids reach the poles, uncoil, and nuclear envelopes reform", "Chromosomes condense", "The spindle forms", "Chromosomes line up at the equator"], "a": 0, "e": "In telophase the chromatids, now chromosomes, are at the poles. They become long and thin again, and a nuclear envelope forms around each set."}, {"q": "What is cytokinesis?", "o": ["Division of the nucleus", "Division of the cytoplasm to form two cells", "Replication of DNA", "Formation of the spindle"], "a": 1, "e": "Cytokinesis is the division of the cytoplasm, which usually starts in telophase and produces two daughter cells."}, {"q": "What is the outcome of mitosis?", "o": ["Four genetically different cells", "Two cells with half the chromosome number", "Two genetically identical daughter cells", "One cell with double the chromosome number"], "a": 2, "e": "Mitosis produces two daughter cells genetically identical to each other and to the parent cell, with the same chromosome number."}, {"q": "In a root tip squash, 24 cells are in mitosis out of 160 cells counted. What is the mitotic index?", "o": ["0.15", "0.24", "6.7", "0.85"], "a": 0, "e": "Mitotic index = 24 ÷ 160 = 0.15 (or 15%)."}, {"q": "A cell cycle lasts 20 hours. In a sample, 5% of cells are in metaphase. Roughly how long does metaphase last?", "o": ["5 hours", "4 hours", "10 minutes", "1 hour"], "a": 3, "e": "Time in a stage ≈ proportion of cells in that stage × cycle length = 0.05 × 20 hours = 1 hour."}, {"q": "Why is hydrochloric acid used in the root tip squash practical?", "o": ["To stain the chromosomes", "To separate the cells and stop division", "To make the cells divide faster", "To increase magnification"], "a": 1, "e": "Warm HCl breaks down the middle lamella holding cells together, so they can be squashed into a single layer. It also stops mitosis."}, {"q": "Why is only the tip of the root used in the mitosis practical?", "o": ["It contains the meristem, where cells are actively dividing", "It contains chloroplasts", "It is the easiest part to stain", "Cells there are the largest"], "a": 0, "e": "The meristem at the root tip is where mitosis happens. Further back, cells are elongating rather than dividing."}, {"q": "What causes cancer at the cellular level?", "o": ["Viruses always cause it", "Too much glucose in cells", "Mutations in genes that control mitosis, leading to uncontrolled cell division", "Cells stopping mitosis"], "a": 2, "e": "Cancer arises from mutations in genes regulating the cell cycle. Cells divide uncontrollably and form a tumour."}, {"q": "Some cancer drugs stop spindle fibres forming. Which stage of mitosis would be prevented?", "o": ["Interphase", "Anaphase, because chromatids can't be separated", "DNA replication", "Prophase condensation"], "a": 1, "e": "Without spindle fibres, chromosomes can't line up or be pulled apart, so anaphase can't happen and the cell can't divide."}, {"q": "Why do cancer treatments often cause hair loss?", "o": ["They target the cell cycle, which also affects healthy, rapidly dividing cells such as hair follicles", "They destroy keratin", "They increase mitosis in all cells", "They only affect cells in interphase"], "a": 0, "e": "Treatments target dividing cells. Healthy cells that divide often, such as hair follicles, are affected too."}, {"q": "How do prokaryotic cells divide?", "o": ["Mitosis", "Meiosis", "Budding", "Binary fission"], "a": 3, "e": "Prokaryotes divide by binary fission: circular DNA and plasmids replicate, then the cytoplasm divides."}, {"q": "In binary fission, what does each daughter cell receive?", "o": ["Half the circular DNA", "One copy of the circular DNA and a variable number of plasmids", "Two copies of the circular DNA", "Only plasmids"], "a": 1, "e": "Each daughter cell gets a single copy of the circular DNA. Plasmids are shared out unevenly, so numbers vary."}, {"q": "Why don't viruses undergo cell division?", "o": ["They divide too quickly to observe", "They contain no DNA", "They are non-living and acellular", "They only infect plant cells"], "a": 2, "e": "Viruses are not cells. They can only be replicated by a host cell's machinery."}, {"q": "How does a virus first attach to a host cell?", "o": ["Its capsid dissolves the host membrane", "Its attachment proteins bind to complementary receptor proteins on the host cell", "It is engulfed randomly", "Its ribosomes bind to the cell wall"], "a": 1, "e": "Attachment proteins on the virus are complementary to specific receptors on host cells, which is why viruses infect particular cell types."}, {"q": "Which statement about interphase is correct?", "o": ["The cell grows, organelles are made and DNA replicates", "Chromosomes are visible as chromatids", "The nuclear envelope is absent", "Cells are not active"], "a": 0, "e": "Interphase is a very active phase: DNA replication, protein synthesis, organelle replication and growth all occur."}, {"q": "A chromosome in metaphase is made of:", "o": ["One chromatid", "Four chromatids", "Two homologous chromosomes", "Two sister chromatids joined at a centromere"], "a": 3, "e": "After replication in interphase, each chromosome is two identical sister chromatids held together at the centromere."}, {"q": "In which stage is the number of chromosomes in a cell temporarily doubled because chromatids have separated?", "o": ["Anaphase", "Prophase", "Metaphase", "Interphase"], "a": 0, "e": "Once centromeres divide in anaphase, each chromatid counts as a separate chromosome, so there are briefly twice as many until the cell divides."}, {"q": "What is mitosis used for in multicellular organisms?", "o": ["Producing gametes", "Increasing genetic variation", "Growth, repair of tissues and asexual reproduction", "Halving the chromosome number"], "a": 2, "e": "Mitosis produces identical cells for growth, repair and asexual reproduction. Meiosis produces gametes."}]}, {"id": "3.2c", "order": 6, "section": "3.2", "spec": "3.2.3", "title": "Transport across cell membranes", "desc": "The fluid-mosaic model, simple and facilitated diffusion, osmosis and water potential, active transport and co-transport.", "practicals": [3, 4], "summary": [{"h": "Fluid-mosaic model", "p": ["Membranes are a **phospholipid bilayer** with **proteins** scattered through it (the mosaic). Phospholipids move, so the membrane is **fluid**.", "**Cholesterol** sits between phospholipids. It restricts their movement, making the membrane **less fluid and more rigid**, and reduces leakage of water and ions.", "**Glycoproteins** and **glycolipids** act as receptors and antigens, and are used in cell recognition.", "**Channel proteins** form water-filled pores for specific ions. **Carrier proteins** change shape to move specific molecules.", "The hydrophobic centre of the bilayer stops water-soluble substances such as ions and glucose diffusing straight through."]}, {"h": "Simple and facilitated diffusion", "p": ["**Simple diffusion**: net movement of molecules from a **higher to a lower concentration**, directly through the bilayer. Passive (no ATP). Used by small, non-polar molecules such as O₂ and CO₂.", "**Facilitated diffusion**: passive movement down a concentration gradient **through channel or carrier proteins**. Used for ions and polar molecules such as glucose.", "Rate of diffusion rises with a **steeper concentration gradient**, larger **surface area**, and **thinner** exchange surface (shorter diffusion pathway).", "Rate of facilitated diffusion also depends on the **number of channel or carrier proteins**. Once all are in use, rate levels off."]}, {"h": "Osmosis and water potential", "p": ["**Osmosis**: net movement of water from a **higher (less negative) water potential** to a **lower (more negative) water potential**, across a **partially permeable membrane**.", "Water potential (ψ) is measured in **kPa**. Pure water has ψ = **0 kPa**, the highest possible. Adding solute makes ψ **more negative**.", "Animal cells in a solution with higher ψ gain water and may **burst** (lyse). In lower ψ they shrink.", "Plant cells in higher ψ become **turgid** (the cell wall stops them bursting). In lower ψ they become **plasmolysed**, as the membrane pulls away from the wall."]}, {"h": "Active transport", "p": ["Movement of molecules or ions **against a concentration gradient**, using **ATP** and **carrier proteins**.", "ATP hydrolysis releases a phosphate that binds to the carrier, changing its shape so the molecule is released on the other side.", "Rate depends on the number of carrier proteins and the rate of respiration (ATP supply). Respiratory inhibitors such as cyanide stop it."]}, {"h": "Co-transport: glucose absorption in the ileum", "p": ["**Na⁺ is actively transported out** of the epithelial cell into the blood by a sodium-potassium pump. This keeps Na⁺ concentration inside the cell **low**.", "Na⁺ diffuses into the cell from the lumen down its concentration gradient through a **co-transporter protein**, carrying **glucose** (or amino acids) with it **against its gradient**.", "Glucose then moves into the blood by **facilitated diffusion**.", "This is **indirect active transport**: ATP powers the Na⁺ gradient, not the glucose movement itself."]}, {"h": "Adaptations for rapid transport", "p": ["Cells adapted for rapid transport have more **channel and carrier proteins** and a **larger surface area**, e.g. microvilli on ileum epithelial cells."]}], "pitfalls": ["Water moves from **less negative to more negative** water potential. Don't write 'from high to low concentration of water'.", "Facilitated diffusion is **passive**. It uses proteins but no ATP.", "In co-transport, glucose moves against its gradient but the energy comes from the **Na⁺ gradient** set up by active transport.", "Plant cells don't burst in pure water beca
