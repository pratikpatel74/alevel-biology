utation during replication", "Random alignment of homologous pairs in meiosis I, giving random combinations of maternal and paternal chromosomes in gametes"], "a": 3, "e": "Each pair lines up randomly, so each gamete gets a random mix of chromosomes from each parent."}, {"q": "An organism has a diploid number of 8. How many different combinations of chromosomes are possible in its gametes, from independent segregation alone?", "o": ["16", "8", "256", "64"], "a": 0, "e": "Diploid number 8 means 4 homologous pairs. 2⁴ = 16 combinations."}, {"q": "What happens during crossing over?", "o": ["Homologous chromosomes separate", "Chromatids of homologous chromosomes form chiasmata and exchange sections of DNA", "DNA is replicated", "Chromosomes fail to separate"], "a": 1, "e": "In prophase I, non-sister chromatids of homologous chromosomes swap sections at chiasmata, creating new combinations of alleles."}, {"q": "During which stage does crossing over happen?", "o": ["Anaphase II", "Interphase", "Prophase I", "Telophase I"], "a": 2, "e": "Homologous chromosomes pair up in prophase I, when chiasmata form and crossing over occurs."}, {"q": "How does random fertilisation increase genetic variation?", "o": ["It causes mutations", "It doubles the chromosome number", "It removes harmful alleles", "Any male gamete can fuse with any female gamete, producing new combinations"], "a": 3, "e": "Each gamete is already genetically unique, and which two meet is random, so the number of possible offspring combinations is huge."}, {"q": "Humans have 23 pairs of chromosomes. Ignoring crossing over, how many genetically different gametes can one person make?", "o": ["2²³", "23²", "46", "2 × 23"], "a": 0, "e": "Each of the 23 pairs can line up either way, giving 2²³ (about 8.4 million) combinations."}, {"q": "Which statement correctly compares mitosis and meiosis?", "o": ["Both produce genetically different cells", "Mitosis produces two identical diploid cells; meiosis produces four different haploid cells", "Meiosis has one division", "Mitosis involves crossing over"], "a": 1, "e": "Mitosis: one division, identical diploid cells. Meiosis: two divisions, genetically different haploid cells."}, {"q": "When do spontaneous gene mutations most often occur?", "o": ["During translation", "During transcription", "During DNA replication", "During cytokinesis"], "a": 2, "e": "Gene mutations arise mostly from errors in DNA replication, before cell division."}, {"q": "A DNA sequence CAT GGC TTA has a deletion of the first T. How many triplets are affected?", "o": ["Only the first", "None", "Only the last", "All three triplets from the deletion onward"], "a": 3, "e": "Deleting the T in CAT shifts the reading frame: CAG GCT TA... All triplets from that point change."}, {"q": "Why does a gamete contain only one allele of each gene?", "o": ["Because homologous chromosomes separate in meiosis I", "Because alleles are destroyed in meiosis", "Because of mutation", "Because sister chromatids carry different genes"], "a": 0, "e": "Each homologous chromosome carries one allele. When the pairs separate, each gamete receives one of each pair."}, {"q": "Crossing over increases variation because it:", "o": ["Changes the chromosome number", "Produces new combinations of alleles on chromosomes", "Causes frame shifts", "Makes cells diploid"], "a": 1, "e": "Exchanging sections between homologous chromatids puts alleles together in new combinations on the same chromosome."}]}, {"id": "3.4c", "order": 14, "section": "3.4", "spec": "3.4.4", "title": "Genetic diversity and adaptation", "desc": "Genetic diversity, natural selection, directional and stabilising selection, types of adaptation, and antibiotic resistance in bacteria.", "practicals": [], "summary": [{"h": "Genetic diversity", "p": ["**Genetic diversity** is the **number of different alleles of genes** in a population.", "It is a factor enabling **natural selection**: more diversity means more chance some individuals survive an environmental change.", "New alleles arise by **random mutation**. Genetic diversity falls in small or isolated populations (e.g. after a bottleneck)."]}, {"h": "Natural selection", "p": ["Random **mutation** produces new alleles. Some are **advantageous** in the current environment.", "Individuals with the advantageous allele are more likely to **survive and reproduce** (selection pressure, e.g. predation, disease, competition).", "They **pass the allele on** to offspring.", "Over **many generations**, the **frequency of the advantageous allele increases** in the population."]}, {"h": "Types of selection", "p": ["**Directional selection**: individuals with an **extreme** phenotype are favoured, so the mean shifts. Example: **antibiotic resistance** in bacteria.", "**Stabilising selection**: individuals with phenotypes **near the mean** are favoured, so the range narrows. Example: **human birth weight** (very low and very high weights have higher mortality)."]}, {"h": "Adaptations", "p": ["Natural selection leads to organisms that are better adapted to their environment.", "**Anatomical**: body structure, e.g. thick fur in Arctic animals.", "**Physiological**: processes inside the body, e.g. hibernation lowering metabolic rate.", "**Behavioural**: how an organism acts, e.g. migration or courtship."]}, {"h": "Antibiotic resistance", "p": ["A random **mutation** gives a bacterium an allele for resistance (e.g. an enzyme that breaks down the antibiotic).", "When the antibiotic is used, non-resistant bacteria die. Resistant bacteria survive and reproduce by **binary fission**.", "The resistance allele is passed on (vertical transmission) and can also spread between bacteria on **plasmids** (horizontal transmission).", "Frequency of the resistance allele increases, e.g. MRSA."]}], "pitfalls": ["Mutations are **random**. Bacteria don't mutate 'because of' the antibiotic or 'in order to' survive.", "Say the **frequency of the allele** increases in the population. Individuals don't evolve; populations do.", "Always mention **reproduce and pass on the allele**. Surviving alone isn't enough marks."], "questions": [{"q": "What is genetic diversity?", "o": ["The number of species in a habitat", "The number of different alleles of genes in a population", "The number of individuals in a population", "The number of chromosomes in a cell"], "a": 1, "e": "Genetic diversity is the number of different alleles of genes present in a population."}, {"q": "How do new alleles arise?", "o": ["By random mutation", "By natural selection", "By crossing over only", "By the environment directly changing genes"], "a": 0, "e": "New alleles come from random mutations in DNA. Selection then acts on the variation that already exists."}, {"q": "Why is genetic diversity important for a population?", "o": ["It prevents mutations", "It makes all individuals identical", "It increases the chance some individuals survive an environmental change", "It stops natural selection"], "a": 2, "e": "With more alleles, it is more likely some individuals have characteristics allowing them to survive new conditions."}, {"q": "What is the correct sequence in natural selection?", "o": ["Environment causes mutation, then survival", "Organism decides to adapt", "Survival, then mutation", "Random mutation, advantage, survival and reproduction, allele passed on, allele frequency increases"], "a": 3, "e": "Mutation produces variation. Those with an advantageous allele survive and reproduce more, so the allele becomes more common over generations."}, {"q": "What is directional selection?", "o": ["Individuals with an extreme phenotype are favoured, so the mean shifts", "Individuals near the mean are favoured", "Both extremes are favoured", "No phenotype is favoured"], "a": 0, "e": "In directional selection, one extreme has an advantage, so the population's mean moves in that direction."}, {"q": "Which is an example of stabilising selection?", "o": ["Antibiotic resistance in bacteria", "Human birth weight", "Peppered moth colour after industrial pollution", "Increasing beak size in a drought"], "a": 1, "e": "Babies of average birth weight have the highest survival rates, so very low and very high birth weights are selected against."}, {"q": "How does stabilising selection affect a population over time?", "o": ["The mean shifts to one side", "The range of phenotypes increases", "The range of phenotypes narrows around the mean", "Two new species form"], "a": 2, "e": "Extremes are selected against, so variation around the mean decreases and the curve becomes narrower and taller."}, {"q": "Hibernation is an example of which type of adaptation?", "o": ["Anatomical", "Behavioural only", "Structural", "Physiological"], "a": 3, "e": "Hibernation involves changes in body processes, such as lowering metabolic rate, so it is physiological."}, {"q": "Thick fur in Arctic mammals is an example of which type of adaptation?", "o": ["Anatomical", "Physiological", "Behavioural", "Biochemical"], "a": 0, "e": "Anatomical adaptations are structural features of the body, like fur or body shape."}, {"q": "Birds migrating to warmer climates in winter is which type of adaptation?", "o": ["Physiological", "Behavioural", "Anatomical", "Genetic drift"], "a": 1, "e": "Migration is something the organism does, so it is a behavioural adaptation."}, {"q": "How does antibiotic resistance first appear in a bacterial population?", "o": ["Bacteria choose to become resistant", "The antibiotic causes the mutation", "A random mutation produces an allele for resistance", "Bacteria absorb antibodies"], "a": 2, "e": "Resistance arises by chance mutation. The antibiotic then acts as a selection pressure."}, {"q": "Why does the frequency of an antibiotic resistance allele increase when an antibiotic is used?", "o": ["Antibiotics cause mutations", "All bacteria become resistant at once", "Resistant bacteria are larger", "Non-resistant bacteria die; resistant ones survive, reproduce and pass on the allele"], "a": 3, "e": "The antibiotic kills susceptible bacteria. Resistant bacteria survive, divide by binary fission and pass on the allele."}, {"q": "How can antibiotic resistance alleles spread between different bacteria?", "o": ["On plasmids, passed between bacteria (horizontal transmission)", "Through the air", "By meiosis", "By antibodies"], "a": 0, "e": "Plasmids carrying resistance genes can be transferred between bacteria, even of different species."}, {"q": "Antibiotic resistance is an example of which type of selection?", "o": ["Stabilising", "Directional", "Disruptive", "Random"], "a": 1, "e": "The extreme phenotype (resistance) is favoured, so the population shifts in that direction."}, {"q": "Why is genetic diversity low in a population that has gone through a bottleneck?", "o": ["Mutation rate increased", "Selection favoured the mean", "Few individuals survived, so many alleles were lost", "The population grew rapidly"], "a": 2, "e": "When a population is drastically reduced, many alleles are lost. Even if numbers recover, diversity stays low."}, {"q": "Which statement about natural selection is correct?", "o": ["Individual organisms evolve during their lifetime", "Mutations occur to meet the organism's needs", "Selection creates new alleles", "Allele frequencies change in a population over many generations"], "a": 3, "e": "Evolution is a change in allele frequency in a population over generations. Individuals don't evolve."}, {"q": "Doctors are advised not to prescribe antibiotics unnecessarily. Why?", "o": ["To reduce the selection pressure that favours resistant bacteria", "Because antibiotics cause mutations", "Because antibiotics kill viruses", "Because they increase genetic diversity"], "a": 0, "e": "Each use of an antibiotic selects for resistant bacteria. Less use means less selection for resistance."}, {"q": "What is a selection pressure?", "o": ["A type of mutation", "An environmental factor that affects the chance of survival and reproduction", "The pressure in the xylem", "Pressure of blood in capillaries"], "a": 1, "e": "Selection pressures include predation, disease, competition and climate. They determine which phenotypes survive and reproduce best."}, {"q": "Why must patients complete a full course of antibiotics?", "o": ["To help them build antibodies", "To prevent viral infection", "To kill all the bacteria, including those that are slightly more resistant", "To increase the mutation rate"], "a": 2, "e": "Stopping early may leave the most resistant bacteria alive, which then multiply."}, {"q": "In a population of rabbits, fur colour that matches the background increases over generations. What is the most likely cause?", "o": ["Rabbits change their fur to match", "Mutations are caused by the background", "Stabilising selection removes all variation", "Rabbits with matching fur are less likely to be eaten, so they survive and reproduce more"], "a": 3, "e": "Predation is the selection pressure. Camouflaged rabbits survive and reproduce, passing on the allele for that fur colour."}, {"q": "MRSA is an example of:", "o": ["A bacterium resistant to several antibiotics", "A virus", "A vaccine", "An antibiotic"], "a": 0, "e": "MRSA (methicillin-resistant Staphylococcus aureus) is a bacterium that has evolved resistance to several antibiotics."}, {"q": "How does a mutation become an adaptation?", "o": ["It immediately helps every individual", "If it is advantageous, natural selection increases its frequency over many generations", "It is copied by other organisms", "It replaces all other genes"], "a": 1, "e": "An advantageous allele is passed on more often, so over many generations it becomes common and the population is adapted."}]}, {"id": "3.4d", "order": 15, "section": "3.4", "spec": "3.4.5–3.4.7", "title": "Species, taxonomy and biodiversity", "desc": "Species and courtship, phylogenetic classification and binomial names, species richness and the index of diversity, and measuring genetic diversity.", "practicals": [], "summary": [{"h": "Species and courtship", "p": ["A **species** is a group of organisms that can interbreed to produce **fertile offspring**.", "**Courtship behaviour** helps organisms recognise members of their own species, identify a mate capable of breeding, form a pair bond, and synchronise mating."]}, {"h": "Classification", "p": ["**Phylogenetic classification** groups organisms based on their **evolutionary relationships**. It is **hierarchical**: smaller groups inside larger groups, with **no overlap**.", "The hierarchy: **domain, kingdom, phylum, class, order, family, genus, species**.", "The **binomial system** gives each species a two-part name: **genus** then **species**, e.g. *Homo sapiens*.", "Advances in immunology and genome sequencing help clarify evolutionary relationships."]}, {"h": "Biodiversity", "p": ["**Biodiversity** can relate to a range of habitats, from a small local habitat to the Earth.", "**Species richness**: the number of **different species** in a community.", "**Index of diversity** also takes into account the **number of individuals of each species**.", "`d = N(N − 1) ÷ Σn(n − 1)`, where N = total number of organisms of all species, and n = number of organisms of each species.", "A **higher d** means greater diversity.", "**Farming** reduces biodiversity: removing hedgerows, monoculture, pesticides and herbicides, and draining wetlands. Conservation schemes balance this against food production."]}, {"h": "Investigating genetic diversity", "p": ["Genetic diversity within or between species can be compared using: **observable characteristics**, **DNA base sequences**, **mRNA base sequences**, and **amino acid sequences** of proteins.", "The more similar the sequences, the **more closely related** the species and the more recently they shared a common ancestor.", "Gene technology has changed the methods: direct DNA sequencing is now used, rather than inferring diversity from observable characteristics."]}, {"h": "Quantitative investigations", "p": ["Collect data by **random sampling** and from a large enough sample to be representative.", "Calculate the **mean** and **standard deviation**. Standard deviation shows the **spread** of data around the mean.", "If error bars of ±2 standard deviations (roughly a 95% range) **overlap**, the difference between means is probably **not significant**."]}], "pitfalls": ["In a species definition, include **fertile** offspring. Mules are infertile, so horses and donkeys are separate species.", "Genus has a capital letter. Species doesn't. Both are in italics (or underlined when handwritten).", "Index of diversity: count **n(n − 1)** for each species, then sum. Don't square n.", "Species richness ignores how many of each species there are. Index of diversity doesn't."], "questions": [{"q": "What is a species?", "o": ["Organisms that look the same", "A group of organisms that can interbreed to produce fertile offspring", "All organisms in a habitat", "Organisms in the same genus"], "a": 1, "e": "Members of a species can interbreed and produce fertile offspring."}, {"q": "How does courtship behaviour help reproduction?", "o": ["It allows recognition of the same species and identifies a mate capable of breeding", "It increases mutation rate", "It produces gametes", "It makes offspring identical"], "a": 0, "e": "Courtship helps animals recognise their own species, a sexually mature partner, form a pair bond and synchronise mating."}, {"q": "What is the correct order of taxonomic ranks, from largest to smallest?", "o": ["Kingdom, domain, phylum, class, order, family, genus, species", "Domain, phylum, kingdom, order, class, family, genus, species", "Domain, kingdom, phylum, class, order, family, genus, species", "Species, genus, family, order, class, phylum, kingdom, domain"], "a": 2, "e": "Domain, kingdom, phylum, class, order, family, genus, species. A common memory aid: 'Dear King Philip Came Over For Good Soup'."}, {"q": "What is meant by a phylogenetic classification?", "o": ["Grouping by habitat", "Grouping by size", "Grouping by diet", "Grouping based on evolutionary relationships"], "a": 3, "e": "Phylogenetic classification groups organisms by how closely related they are through evolution."}, {"q": "What is meant by 'hierarchical' in classification?", "o": ["Smaller groups are placed within larger groups, with no overlap", "Groups overlap", "There are only two groups", "Organisms are ranked by size"], "a": 0, "e": "In a hierarchy, each group fits entirely inside a larger group, and groups at the same level don't overlap."}, {"q": "In the binomial name Panthera leo, what does Panthera represent?", "o": ["Species", "Genus", "Family", "Kingdom"], "a": 1, "e": "The first part is the genus (capital letter). The second part is the species."}, {"q": "What is species richness?", "o": ["The number of individuals of one species", "The genetic diversity of a population", "The number of different species in a community", "The index of diversity"], "a": 2, "e": "Species richness is a simple count of how many different species are present."}, {"q": "Why is the index of diversity more useful than species richness?", "o": ["It counts only the most common species", "It ignores rare species", "It is easier to calculate", "It also takes into account the number of individuals of each species"], "a": 3, "e": "The index of diversity accounts for both species number and evenness, so a community dominated by one species scores lower."}, {"q": "A community has 3 species with 2, 3 and 5 individuals. What is the index of diversity? (d = N(N−1) ÷ Σn(n−1))", "o": ["3.21", "1.67", "10.0", "2.50"], "a": 0, "e": "N = 10, so N(N−1) = 90. Σn(n−1) = 2 + 6 + 20 = 28. d = 90 ÷ 28 = 3.21."}, {"q": "What does a higher index of diversity indicate?", "o": ["Fewer species", "Greater biodiversity", "More individuals of one species", "Less stable habitat"], "a": 1, "e": "A higher value means more species and individuals spread more evenly among them."}, {"q": "Which farming practice reduces biodiversity?", "o": ["Planting hedgerows", "Leaving field margins uncultivated", "Monoculture", "Crop rotation"], "a": 2, "e": "Growing a single crop over large areas supports fewer species. Removing hedgerows and using pesticides also reduce diversity."}, {"q": "Which of these is NOT used to compare genetic diversity directly?", "o": ["DNA base sequences", "mRNA base sequences", "Amino acid sequences", "The number of individuals in a population"], "a": 3, "e": "Genetic diversity can be compared by observable characteristics, DNA and mRNA base sequences, and amino acid sequences. Population size doesn't show diversity."}, {"q": "Two species have very similar DNA base sequences. What does this suggest?", "o": ["They are closely related and shared a common ancestor recently", "They are distantly related", "They live in the same habitat", "They are the same size"], "a": 0, "e": "Fewer differences in base sequence mean less time has passed since the species diverged."}, {"q": "Why might comparing amino acid sequences underestimate genetic differences?", "o": ["Amino acids are not made from DNA", "The genetic code is degenerate, so some DNA differences don't change amino acids", "Amino acid sequences change faster", "Proteins contain introns"], "a": 1, "e": "Some base substitutions give the same amino acid, so differences in DNA may not appear in the protein."}, {"q": "Why is comparing DNA sequences better than comparing observable characteristics?", "o": ["It is cheaper", "It doesn't need a sample", "Observable characteristics can be affected by the environment and by many genes", "Observable characteristics never vary"], "a": 2, "e": "Phenotype depends on the environment and many genes. DNA sequencing compares the genetic material directly."}, {"q": "What does standard deviation measure?", "o": ["The mean value", "The largest value", "The sample size", "The spread of data around the mean"], "a": 3, "e": "Standard deviation measures how spread out data values are from the mean."}, {"q": "The error bars (mean ± 2 SD) for two groups overlap a lot. What can you conclude?", "o": ["The difference between the means is probably not significant", "The means are definitely different", "The data are invalid", "One group was not sampled"], "a": 0, "e": "Large overlap suggests the difference could be due to chance, so it is likely not significant."}, {"q": "Why is random sampling used when investigating variation?", "o": ["To make calculations easier", "To avoid sampling bias, so the sample is representative", "To increase the mean", "To reduce the number of samples needed to one"], "a": 1, "e": "Random sampling means every individual has an equal chance of selection, avoiding bias."}, {"q": "Horses and donkeys can breed to produce mules, which are infertile. Why are horses and donkeys separate species?", "o": ["They look different", "They live in different places", "Their offspring are not fertile", "They have the same number of chromosomes"], "a": 2, "e": "Members of the same species produce fertile offspring. Mules are infertile, so horses and donkeys are separate species."}, {"q": "Which advance has most helped clarify evolutionary relationships?", "o": ["Better binoculars", "Larger museums", "More detailed drawings", "Genome sequencing"], "a": 3, "e": "Genome sequencing allows direct comparison of DNA, giving more accurate evidence of relatedness. Immunological comparisons have also helped."}, {"q": "How is a species name correctly written?", "o": ["Genus with a capital letter, species with a lower-case letter, both in italics", "Both with capital letters", "Species first, then genus", "All in capital letters"], "a": 0, "e": "E.g. Homo sapiens: genus capitalised, species lower case, both italicised (or underlined when handwritten)."}, {"q": "Species A has 100 individuals; species B has 1. Species C and D have 50 each. Which community has the higher index of diversity, AB or CD?", "o": ["AB, because it has more individuals", "CD, because the individuals are spread evenly across the species", "They are equal", "Neither can be calculated"], "a": 1, "e": "Both have two species, but CD's individuals are evenly spread. AB is dominated by one species, so its index is lower."}]}, {"id": "3.5a", "order": 16, "section": "3.5", "spec": "3.5.1", "title": "Photosynthesis", "desc": "The light-dependent reaction (photoionisation, photolysis, chemiosmosis), the light-independent reaction (Calvin cycle), and limiting factors.", "practicals": [7, 8], "summary": [{"h": "Overview", "p": ["Photosynthesis happens in **chloroplasts**. The **light-dependent reaction** happens on the **thylakoid membranes**. The **light-independent reaction** happens in the **stroma**."]}, {"h": "Light-dependent reaction", "p": ["**Photoionisation**: light energy is absorbed by **chlorophyll**, which excites electrons. They leave the chlorophyll, which becomes positively charged (ionised).", "Some energy from these electrons is used to make **ATP** and reduced **NADP**.", "Electrons pass along an **electron transfer chain** of carrier proteins in the thylakoid membrane, releasing energy.", "**Chemiosmosis**: this energy is used to pump **H⁺** into the **thylakoid space**. H⁺ diffuses back into the stroma through **ATP synthase**, which makes ATP from ADP and Pi.", "**Photolysis**: light splits water. `2H₂O → 4H⁺ + 4e⁻ + O₂`. The electrons replace those lost from chlorophyll. O₂ is a by-product.", "Electrons and H⁺ reduce **NADP** to **reduced NADP**."]}, {"h": "Light-independent reaction (Calvin cycle)", "p": ["CO₂ reacts with **ribulose bisphosphate (RuBP)**, a 5-carbon compound, catalysed by the enzyme **rubisco**. This produces two molecules of **glycerate 3-phosphate (GP)**.", "GP is **reduced** to **triose phosphate (TP)**, using **reduced NADP** and energy from **ATP**.", "Some TP is converted into useful organic substances, e.g. glucose, starch, amino acids and lipids.", "Most TP is used to **regenerate RuBP**, which also needs **ATP**.", "For one glucose (6C), the cycle turns **six** times."]}, {"h": "Limiting factors", "p": ["**Light intensity**, **CO₂ concentration** and **temperature** limit the rate. The factor in shortest supply is the limiting factor.", "Low light: less ATP and reduced NADP, so GP accumulates and RuBP falls.", "Low CO₂: less GP is made, so RuBP accumulates.", "Low temperature: enzymes such as rubisco work more slowly.", "Growers use this: greenhouses with extra light, heating and CO₂ burners, but only where the extra yield pays for the cost."]}], "pitfalls": ["Light-dependent on the **thylakoid membranes**; light-independent in the **stroma**.", "Oxygen comes from **water** (photolysis), not from CO₂.", "In the Calvin cycle, GP is **reduced** to TP. Don't say GP is 'oxidised'.", "Graph trick: on a rate-against-light graph, where the line levels off, light is **no longer** the limiting factor."], "questions": [{"q": "Where does the light-dependent reaction take place?", "o": ["Stroma", "Thylakoid membranes", "Mitochondrial matrix", "Cytoplasm"], "a": 1, "e": "The light-dependent reaction happens on thylakoid membranes, where chlorophyll and electron carriers are located."}, {"q": "What is photoionisation?", "o": ["Light excites electrons in chlorophyll, which are lost, so chlorophyll becomes positively charged", "Light splits water molecules", "Light makes glucose", "Light activates rubisco"], "a": 0, "e": "Absorbed light raises electrons to a higher energy level and they leave the chlorophyll, ionising it."}, {"q": "What is produced by the photolysis of water?", "o": ["Glucose and oxygen", "ATP and NADP", "H⁺, electrons and oxygen", "CO₂ and water"], "a": 2, "e": "2H₂O → 4H⁺ + 4e⁻ + O₂. Electrons replace those lost from chlorophyll, and H⁺ is used to reduce NADP."}, {"q": "What happens to electrons from photoionisation?", "o": ["They are used to split water", "They combine with oxygen", "They are released as heat", "They pass along an electron transfer chain, releasing energy"], "a": 3, "e": "Electrons pass between carrier proteins, losing energy at each step. This energy pumps H⁺ across the thylakoid membrane."}, {"q": "How is ATP produced in the light-dependent reaction?", "o": ["H⁺ diffuses from the thylakoid space through ATP synthase, which makes ATP (chemiosmosis)", "Glucose is broken down", "Substrate-level phosphorylation in the stroma", "Water reacts with ADP"], "a": 0, "e": "H⁺ pumped into the thylakoid space diffuses back into the stroma through ATP synthase, which phosphorylates ADP."}, {"q": "Which two products of the light-dependent reaction are used in the light-independent reaction?", "o": ["Oxygen and water", "ATP and reduced NADP", "Glucose and CO₂", "RuBP and GP"], "a": 1, "e": "ATP provides energy and reduced NADP provides hydrogen (reducing power) for converting GP to TP."}, {"q": "Where does the light-independent reaction take place?", "o": ["Thylakoid membranes", "Thylakoid space", "Stroma", "Grana"], "a": 2, "e": "The Calvin cycle enzymes, including rubisco, are in the stroma."}, {"q": "Which enzyme catalyses the reaction between CO₂ and RuBP?", "o": ["ATP synthase", "NADP reductase", "Lipase", "Rubisco"], "a": 3, "e": "Rubisco catalyses the fixation of CO₂ with RuBP, forming two molecules of GP."}, {"q": "What is produced when CO₂ combines with RuBP?", "o": ["Two molecules of glycerate 3-phosphate (GP)", "Triose phosphate", "Glucose", "Pyruvate"], "a": 0, "e": "CO₂ (1C) + RuBP (5C) gives an unstable 6C compound that splits into two GP (3C)."}, {"q": "How is GP converted to triose phosphate?", "o": ["It is oxidised using oxygen", "It is reduced using reduced NADP and energy from ATP", "It is phosphorylated using water", "It is decarboxylated"], "a": 1, "e": "GP is reduced to TP. Reduced NADP supplies hydrogen, and ATP supplies energy."}, {"q": "What happens to most of the triose phosphate produced?", "o": ["It is converted to glucose", "It is exported to the cytoplasm", "It is used to regenerate RuBP", "It is broken down to CO₂"], "a": 2, "e": "Five out of every six TP molecules are used to regenerate RuBP, using ATP, so the cycle can continue."}, {"q": "How many turns of the Calvin cycle are needed to make one glucose molecule?", "o": ["One", "Two", "Three", "Six"], "a": 3, "e": "Each turn fixes one CO₂. Glucose has six carbons, so six turns are needed."}, {"q": "A plant is moved from light into darkness. What happens to GP and RuBP levels?", "o": ["GP rises and RuBP falls", "GP falls and RuBP rises", "Both rise", "Both fall"], "a": 0, "e": "Without light, ATP and reduced NADP aren't made, so GP can't be reduced and accumulates. RuBP isn't regenerated, so it falls."}, {"q": "CO₂ concentration around a plant drops sharply. What happens to RuBP?", "o": ["It falls, because it combines with CO₂", "It rises, because it isn't being used to fix CO₂ but is still regenerated", "It stays the same", "It is converted to glucose"], "a": 1, "e": "With little CO₂, RuBP isn't used up, but TP already present still regenerates it, so RuBP accumulates and GP falls."}, {"q": "On a graph of rate of photosynthesis against light intensity, the curve levels off. What does this show?", "o": ["Light is now the limiting factor", "Photosynthesis has stopped", "Another factor, such as CO₂ or temperature, is now limiting", "The plant is dead"], "a": 2, "e": "When increasing light no longer increases the rate, something else is limiting."}, {"q": "Why does low temperature limit photosynthesis?", "o": ["Chlorophyll is destroyed", "Less light is absorbed", "Water freezes", "Enzymes such as rubisco work more slowly"], "a": 3, "e": "The light-independent reaction depends on enzymes. Low temperature reduces their kinetic energy and activity."}, {"q": "Why might a grower add CO₂ to a greenhouse?", "o": ["To increase the rate of photosynthesis when CO₂ is limiting, increasing yield", "To kill pests", "To reduce temperature", "To increase oxygen"], "a": 0, "e": "If CO₂ is limiting, adding more increases photosynthesis and yield. Growers balance the cost against extra profit."}, {"q": "In RP7, why is the origin line drawn in pencil?", "o": ["Pencil is easier to see", "Ink would dissolve in the solvent and run with the pigments", "Pencil absorbs pigment", "Ink would react with chlorophyll"], "a": 1, "e": "Graphite doesn't dissolve, so it doesn't interfere with the separation."}, {"q": "A pigment moves 3.6 cm and the solvent front moves 8.0 cm. What is the Rf value?", "o": ["2.22", "4.4", "0.45", "0.36"], "a": 2, "e": "Rf = distance moved by spot ÷ distance moved by solvent = 3.6 ÷ 8.0 = 0.45."}, {"q": "In RP8, why does DCPIP turn from blue to colourless?", "o": ["It is oxidised by oxygen", "It is broken down by heat", "It is absorbed by chloroplasts", "It accepts electrons from the light-dependent reaction and is reduced"], "a": 3, "e": "DCPIP acts as an electron acceptor in place of NADP. When reduced, it loses its blue colour."}, {"q": "In RP8, why is the chloroplast extract kept ice-cold?", "o": ["To slow enzymes that could damage the chloroplasts", "To speed up the reaction", "To dissolve the pigments", "To stop osmosis"], "a": 0, "e": "Low temperature reduces the activity of enzymes released from broken cells that could damage chloroplasts."}, {"q": "Where are H⁺ ions pumped into during the light-dependent reaction?", "o": ["The stroma", "The thylakoid space", "The cytoplasm", "The intermembrane space of mitochondria"], "a": 1, "e": "H⁺ is pumped into the thylakoid space, creating a gradient. It diffuses back into the stroma through ATP synthase."}]}, {"id": "3.5b", "order": 17, "section": "3.5", "spec": "3.5.2", "title": "Respiration", "desc": "Glycolysis, the link reaction, the Krebs cycle, oxidative phosphorylation, anaerobic respiration, and other respiratory substrates.", "practicals": [9], "summary": [{"h": "Glycolysis (cytoplasm)", "p": ["First stage of both aerobic and anaerobic respiration. Happens in the **cytoplasm**.", "Glucose is **phosphorylated** using **2 ATP**, forming a sugar bisphosphate, which splits into **two triose phosphate** molecules.", "Each triose phosphate is **oxidised** to **pyruvate**. This produces ATP and **reduced NAD**.", "Net yield per glucose: **2 ATP**, **2 reduced NAD** and **2 pyruvate**."]}, {"h": "Link reaction (mitochondrial matrix)", "p": ["Pyruvate is actively transported into the **matrix**.", "It is **oxidised** to **acetate**, producing **CO₂** and **reduced NAD**.", "Acetate combines with **coenzyme A** to form **acetylcoenzyme A**."]}, {"h": "Krebs cycle (matrix)", "p": ["Acetylcoenzyme A (2C) reacts with a **4-carbon** molecule (oxaloacetate), releasing coenzyme A and forming a **6-carbon** molecule (citrate).", "In a series of oxidation-reduction reactions, the 6C molecule is converted back to the 4C molecule, producing **reduced NAD**, **reduced FAD**, **ATP** (by substrate-level phosphorylation) and **CO₂**.", "The cycle turns **twice** per glucose, because there are two pyruvates."]}, {"h": "Oxidative phosphorylation (inner membrane)", "p": ["Reduced NAD and reduced FAD release **electrons** and H⁺. Electrons pass along the **electron transfer chain** on the **cristae** (inner mitochondrial membrane).", "Energy released pumps **H⁺** into the **intermembrane space**, creating an electrochemical gradient.", "H⁺ diffuses back into the matrix through **ATP synthase**, producing **ATP** (**chemiosmosis**).", "**Oxygen** is the **final electron acceptor**. It combines with electrons and H⁺ to form **water**. Without oxygen, the chain stops."]}, {"h": "Anaerobic respiration", "p": ["Only glycolysis happens, producing 2 ATP per glucose.", "Pyruvate is converted to **lactate** (animals, some bacteria) or **ethanol and CO₂** (plants, yeast).", "This **regenerates NAD** (oxidises reduced NAD), so glycolysis can continue."]}, {"h": "Other respiratory substrates", "p": ["**Lipids**: hydrolysed to glycerol and fatty acids. Glycerol is converted to triose phosphate. Fatty acids are broken into 2-carbon fragments that form acetylcoenzyme A.", "**Proteins**: hydrolysed to amino acids, which are **deaminated**. The remaining part enters the Krebs cycle or link reaction."]}], "pitfalls": ["Glycolysis is in the **cytoplasm**. Link and Krebs in the **matrix**. Electron transfer chain on the **inner membrane (cristae)**.", "Oxygen is the **final electron acceptor**. It isn't 'used to make ATP' directly.", "Anaerobic respiration's key point: **NAD is regenerated** so glycolysis continues.", "Krebs cycle produces only a small amount of ATP directly. Most ATP comes from oxidative phosphorylation."], "questions": [{"q": "Where does glycolysis take place?", "o": ["Mitochondrial matrix", "Cytoplasm", "Inner mitochondrial membrane", "Stroma"], "a": 1, "e": "Glycolysis happens in the cytoplasm. It doesn't need oxygen, so it occurs in both aerobic and anaerobic respiration."}, {"q": "What is the net yield of glycolysis per glucose molecule?", "o": ["2 ATP, 2 reduced NAD and 2 pyruvate", "4 ATP and 2 pyruvate", "36 ATP", "2 ATP and 2 lactate"], "a": 0, "e": "Glycolysis uses 2 ATP and makes 4, so the net yield is 2 ATP, plus 2 reduced NAD and 2 pyruvate."}, {"q": "Why is glucose phosphorylated at the start of glycolysis?", "o": ["To make it into pyruvate", "To make CO₂", "To make it more reactive, so it can be split into two triose phosphates", "To produce reduced NAD"], "a": 2, "e": "Adding phosphate from ATP makes glucose more reactive, so it can split into two triose phosphate molecules."}, {"q": "What happens in the link reaction?", "o": ["Glucose is split into pyruvate", "Electrons are passed to oxygen", "Citrate is formed", "Pyruvate is oxidised to acetate, producing CO₂ and reduced NAD"], "a": 3, "e": "Pyruvate loses CO₂ and hydrogen (to NAD), forming acetate, which combines with coenzyme A."}, {"q": "Where does the link reaction take place?", "o": ["Mitochondrial matrix", "Cytoplasm", "Intermembrane space", "Thylakoids"], "a": 0, "e": "Pyruvate is actively transported into the matrix of the mitochondrion, where the link reaction happens."}, {"q": "In the Krebs cycle, acetylcoenzyme A combines with a 4-carbon molecule to form:", "o": ["A 2-carbon molecule", "A 6-carbon molecule", "A 3-carbon molecule", "A 5-carbon molecule"], "a": 1, "e": "Acetyl (2C) + oxaloacetate (4C) gives citrate (6C). This is gradually converted back to the 4C molecule."}, {"q": "Which is NOT produced in the Krebs cycle?", "o": ["Reduced NAD", "Reduced FAD", "Oxygen", "CO₂"], "a": 2, "e": "The Krebs cycle produces reduced NAD, reduced FAD, ATP and CO₂. Oxygen is used at the end of the electron transfer chain, not produced."}, {"q": "How many times does the Krebs cycle turn for each glucose molecule?", "o": ["Once", "Four times", "Six times", "Twice"], "a": 3, "e": "Each glucose produces two pyruvate, which give two acetylcoenzyme A, so the cycle turns twice."}, {"q": "Where is the electron transfer chain in mitochondria?", "o": ["On the inner membrane (cristae)", "In the matrix", "On the outer membrane", "In the cytoplasm"], "a": 0, "e": "The electron carriers and ATP synthase are embedded in the inner mitochondrial membrane, folded into cristae."}, {"q": "What is the role of oxygen in aerobic respiration?", "o": ["It splits glucose", "It is the final electron acceptor, combining with electrons and H⁺ to form water", "It forms CO₂", "It phosphorylates ADP"], "a": 1, "e": "Oxygen accepts electrons at the end of the chain. Without it, electrons can't flow and oxidative phosphorylation stops."}, {"q": "Where are H⁺ ions pumped during oxidative phosphorylation?", "o": ["Into the matrix", "Into the cytoplasm", "Into the intermembrane space", "Into the thylakoid space"], "a": 2, "e": "Energy from electrons pumps H⁺ from the matrix into the intermembrane space. They diffuse back through ATP synthase."}, {"q": "What is chemiosmosis?", "o": ["Movement of water across a membrane", "Splitting of glucose", "Production of ATP directly in the Krebs cycle", "H⁺ diffusing through ATP synthase down an electrochemical gradient, driving ATP synthesis"], "a": 3, "e": "The H⁺ gradient provides energy. As H⁺ flows through ATP synthase, ADP is phosphorylated to ATP."}, {"q": "A respiratory inhibitor blocks the electron transfer chain. What happens?", "o": ["Oxidative phosphorylation stops, so much less ATP is made", "More ATP is made", "Glycolysis stops completely", "Oxygen use increases"], "a": 0, "e": "Without electron flow, no H⁺ gradient forms, so ATP synthase can't make ATP. Only a small amount comes from glycolysis."}, {"q": "In anaerobic respiration in mammals, pyruvate is converted to:", "o": ["Ethanol and CO₂", "Lactate", "Acetylcoenzyme A", "Glucose"], "a": 1, "e": "Mammalian muscle converts pyruvate to lactate, regenerating NAD."}, {"q": "What does yeast produce in anaerobic respiration?", "o": ["Lactate", "Oxygen", "Ethanol and CO₂", "Citrate"], "a": 2, "e": "Yeast and plants convert pyruvate to ethanol and carbon dioxide."}, {"q": "Why is pyruvate converted to lactate or ethanol in anaerobic respiration?", "o": ["To make more ATP", "To store energy", "To produce oxygen", "To regenerate NAD so glycolysis can continue"], "a": 3, "e": "Reduced NAD from glycolysis is oxidised back to NAD. Without this, glycolysis would stop for lack of NAD."}, {"q": "Why does anaerobic respiration produce much less ATP than aerobic?", "o": ["Only glycolysis happens; the link reaction, Krebs cycle and oxidative phosphorylation don't", "Glucose isn't used", "Lactate is toxic", "ATP synthase works backwards"], "a": 0, "e": "Without oxygen, the electron transfer chain stops, and so do the Krebs cycle and link reaction. Only 2 ATP come from glycolysis."}, {"q": "How are fatty acids used in respiration?", "o": ["They are converted to glucose", "They are broken into 2-carbon fragments that form acetylcoenzyme A", "They are deaminated", "They are used only in glycolysis"], "a": 1, "e": "Fatty acids are split into many 2C units that enter the Krebs cycle as acetylcoenzyme A. This releases a lot of energy."}, {"q": "How are amino acids used as respiratory substrates?", "o": ["Directly in glycolysis", "Converted into lipids first", "They are deaminated, and the rest enters the Krebs cycle or link reaction", "They can't be used"], "a": 2, "e": "The amino group is removed (deamination). The remaining carbon skeleton enters respiration at various points."}, {"q": "In a respirometer for RP9, what is the role of soda lime?", "o": ["To provide oxygen", "To keep temperature constant", "To feed the yeast", "To absorb CO₂, so movement of the liquid shows O₂ uptake"], "a": 3, "e": "With CO₂ absorbed, any volume change is due to oxygen being used, so the liquid moves toward the organisms."}, {"q": "In RP9, the liquid moves 25 mm in 10 minutes in a capillary of radius 0.5 mm. What is the rate of O₂ uptake?", "o": ["1.96 mm³ min⁻¹", "19.6 mm³ min⁻¹", "2.5 mm³ min⁻¹", "0.79 mm³ min⁻¹"], "a": 0, "e": "Volume = πr²h = 3.14 × 0.25 × 25 = 19.6 mm³. Rate = 19.6 ÷ 10 = 1.96 mm³ min⁻¹."}, {"q": "Where is ATP made by substrate-level phosphorylation in aerobic respiration?", "o": ["Only in the electron transfer chain", "In glycolysis and the Krebs cycle", "Only in the link reaction", "In ATP synthase"], "a": 1, "e": "Substrate-level phosphorylation transfers phosphate directly from a substrate to ADP, in glycolysis and the Krebs cycle."}]}, {"id": "3.5c", "order": 18, "section": "3.5", "spec": "3.5.3", "title": "Energy and ecosystems", "desc": "Biomass and its measurement, gross and net primary production, net production of consumers, efficiency of energy transfer, and farming practices.", "practicals": [], "summary": [{"h": "Biomass", "p": ["Plants use sugars from photosynthesis to make other biological molecules, which form their **biomass**.", "Biomass can be measured as **mass of carbon** or **dry mass** of tissue per given area (e.g. kg m⁻²), sometimes per year.", "Dry mass is found by heating samples at low temperature until **constant mass** (all water removed).", "The chemical energy store in dry biomass can be estimated by **calorimetry**: burning a sample and measuring the temperature rise of a known mass of water."]}, {"h": "Primary production", "p": ["**Gross primary production (GPP)**: the chemical energy store in plant biomass, in a given area or volume.", "**Net primary production (NPP)**: the chemical energy store after **respiratory losses** are taken into account.", "`NPP = GPP − R`, where R is respiratory losses.", "NPP is available for **plant growth and reproduction**, and to other **trophic levels**.", "Units are often kJ m⁻² year⁻¹ (energy per area per time)."]}, {"h": "Net production of consumers", "p": ["`N = I − (F + R)`", "I = chemical energy store in **ingested** food, F = energy lost in **faeces and urine**, R = energy lost by **respiration**.", "Only a small fraction of energy passes to the next trophic level, because of respiration (heat), parts not eaten, and parts not digested.", "`Efficiency of transfer = (energy at higher level ÷ energy at lower level) × 100`"]}, {"h": "Farming practices", "p": ["Farming aims to increase the efficiency of energy transfer to people.", "**Simplifying food webs**: removing pests and weeds with pesticides and herbicides, so less energy goes to other organisms.", "**Reducing respiratory losses** in livestock: keeping animals in warm sheds and restricting movement, so more energy goes to growth. This raises ethical concerns about animal welfare.", "Slaughtering animals young, while they are still growing efficiently, also helps."]}], "pitfalls": ["Show NPP = GPP − R clearly, with units, in every calculation.", "In N = I − (F + R), add F and R first, then subtract from I.", "Respiration losses are mainly **heat**. Energy isn't 'used up' or 'destroyed'.", "Dry mass is used because water content varies and holds no chemical energy."], "questions": [{"q": "Why is dry mass used to measure biomass rather than fresh mass?", "o": ["Water content varies a lot between organisms and over time", "Dry mass is always larger", "Water contains a lot of energy", "Fresh mass can't be measured"], "a": 0, "e": "Water content varies with conditions and contains no chemical energy, so dry mass gives a more reliable measure."}, {"q": "How is dry mass found?", "o": ["Burning the sample", "Heating at low temperature until the mass stays constant", "Freezing the sample", "Weighing it fresh and halving it"], "a": 1, "e": "Samples are dried in an oven at low temperature and reweighed until the mass doesn't change, showing all water is gone."}, {"q": "What is gross primary production (GPP)?", "o": ["Energy available to herbivores", "Energy lost in respiration", "The chemical energy store in plant biomass, in a given area or volume", "Energy in faeces"], "a": 2, "e": "GPP is the total chemical energy stored by plants through photosynthesis in a given area over a given time."}, {"q": "Which equation gives net primary production?", "o": ["NPP = GPP + R", "NPP = I − (F + R)", "NPP = R − GPP", "NPP = GPP − R"], "a": 3, "e": "NPP is the energy left after plant respiratory losses: NPP = GPP − R."}, {"q": "GPP is 25 000 kJ m⁻² year⁻¹ and respiratory losses are 15 000 kJ m⁻² year⁻¹. What is NPP?", "o": ["10 000 kJ m⁻² year⁻¹", "40 000 kJ m⁻² year⁻¹", "1.67 kJ m⁻² year⁻¹", "15 000 kJ m⁻² year⁻¹"], "a": 0, "e": "NPP = GPP − R = 25 000 − 15 000 = 10 000 kJ m⁻² year⁻¹."}, {"q": "What is NPP available for?", "o": ["Only respiration", "Plant growth and reproduction, and other trophic levels", "Only decomposers", "Photosynthesis"], "a": 1, "e": "NPP is the energy stored in new plant biomass, used for growth and reproduction and available to consumers."}, {"q": "In N = I − (F + R), what does F represent?", "o": ["Food eaten", "Energy for growth", "Energy lost in faeces and urine", "Energy lost in respiration"], "a": 2, "e": "F is the chemical energy lost in faeces and urine, which is not absorbed or is excreted."}, {"q": "A cow ingests 3000 kJ. 1800 kJ is lost in faeces and urine and 1000 kJ in respiration. What is its net production?", "o": ["2000 kJ", "800 kJ", "4800 kJ", "200 kJ"], "a": 3, "e": "N = I − (F + R) = 3000 − (1800 + 1000) = 200 kJ."}, {"q": "Energy at trophic level 1 is 20 000 kJ and at level 2 is 1 500 kJ. What is the efficiency of transfer?", "o": ["7.5%", "13.3%", "75%", "0.075%"], "a": 0, "e": "Efficiency = (1500 ÷ 20 000) × 100 = 7.5%."}, {"q": "Why is energy transfer between trophic levels inefficient?", "o": ["Energy is destroyed", "Energy is lost as heat in respiration, and some parts are not eaten or digested", "All energy is used in photosynthesis", "Consumers don't need energy"], "a": 1, "e": "Much energy is lost as heat from respiration. Some biomass isn't eaten (e.g. roots, bones) or isn't digested and is lost in faeces."}, {"q": "How does calorimetry estimate the energy in biomass?", "o": ["By measuring CO₂ given off", "By weighing the sample", "By burning the sample and measuring the temperature rise of a known mass of water", "By measuring oxygen produced"], "a": 2, "e": "Energy released by burning heats the water. Temperature rise × mass of water × specific heat capacity gives the energy."}, {"q": "Why do farmers keep livestock in warm sheds with restricted movement?", "o": ["To increase respiratory losses", "To increase the number of trophic levels", "To make animals eat less", "To reduce respiratory losses, so more energy goes into growth"], "a": 3, "e": "Less energy is used keeping warm and moving, so more energy is converted to biomass. This raises animal welfare concerns."}, {"q": "How does using pesticides increase the efficiency of energy transfer to crops?", "o": ["It simplifies food webs, so less energy is lost to pests", "It increases photosynthesis directly", "It increases the number of species", "It raises the temperature"], "a": 0, "e": "Pests eat crop biomass. Removing them means more of the crop's energy is available to humans."}, {"q": "Why do herbicides increase crop yield?", "o": ["They kill insects", "They remove weeds that compete with crops for light, water and nutrients", "They add nitrogen", "They increase respiration"], "a": 1, "e": "Without competition from weeds, crops get more resources for photosynthesis, so more energy is stored in the crop."}, {"q": "Which unit is most suitable for primary production?", "o": ["kJ", "g", "kJ m⁻² year⁻¹", "m² year⁻¹"], "a": 2, "e": "Production is a rate of energy storage per area: e.g. kJ per square metre per year."}, {"q": "Why is a food chain rarely longer than four or five trophic levels?", "o": ["Predators don't eat other predators", "Plants don't photosynthesise enough", "There is too much energy at the top", "Too little energy is left at higher levels to support another population"], "a": 3, "e": "Energy is lost at each transfer, so after a few levels there isn't enough to sustain another trophic level."}, {"q": "Why is the energy in roots of grass often not passed to grazing animals?", "o": ["Roots are not eaten", "Roots contain no energy", "Roots are always digested", "Roots respire too fast"], "a": 0, "e": "Grazing animals eat leaves, not roots, so the energy stored in roots is not transferred to them."}, {"q": "Which statement best explains why carnivores often absorb more of their food's energy than herbivores?", "o": ["Carnivores eat less", "Meat contains less cellulose and is easier to digest, so less is lost in faeces", "Carnivores don't respire", "Plant material contains more energy"], "a": 1, "e": "Herbivores eat a lot of cellulose, which is hard to digest, so more energy is lost in faeces."}, {"q": "Why does slaughtering animals young increase the efficiency of meat production?", "o": ["Young animals respire more", "Young animals eat more", "Young animals convert a larger proportion of their food into new biomass", "Older animals contain no energy"], "a": 2, "e": "Growing animals convert more energy into body mass. Adults use more energy for maintenance."}, {"q": "A plant has an NPP of 6 000 kJ m⁻² year⁻¹ and a herbivore gains 600 kJ m⁻² year⁻¹ from it. What percentage of NPP is transferred?", "o": ["1%", "60%", "0.1%", "10%"], "a": 3, "e": "(600 ÷ 6000) × 100 = 10%."}, {"q": "What is the main ethical concern with intensive livestock farming?", "o": ["Animal welfare, because movement is restricted", "It increases biodiversity", "It reduces food production", "It uses too few antibiotics"], "a": 0, "e": "Restricting movement and keeping animals in small spaces raises welfare concerns."}, {"q": "What does R represent in NPP = GPP − R?", "o": ["Energy in faeces", "Respiratory losses", "Reproduction", "Radiation absorbed"], "a": 1, "e": "R is the energy plants lose through respiration."}]}, {"id": "3.5d", "order": 19, "section": "3.5", "spec": "3.5.4", "title": "Nutrient cycles", "desc": "The nitrogen and phosphorus cycles, saprobionts and mycorrhizae, natural and artificial fertilisers, leaching and eutrophication.", "practicals": [], "summary": [{"h": "Saprobionts and mycorrhizae", "p": ["Nutrients are recycled within natural ecosystems. Microorganisms play a vital role.", "**Saprobionts** (saprotrophs) feed on dead organisms and waste by **extracellular digestion**: they secrete enzymes and absorb the products. This releases nutrients such as ammonium and phosphate ions.", "**Mycorrhizae** are associations between **fungi and plant roots**. Fungal hyphae act as an extension of the root system, increasing **surface area** for absorbing water and mineral ions (especially phosphate). The fungus gets organic compounds such as sugars."]}, {"h": "The nitrogen cycle", "p": ["**Ammonification**: saprobionts break down nitrogen-containing compounds (proteins, urea, DNA) in dead organisms and waste into **ammonia/ammonium ions (NH₄⁺)**.", "**Nitrification**: **nitrifying bacteria** oxidise ammonium to **nitrites (NO₂⁻)** and then to **nitrates (NO₃⁻)**. Needs **oxygen** (aerobic).", "**Nitrogen fixation**: **nitrogen-fixing bacteria** convert N₂ gas into ammonia. Some are free-living in soil; others live in **root nodules of legumes** (mutualism).", "**Denitrification**: **denitrifying bacteria** convert nitrates back to **N₂ gas**. Happens in **anaerobic** (waterlogged) soil.", "Plants absorb nitrates and ammonium to make proteins, nucleic acids and ATP."]}, {"h": "The phosphorus cycle", "p": ["Phosphate ions are released from **rocks** by **weathering**, and absorbed by plants (helped by mycorrhizae).", "Phosphorus passes along food chains. Saprobionts release phosphate from dead organisms and waste.", "Phosphate can be carried into water and form **sediments**, which become rock over very long timescales. There is **no gas phase**, so the cycle is slow.", "Phosphate is used to make DNA, RNA, ATP and phospholipids."]}, {"h": "Fertilisers", "p": ["Harvesting crops removes nutrients from the soil, so fertilisers replace them, increasing productivity.", "**Natural** fertilisers: manure, compost. **Artificial** fertilisers: inorganic chemicals with exact amounts of nitrate, phosphate and potassium."]}, {"h": "Environmental effects of fertilisers", "p": ["**Reduced species diversity**: fast-growing species such as grasses and nettles outcompete others.", "**Leaching**: water-soluble ions are washed out of soil into rivers and lakes.", "**Eutrophication**: nitrate in water causes rapid **algal growth** (algal bloom). Algae block light, so plants below die. **Saprobionts** decompose dead material, using lots of **oxygen** in aerobic respiration. O₂ levels fall, so fish and other aerobic organisms die."]}], "pitfalls": ["Nitrification is **aerobic**. Denitrification is **anaerobic**. Ploughing and draining soil favour nitrification.", "Don't say algae use up the oxygen. It's mainly **saprobiont respiration** decomposing dead organisms.", "Nitrogen fixation turns N₂ into **ammonia/ammonium**, not nitrate.", "Mycorrhizae increase **surface area**, not 'make nutrients'."], "questions": [{"q": "How do saprobionts obtain nutrients?", "o": ["By photosynthesis", "By extracellular digestion: secreting enzymes onto dead material and absorbing the products", "By engulfing whole organisms", "By fixing nitrogen gas"], "a": 1, "e": "Saprobionts secrete hydrolytic enzymes onto dead material and absorb the soluble products, releasing mineral ions."}, {"q": "What are mycorrhizae?", "o": ["Associations between fungi and plant roots that increase absorption of water and ions", "Nitrogen-fixing bacteria in root nodules", "Algae in lakes", "Denitrifying bacteria"], "a": 0, "e": "Fungal hyphae extend the root surface area, improving uptake of water and ions such as phosphate. The fungus receives sugars."}, {"q": "What is ammonification?", "o": ["Conversion of N₂ to ammonia", "Conversion of nitrate to N₂", "Conversion of nitrogen-containing organic compounds into ammonia by saprobionts", "Conversion of nitrite to nitrate"], "a": 2, "e": "Saprobionts decompose proteins, urea and nucleic acids in dead matter and waste, releasing ammonia or ammonium."}, {"q": "What do nitrifying bacteria do?", "o": ["Convert N₂ to ammonia", "Convert nitrates to N₂", "Decompose dead organisms", "Oxidise ammonium to nitrites and then nitrates"], "a": 3, "e": "Nitrification is the oxidation of ammonium to nitrite, then nitrate. It needs oxygen."}, {"q": "Why does waterlogged soil reduce the amount of nitrate available to plants?", "o": ["Anaerobic conditions favour denitrifying bacteria, which convert nitrate to N₂ gas", "Water dilutes the nitrate", "Nitrogen-fixing bacteria are more active", "Plants absorb too much nitrate"], "a": 0, "e": "Waterlogged soil lacks oxygen. Denitrifying bacteria thrive and remove nitrate, while aerobic nitrifying bacteria are inhibited."}, {"q": "What do nitrogen-fixing bacteria produce from N₂?", "o": ["Nitrate", "Ammonia (ammonium ions)", "Nitrite", "Proteins only"], "a": 1, "e": "Nitrogen fixation reduces N₂ gas to ammonia, which can be used to make amino acids."}, {"q": "Where are nitrogen-fixing bacteria found in legumes?", "o": ["In leaf stomata", "In the xylem", "In root nodules", "In seeds only"], "a": 2, "e": "Rhizobium bacteria live in root nodules of legumes such as peas and clover, in a mutualistic relationship."}, {"q": "Why does ploughing soil increase nitrate levels?", "o": ["It adds nitrogen gas", "It kills nitrifying bacteria", "It increases denitrification", "It aerates soil, favouring aerobic nitrifying bacteria"], "a": 3, "e": "Ploughing adds oxygen, which helps nitrifying bacteria and inhibits anaerobic denitrifiers."}, {"q": "Why is the phosphorus cycle slower than the nitrogen cycle?", "o": ["It has no gas phase, and phosphate is locked in rock for long periods", "Phosphate is rare", "Plants don't need phosphate", "Bacteria fix phosphate quickly"], "a": 0, "e": "Phosphorus has no significant atmospheric form. It is released slowly by weathering of rocks."}, {"q": "How does phosphate enter the soil from rocks?", "o": ["Nitrogen fixation", "Weathering", "Denitrification", "Photosynthesis"], "a": 1, "e": "Weathering of rocks releases phosphate ions into soil and water."}, {"q": "Which molecules require phosphate to be made?", "o": ["Glucose and starch", "Cellulose and glycogen", "DNA, RNA, ATP and phospholipids", "Proteins only"], "a": 2, "e": "Phosphate is a component of nucleotides (DNA, RNA, ATP) and phospholipids."}, {"q": "Why are fertilisers used in agriculture?", "o": ["To kill weeds", "To kill pests", "To increase soil pH", "To replace nutrients removed when crops are harvested"], "a": 3, "e": "Harvesting removes nutrients that would normally return to the soil, so fertilisers replace them and increase yield."}, {"q": "What is leaching?", "o": ["Water-soluble nutrients being washed out of soil into rivers and lakes", "Fixation of nitrogen", "Decomposition by saprobionts", "Absorption by roots"], "a": 0, "e": "Rain carries soluble ions such as nitrate out of soil and into water bodies."}, {"q": "During eutrophication, why does oxygen in the water fall?", "o": ["Algae use all the oxygen in photosynthesis", "Saprobionts decompose dead plants and algae, using oxygen in aerobic respiration", "Fish use more oxygen", "Nitrate reacts with oxygen"], "a": 1, "e": "Dead organisms provide food for saprobionts. Their population grows and their respiration uses up dissolved oxygen."}, {"q": "What is the correct sequence in eutrophication?", "o": ["Fish die, then algae grow, then nitrate is leached", "Oxygen rises, then plants grow", "Nitrate leached, algal bloom, plants die from lack of light, saprobionts respire, oxygen falls, fish die", "Saprobionts die first"], "a": 2, "e": "Excess nitrate leads to algal bloom. Plants below die. Decomposition by saprobionts uses oxygen. Aerobic organisms die."}, {"q": "Why might fertilisers reduce species diversity in a field?", "o": ["They poison all plants", "They increase leaching", "They prevent pollination", "Fast-growing species such as grasses outcompete other species"], "a": 3, "e": "Fertilisers favour fast-growing species, which outcompete slower-growing ones."}, {"q": "Why are natural fertilisers less likely to cause leaching than artificial ones?", "o": ["They release nutrients more slowly, as organic matter is decomposed", "They contain more nitrate", "They are more soluble", "They contain no nitrogen"], "a": 0, "e": "Manure and compost must be decomposed by saprobionts first, so ions are released gradually."}, {"q": "Denitrifying bacteria convert nitrate into:", "o": ["Ammonium", "Nitrogen gas", "Nitrite only", "Proteins"], "a": 1, "e": "Denitrification returns nitrogen to the atmosphere as N₂ gas."}, {"q": "What do plants use absorbed nitrate for?", "o": ["Making glucose", "Making cellulose", "Making amino acids, proteins and nucleic acids", "Making starch"], "a": 2, "e": "Nitrogen is needed for amino acids, proteins, DNA, RNA and ATP."}, {"q": "What is the relationship between legumes and nitrogen-fixing bacteria?", "o": ["Parasitism", "Competition", "Predation", "Mutualism: bacteria get sugars, plant gets ammonium"], "a": 3, "e": "Both benefit: the plant gets a nitrogen source, and the bacteria get carbohydrates and protection."}, {"q": "Which process requires oxygen?", "o": ["Nitrification", "Denitrification", "Weathering of rocks", "Leaching"], "a": 0, "e": "Nitrifying bacteria are aerobic. They need oxygen to oxidise ammonium to nitrate."}, {"q": "What is the main advantage of artificial fertilisers over manure?", "o": ["They improve soil structure", "The exact amount of each nutrient is known", "They don't cause leaching", "They contain organic matter"], "a": 1, "e": "Artificial fertilisers contain known amounts of nitrate, phosphate and potassium. Manure improves soil structure but nutrient content varies."}]}, {"id": "3.6a", "order": 20, "section": "3.6", "spec": "3.6.1", "title": "Stimuli, receptors and heart rate", "desc": "Tropisms and IAA, taxes and kinesis, reflex arcs, the Pacinian corpuscle, rods and cones, and control of heart rate.", "practicals": [10], "summary": [{"h": "Survival and response", "p": ["Organisms increase their chance of survival by responding to changes in their environment.", "In flowering plants, specific growth factors move from growing regions to other tissues, where they regulate growth in response to directional stimuli (**tropisms**).", "**IAA** (indoleacetic acid, an auxin) controls cell elongation. **Phototropism** in shoots: IAA moves to the **shaded side**, and those cells **elongate more**, so the shoot bends **towards** light.", "**Gravitropism** in roots: IAA accumulates on the **lower side**, where it **inhibits** elongation, so the root bends **downward**.", "**Taxis**: a **directional** movement towards or away from a stimulus (e.g. woodlice move away from light).", "**Kinesis**: a **non-directional** response. Speed of movement or rate of turning changes with stimulus intensity (e.g. woodlice move faster and turn less in dry conditions)."]}, {"h": "Reflexes", "p": ["A simple reflex is a rapid, automatic response that protects from harm.", "**Reflex arc**: stimulus → receptor → sensory neurone → relay neurone (in the spinal cord) → motor neurone → effector → response.", "It involves only **three neurones** and doesn't involve conscious thought (the brain), so it is **fast**."]}, {"h": "Receptors", "p": ["Receptors are **specific** to one type of stimulus.", "**Pacinian corpuscle** (pressure receptor in skin): pressure deforms the layers of connective tissue (**lamellae**), which **stretches** the sensory neurone membrane. **Stretch-mediated sodium channels** open, Na⁺ enters, producing a **generator potential**. If this reaches the threshold, an action potential is sent.", "**Rods**: one type of pigment (rhodopsin), very **sensitive** to light because **several rods connect to one bipolar neurone** (**summation**), so they work in dim light. But **low visual acuity**: the brain can't tell which rod was stimulated.", "**Cones**: three types, sensitive to red, green or blue light, so give **colour vision**. **Each cone connects to its own bipolar neurone**, giving **high visual acuity**, but they need bright light."]}, {"h": "Control of heart rate", "p": ["Heart muscle is **myogenic**: it contracts without nervous stimulation.", "The **sinoatrial node (SAN)** in the right atrium is the pacemaker. It sends waves of electrical activity across the atria, so they contract.", "A layer of non-conducting tissue stops the wave reaching the ventricles directly. The **atrioventricular node (AVN)** delays the impulse briefly, so the atria finish emptying.", "The impulse passes down the **bundle of His** and then **Purkyne tissue** through the ventricle walls, so the ventricles contract **from the apex (bottom) upwards**.", "**Chemoreceptors** (detect CO₂/pH) and **baroreceptors** (detect blood pressure) in the aorta and carotid arteries send impulses to the **medulla oblongata**.", "The medulla sends impulses along **sympathetic** neurones to increase heart rate, or **parasympathetic** neurones to decrease it."]}], "pitfalls": ["In shoots, IAA **promotes** elongation. In roots, IAA **inhibits** elongation.", "Explain rod sensitivity with **summation**: several rods share one bipolar neurone, so their generator potentials add up to reach threshold.", "The AVN **delays** the impulse. The **Purkyne tissue** carries it to the ventricle apex.", "Taxis is directional. Kinesis is non-directional. Don't swap them."], "questions": [{"q": "In a shoot lit from one side, where does IAA accumulate?", "o": ["On the illuminated side", "On the shaded side", "Evenly on both sides", "Only in the root"], "a": 1, "e": "IAA moves to the shaded side of the shoot, where it causes more cell elongation, bending the shoot towards the light."}, {"q": "What is the effect of IAA on cells in a shoot?", "o": ["It stimulates cell elongation", "It inhibits cell elongation", "It causes cell death", "It stops photosynthesis"], "a": 0, "e": "In shoots, IAA promotes cell elongation. More IAA on the shaded side means those cells grow longer."}, {"q": "Why do roots grow downwards?", "o": ["IAA promotes elongation on the lower side", "Light inhibits root growth", "IAA accumulates on the lower side and inhibits elongation there, so the upper side grows more", "Roots have no IAA"], "a": 2, "e": "In roots, IAA inhibits elongation. With more on the lower side, the upper side grows faster, so the root bends down."}, {"q": "What is a taxis?", "o": ["A non-directional change in speed", "A growth response in plants", "A reflex action", "A directional movement towards or away from a stimulus"], "a": 3, "e": "A taxis is a directional response, e.g. a woodlouse moving away from light."}, {"q": "Woodlice move faster and turn less often in dry air. What type of response is this?", "o": ["Kinesis", "Taxis", "Tropism", "Reflex"], "a": 0, "e": "This is a kinesis: a non-directional change in speed or rate of turning, which keeps woodlice in damp areas."}, {"q": "Why is a reflex arc fast?", "o": ["It involves the brain", "It involves only a few neurones and no conscious thought", "It uses hormones", "It has many synapses"], "a": 1, "e": "Only three neurones and few synapses are involved, and the response doesn't wait for conscious processing."}, {"q": "What is the correct order of a reflex arc?", "o": ["Receptor, motor neurone, relay neurone, sensory neurone, effector", "Effector, sensory neurone, receptor", "Receptor, sensory neurone, relay neurone, motor neurone, effector", "Relay neurone, receptor, effector"], "a": 2, "e": "Stimulus is detected by a receptor, then sensory, relay and motor neurones carry the impulse to an effector."}, {"q": "How does a Pacinian corpuscle produce a generator potential?", "o": ["Light bleaches a pigment", "Hormones bind receptors", "Chemicals open ligand-gated channels", "Pressure deforms the lamellae, stretching the membrane and opening stretch-mediated Na⁺ channels"], "a": 3, "e": "Deformation opens stretch-mediated sodium channels. Na⁺ diffuses in, depolarising the membrane."}, {"q": "Why are rods more sensitive to dim light than cones?", "o": ["Several rods connect to one bipolar neurone, so their generator potentials combine (summation)", "Rods contain three pigments", "Rods are in the fovea", "Each rod has its own neurone"], "a": 0, "e": "Small generator potentials from several rods add up in one bipolar neurone to reach threshold, even in dim light."}, {"q": "Why do cones give higher visual acuity than rods?", "o": ["Cones are more sensitive", "Each cone connects to its own bipolar neurone, so the brain can tell which cones were stimulated", "Cones work in dim light", "Cones have one pigment"], "a": 1, "e": "Separate connections mean separate signals from neighbouring cones, so fine detail can be distinguished."}, {"q": "Why can we see colour?", "o": ["Rods detect different wavelengths", "There is one type of cone", "There are three types of cone, each sensitive to different wavelengths", "Bipolar neurones detect colour"], "a": 2, "e": "Red-, green- and blue-sensitive cones are stimulated to different extents, which the brain interprets as colour."}, {"q": "What does 'myogenic' mean for cardiac muscle?", "o": ["It needs nervous stimulation to contract", "It is controlled by hormones only", "It doesn't contract", "It contracts without nervous stimulation"], "a": 3, "e": "Cardiac muscle starts its own contractions. Nerves only change the rate."}, {"q": "Where is the sinoatrial node?", "o": ["In the wall of the right atrium", "In the left ventricle", "In the septum", "In the aorta"], "a": 0, "e": "The SAN is in the right atrium wall. It is the heart's natural pacemaker."}, {"q": "What is the role of the atrioventricular node?", "o": ["It starts each heartbeat", "It delays the impulse briefly before passing it to the ventricles", "It detects blood pressure", "It stops the heart"], "a": 1, "e": "The delay lets the atria finish contracting and emptying before the ventricles contract."}, {"q": "Why do the ventricles contract from the apex (bottom) upwards?", "o": ["The SAN is at the apex", "Gravity", "The Purkyne tissue carries the impulse down to the apex first, then up the ventricle walls", "Blood flows downward"], "a": 2, "e": "The bundle of His and Purkyne tissue carry the impulse down the septum to the apex, so contraction squeezes blood up into the arteries."}, {"q": "Where are chemoreceptors that help control heart rate found?", "o": ["In the medulla only", "In the SAN", "In the skin", "In the aorta and carotid arteries"], "a": 3, "e": "Chemoreceptors in the aorta and carotid arteries (and the medulla) detect changes in blood CO₂ and pH."}, {"q": "During exercise, CO₂ in the blood rises. How does heart rate increase?", "o": ["Chemoreceptors send impulses to the medulla, which sends impulses along sympathetic neurones to the SAN", "The SAN detects CO₂ directly", "Baroreceptors slow the heart", "Parasympathetic impulses increase"], "a": 0, "e": "Lower pH is detected by chemoreceptors. The medulla increases sympathetic impulses to the SAN, raising heart rate."}, {"q": "Blood pressure rises above normal. What happens?", "o": ["Sympathetic impulses to the SAN increase", "Baroreceptors detect it; the medulla sends more impulses along parasympathetic neurones to the SAN, slowing heart rate", "Chemoreceptors increase heart rate", "The AVN stops working"], "a": 1, "e": "Baroreceptors detect high pressure. Parasympathetic impulses slow the SAN, reducing heart rate and pressure."}, {"q": "Which part of the brain controls heart rate?", "o": ["Cerebrum", "Cerebellum", "Medulla oblongata", "Hypothalamus"], "a": 2, "e": "The cardiovascular centre in the medulla oblongata controls heart rate through the autonomic nervous system."}, {"q": "In a choice chamber (RP10), what is used to make one side dry?", "o": ["Water", "Cobalt chloride paper", "Distilled water", "Silica gel or anhydrous calcium chloride"], "a": 3, "e": "A drying agent such as silica gel absorbs moisture. Water under the other side keeps it humid."}, {"q": "Which statistical test is used to check whether woodlice distribution differs significantly from 50:50?", "o": ["Chi-squared test", "Spearman's rank", "Standard deviation", "Student's t-test"], "a": 0, "e": "Chi-squared compares observed and expected frequencies in categories, such as numbers on each side."}, {"q": "What happens if a generator potential does not reach the threshold?", "o": ["An action potential is produced", "No action potential is produced", "The receptor is damaged", "The action potential is smaller"], "a": 1, "e": "Action potentials are all-or-nothing. Below threshold, no action potential is sent."}]}, {"id": "3.6b", "order": 21, "section": "3.6", "spec": "3.6.2", "title": "Nerve impulses and synaptic transmission", "desc": "Resting and action potentials, the refractory period, saltatory conduction, cholinergic synapses, summation, inhibitory synapses and drugs.", "practicals": [], "summary": [{"h": "Resting potential", "p": ["At rest, the inside of the axon is **negative** relative to the outside: about **−70 mV**.", "The **sodium-potassium pump** actively transports **3 Na⁺ out** for every **2 K⁺ in**, using ATP.", "The membrane is **more permeable to K⁺** than Na⁺ (more K⁺ channels open), so K⁺ diffuses back out. This keeps the inside negative."]}, {"h": "Action potential", "p": ["**Depolarisation**: a stimulus opens some voltage-gated **Na⁺ channels**. Na⁺ diffuses in. If the **threshold** (about −55 mV) is reached, many more Na⁺ channels open, and the potential rises to about **+40 mV**.", "**Repolarisation**: Na⁺ channels close and voltage-gated **K⁺ channels open**. K⁺ diffuses out, so the potential falls.", "**Hyperpolarisation**: K⁺ channels are slow to close, so the potential briefly falls below −70 mV. The pump then restores resting potential.", "**All-or-nothing**: if threshold is reached, an action potential of the same size is always produced. A **stronger stimulus** gives a **higher frequency** of action potentials, not bigger ones."]}, {"h": "Refractory period", "p": ["After an action potential, Na⁺ channels can't reopen for a short time.", "This means action potentials are **discrete** (separate), travel in **one direction** only, and there is a **limit to their frequency**."]}, {"h": "Speed of conduction", "p": ["**Myelination**: in myelinated axons, depolarisation only happens at the **nodes of Ranvier**, so the impulse jumps between nodes (**saltatory conduction**). This is much faster.", "**Axon diameter**: wider axons conduct faster (less resistance, less leakage of ions).", "**Temperature**: higher temperature speeds up ion diffusion and the pump, up to the point where proteins denature."]}, {"h": "Cholinergic synapses", "p": ["An action potential arrives at the presynaptic knob. **Voltage-gated Ca²⁺ channels** open, and Ca²⁺ diffuses in.", "Ca²⁺ causes **vesicles** of **acetylcholine (ACh)** to move to and fuse with the presynaptic membrane, releasing ACh into the synaptic cleft by **exocytosis**.", "ACh diffuses across the cleft and binds to **receptors** on the postsynaptic membrane. **Na⁺ channels open**, Na⁺ enters, and if threshold is reached, an action potential starts.", "**Acetylcholinesterase** hydrolyses ACh into choline and ethanoic acid, which diffuse back and are recycled. This stops continuous stimulation.", "Synapses are **unidirectional**: only the presynaptic side has vesicles, and only the postsynaptic side has receptors."]}, {"h": "Summation and inhibition", "p": ["**Spatial summation**: several presynaptic neurones release neurotransmitter onto one postsynaptic neurone, together reaching threshold.", "**Temporal summation**: one presynaptic neurone releases neurotransmitter **repeatedly** in quick succession, building up to threshold.", "**Inhibitory synapses**: neurotransmitter opens **Cl⁻ channels** (Cl⁻ in) and K⁺ channels (K⁺ out), causing **hyperpolarisation**, so threshold is harder to reach.", "**Neuromuscular junctions** are like cholinergic synapses, but are always excitatory, and the postsynaptic cell is a muscle fibre.", "**Drugs** can stimulate (e.g. mimic a neurotransmitter, or block acetylcholinesterase) or inhibit (e.g. block receptors) synaptic transmission."]}], "pitfalls": ["Na⁺ enters during **depolarisation**. K⁺ leaves during **repolarisation**. Learn which channel is which.", "A bigger stimulus increases **frequency** of action potentials, not their size.", "Myelin itself doesn't 'speed up' the impulse. It means depolarisation happens only at **nodes**, so the impulse jumps.", "Ca²⁺ is what triggers vesicle release. It's a common 6-mark sequence question."], "questions": [{"q": "What is the typical resting potential of a neurone?", "o": ["+40 mV", "−70 mV", "0 mV", "−55 mV"], "a": 1, "e": "At rest, the inside of the axon is about 70 mV more negative than the outside."}, {"q": "How does the sodium-potassium pump help maintain resting potential?", "o": ["It actively transports 3 Na⁺ out for every 2 K⁺ in", "It moves 2 Na⁺ in and 3 K⁺ out", "It allows Na⁺ to diffuse in freely", "It pumps Cl⁻ out"], "a": 0, "e": "More positive ions leave than enter, and the membrane is more permeable to K⁺, which diffuses out, so the inside stays negative."}, {"q": "What happens during depolarisation?", "o": ["K⁺ channels open and K⁺ diffuses out", "The Na⁺/K⁺ pump stops", "Voltage-gated Na⁺ channels open and Na⁺ diffuses into the axon", "Cl⁻ ions enter"], "a": 2, "e": "Once threshold is reached, many voltage-gated Na⁺ channels open. The inside becomes positive, around +40 mV."}, {"q": "What causes repolarisation?", "o": ["Na⁺ channels opening", "Ca²⁺ entering", "ACh binding", "Na⁺ channels closing and voltage-gated K⁺ channels opening, so K⁺ diffuses out"], "a": 3, "e": "K⁺ leaves the axon, making the inside negative again."}, {"q": "Why does hyperpolarisation occur?", "o": ["K⁺ channels are slow to close, so too many K⁺ ions diffuse out", "Na⁺ channels stay open", "The pump stops", "Cl⁻ ions leave"], "a": 0, "e": "The delay in K⁺ channels closing lets extra K⁺ leave, so the potential briefly drops below −70 mV."}, {"q": "What does 'all-or-nothing' mean for action potentials?", "o": ["Larger stimuli produce larger action potentials", "If threshold is reached, an action potential of the same size is always produced", "Action potentials only travel in one direction", "Every stimulus produces an action potential"], "a": 1, "e": "Above threshold, the action potential is always the same size. Below it, none occurs."}, {"q": "How does the nervous system indicate a stronger stimulus?", "o": ["Larger action potentials", "Faster action potentials", "A higher frequency of action potentials", "A longer refractory period"], "a": 2, "e": "Because action potentials are all-or-nothing, intensity is coded by how often they occur."}, {"
