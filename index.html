use the **cell wall** resists expansion."], "questions": [{"q": "In the fluid-mosaic model, why is the membrane described as fluid?", "o": ["Phospholipids can move within the bilayer", "The membrane is made of water", "Proteins are dissolved in the cytoplasm", "Cholesterol makes it liquid"], "a": 0, "e": "Individual phospholipid molecules move around within their layer, so the membrane is flexible and fluid."}, {"q": "What is the role of cholesterol in cell membranes?", "o": ["It acts as a receptor", "It transports glucose", "It restricts phospholipid movement, making the membrane more rigid", "It makes the membrane more permeable to ions"], "a": 2, "e": "Cholesterol binds to phospholipid tails, reducing their movement. The membrane is less fluid and less leaky."}, {"q": "Why can't ions diffuse directly through the phospholipid bilayer?", "o": ["They are too large", "The centre of the bilayer is hydrophobic", "They are uncharged", "The bilayer is made of protein"], "a": 1, "e": "Ions are charged, so the hydrophobic fatty acid tails in the centre of the bilayer repel them. They need channel or carrier proteins."}, {"q": "Which statement describes facilitated diffusion?", "o": ["Movement against a concentration gradient using ATP", "Movement of water across a partially permeable membrane", "Movement through the phospholipid bilayer only", "Passive movement down a concentration gradient through channel or carrier proteins"], "a": 3, "e": "Facilitated diffusion is passive and moves substances down their concentration gradient through specific proteins."}, {"q": "Why does the rate of facilitated diffusion level off at high concentration gradients?", "o": ["All the channel or carrier proteins are in use", "ATP runs out", "The membrane becomes thicker", "The concentration gradient reverses"], "a": 0, "e": "There are a limited number of proteins. Once all are working at their maximum rate, a steeper gradient makes no difference."}, {"q": "Which change would increase the rate of simple diffusion?", "o": ["A thicker exchange surface", "A larger surface area", "A smaller concentration gradient", "Fewer carrier proteins"], "a": 1, "e": "A larger surface area, a steeper gradient and a thinner surface all increase the rate of diffusion."}, {"q": "What is the water potential of pure water at standard conditions?", "o": ["100 kPa", "−100 kPa", "1 kPa", "0 kPa"], "a": 3, "e": "Pure water has a water potential of 0 kPa, the highest value. Any solute makes it negative."}, {"q": "Cell A has ψ = −300 kPa and cell B has ψ = −500 kPa. In which direction does water move by osmosis?", "o": ["From A to B", "From B to A", "No net movement", "It depends on temperature only"], "a": 0, "e": "Water moves from higher (less negative) to lower (more negative) water potential: from −300 kPa to −500 kPa, so A to B."}, {"q": "A red blood cell is placed in pure water. What happens?", "o": ["It shrinks because water leaves", "It becomes plasmolysed", "Water enters by osmosis and it may burst", "Nothing, because it has a cell wall"], "a": 2, "e": "Pure water has a higher water potential than the cell. Water enters by osmosis and, with no cell wall, the cell may burst."}, {"q": "A plant cell is placed in a concentrated sugar solution. What happens?", "o": ["It bursts", "Water leaves by osmosis and the cell becomes plasmolysed", "It becomes turgid", "Sugar enters by osmosis"], "a": 1, "e": "The solution has lower ψ, so water leaves. The cytoplasm shrinks and the membrane pulls away from the cell wall."}, {"q": "Why don't plant cells burst in pure water?", "o": ["The cell wall resists expansion", "Their membranes are impermeable to water", "They have no vacuole", "Cholesterol stops water entering"], "a": 0, "e": "As water enters, the cell swells against the cellulose cell wall, which resists further expansion. The cell becomes turgid."}, {"q": "Which feature is unique to active transport?", "o": ["It uses channel proteins", "It moves substances down a gradient", "It is passive", "It uses ATP to move substances against a concentration gradient"], "a": 3, "e": "Active transport needs ATP and carrier proteins to move substances against their concentration gradient."}, {"q": "How does ATP cause a carrier protein to move a molecule in active transport?", "o": ["ATP binds to the molecule being moved", "Hydrolysis of ATP releases a phosphate that binds to the carrier, changing its shape", "ATP dissolves the membrane", "ATP opens a channel protein"], "a": 1, "e": "Phosphate from ATP binds to the carrier protein. The protein changes shape and releases the molecule on the other side."}, {"q": "A respiratory inhibitor is added to cells. Which process stops?", "o": ["Simple diffusion", "Osmosis", "Active transport", "Facilitated diffusion"], "a": 2, "e": "Respiratory inhibitors stop ATP production, so active transport stops. Passive processes continue."}, {"q": "In the ileum, what keeps the sodium ion concentration inside epithelial cells low?", "o": ["Active transport of Na⁺ out of the cell into the blood", "Facilitated diffusion of Na⁺ into the lumen", "Osmosis", "Co-transport of glucose into the blood"], "a": 0, "e": "A sodium-potassium pump uses ATP to actively transport Na⁺ out of the cell into the blood, keeping internal Na⁺ low."}, {"q": "How does glucose enter ileum epithelial cells?", "o": ["By simple diffusion through the bilayer", "By osmosis", "By co-transport with Na⁺, which diffuses in down its concentration gradient", "By active transport using ATP directly"], "a": 2, "e": "Na⁺ diffuses into the cell down its gradient through a co-transporter, carrying glucose with it against glucose's gradient."}, {"q": "How does glucose leave ileum epithelial cells and enter the blood?", "o": ["Co-transport", "Facilitated diffusion", "Active transport", "Osmosis"], "a": 1, "e": "Glucose concentration is high inside the cell, so it moves into the blood by facilitated diffusion through carrier proteins."}, {"q": "Why is co-transport of glucose described as indirect active transport?", "o": ["It uses no energy at all", "ATP is used directly to move glucose", "Glucose diffuses down its gradient", "ATP is used to create the Na⁺ gradient, which then drives glucose uptake"], "a": 3, "e": "Energy from ATP maintains the sodium gradient. The movement of Na⁺ down this gradient powers glucose uptake."}, {"q": "In RP3, potato cylinders show no change in mass in 0.3 mol dm⁻³ sucrose. What does this show?", "o": ["The tissue has the same water potential as 0.3 mol dm⁻³ sucrose", "The tissue has a water potential of 0 kPa", "The tissue is dead", "Sucrose entered the tissue"], "a": 0, "e": "No net osmosis means equal water potentials, so the tissue's ψ equals that of the 0.3 mol dm⁻³ solution."}, {"q": "Why is percentage change in mass calculated in RP3?", "o": ["To remove the effect of temperature", "Because cylinders may start with different masses", "To make the numbers positive", "Because mass can't be measured accurately"], "a": 1, "e": "Percentage change lets you compare cylinders fairly even if their starting masses differ."}, {"q": "In RP4, why does more pigment leak from beetroot at 70 °C than at 30 °C?", "o": ["The pigment is made faster", "Cholesterol increases", "Membrane proteins denature and phospholipids move more, increasing permeability", "Osmosis draws pigment out"], "a": 2, "e": "High temperature increases phospholipid movement and denatures membrane proteins, leaving gaps. Pigment leaks out, so absorbance rises."}, {"q": "What are glycoproteins in the cell-surface membrane used for?", "o": ["Storing energy", "Making the membrane rigid", "Active transport only", "Cell recognition and as receptors, e.g. for hormones"], "a": 3, "e": "Glycoproteins have carbohydrate chains that act as antigens for cell recognition and as receptors for chemical signals."}]}, {"id": "3.2d", "order": 7, "section": "3.2", "spec": "3.2.4", "title": "Cell recognition and the immune system", "desc": "Antigens, phagocytosis, T and B lymphocytes, antibodies, vaccines and herd immunity, HIV, monoclonal antibodies and the ELISA test.", "practicals": [], "summary": [{"h": "Antigens", "p": ["**Antigens** are molecules (usually proteins) on cell surfaces that **generate an immune response**.", "They let the immune system identify **pathogens**, cells from other organisms of the same species, **abnormal body cells** (e.g. cancer cells) and **toxins**.", "**Antigen variability**: when a pathogen's antigens change shape (e.g. influenza), existing memory cells and antibodies no longer recognise it."]}, {"h": "Phagocytosis", "p": ["A **phagocyte** recognises the foreign antigen and **engulfs** the pathogen, enclosing it in a **phagosome**.", "**Lysosomes** fuse with the phagosome and release **lysozymes**, which hydrolyse the pathogen.", "The phagocyte presents the pathogen's antigens on its surface, becoming an **antigen-presenting cell**."]}, {"h": "Cellular response: T lymphocytes", "p": ["**Helper T cells** have receptors complementary to a specific antigen on an antigen-presenting cell. They bind and are activated.", "Activated helper T cells divide by **mitosis** (clonal expansion) and **stimulate**: phagocytes to engulf, **cytotoxic T cells** to kill infected cells, and **B cells** to divide.", "**Cytotoxic T cells** kill infected body cells by producing **perforin**, which makes holes in the cell-surface membrane."]}, {"h": "Humoral response: B lymphocytes and antibodies", "p": ["A B cell with a complementary antibody on its surface binds the antigen, takes it in, and presents it. Helper T cells bind and activate it.", "The B cell divides by mitosis (**clonal selection**) into **plasma cells**, which secrete antibodies, and **memory cells**.", "An **antibody** is a protein with **four polypeptide chains** (two heavy, two light). The **variable region** forms the specific antigen-binding site. The rest is the **constant region**.", "Antibodies bind antigens to form an **antigen–antibody complex**. They cause **agglutination** (clumping), which makes phagocytosis easier.", "**Primary response**: slow, few antibodies, symptoms appear. **Secondary response**: memory cells divide rapidly into plasma cells, so antibodies are produced **faster and in greater amounts**, usually before symptoms."]}, {"h": "Immunity and vaccines", "p": ["**Active immunity**: the body makes its own antibodies and memory cells, after natural infection or a **vaccine**. Long-term, but takes time to develop.", "**Passive immunity**: antibodies are given (e.g. across the placenta, in breast milk, or by injection). Immediate but **short-term**, with **no memory cells**.", "A **vaccine** contains antigens (e.g. dead or weakened pathogens), which stimulate a primary response and memory cells.", "**Herd immunity**: when a large proportion of a population is vaccinated, the pathogen can't spread easily, protecting unvaccinated people.", "Ethical issues: testing on animals, side effects, consent in trials, compulsory vaccination."]}, {"h": "HIV", "p": ["HIV has an RNA genome, **reverse transcriptase**, a capsid, an envelope and attachment proteins.", "It infects **helper T cells**. Reverse transcriptase makes DNA from viral RNA, which is inserted into host DNA.", "Helper T cell numbers fall, so the immune system can't respond effectively. Opportunistic infections then cause **AIDS**.", "**Antibiotics don't work on viruses**: viruses have no cell wall or their own metabolic machinery for antibiotics to target."]}, {"h": "Monoclonal antibodies and ELISA", "p": ["**Monoclonal antibodies** are identical antibodies from one clone of plasma cells, all binding one specific antigen.", "Uses: **targeted drugs** (antibody carries a drug to cancer cells), **medical diagnosis**, and **pregnancy tests** (detect hCG).", "**ELISA** (indirect): antigen is bound to a well. Add the patient's sample. Wash. Add a second antibody that is enzyme-linked and binds the first. Wash. Add substrate. **A colour change means the antibody was present.**", "**Washing** removes unbound antibodies, which would otherwise give a false positive."]}], "pitfalls": ["Phagocytes are **non-specific**. Lymphocytes are **specific**.", "Plasma cells make antibodies. Memory cells **don't** secrete antibodies; they divide quickly into plasma cells on re-infection.", "Antibodies don't 'kill' pathogens directly. They cause agglutination and mark them for phagocytes.", "HIV doesn't kill people directly. Opportunistic infections do, after helper T cells are destroyed."], "questions": [{"q": "What is an antigen?", "o": ["A protein made by plasma cells", "A molecule, often a protein, that generates an immune response", "A type of white blood cell", "An enzyme in lysosomes"], "a": 1, "e": "Antigens are molecules on cell surfaces that trigger an immune response. They allow non-self cells to be identified."}, {"q": "During phagocytosis, how is the pathogen destroyed?", "o": ["Lysosomes fuse with the phagosome and release lysozymes, which hydrolyse it", "Antibodies dissolve it", "Perforin makes holes in it", "Helper T cells digest it"], "a": 0, "e": "The engulfed pathogen sits in a phagosome. Lysosomes fuse with it and hydrolytic enzymes digest the pathogen."}, {"q": "What is an antigen-presenting cell?", "o": ["A cell that makes antigens", "A plasma cell", "A cell that displays foreign antigens on its surface, e.g. a phagocyte after engulfing a pathogen", "A cell with no antigens"], "a": 2, "e": "After phagocytosis, the phagocyte displays the pathogen's antigens on its surface for helper T cells to recognise."}, {"q": "What is the role of helper T cells?", "o": ["They secrete antibodies", "They engulf pathogens", "They produce perforin", "They stimulate phagocytes, cytotoxic T cells and B cells"], "a": 3, "e": "Activated helper T cells release chemical signals that stimulate phagocytes, cytotoxic T cells and B cells."}, {"q": "How do cytotoxic T cells kill infected cells?", "o": ["They secrete perforin, which makes holes in the cell-surface membrane", "They engulf them", "They release antibodies", "They release lysozymes into the blood"], "a": 0, "e": "Perforin creates pores in the infected cell's membrane, making it freely permeable, so the cell dies."}, {"q": "What are plasma cells?", "o": ["Cells that engulf pathogens", "Cells derived from B cells that secrete antibodies", "T cells that kill infected cells", "Red blood cells"], "a": 1, "e": "Activated B cells divide into plasma cells, which secrete large amounts of one specific antibody, and memory cells."}, {"q": "Why is the secondary immune response faster than the primary response?", "o": ["Phagocytes are more active", "The pathogen is weaker", "Antibodies from the first infection are still present in large numbers", "Memory cells divide rapidly into plasma cells that produce antibodies"], "a": 3, "e": "Memory cells recognise the antigen and quickly divide into plasma cells, so more antibodies are produced faster, usually before symptoms."}, {"q": "Which part of an antibody binds to the antigen?", "o": ["The constant region", "The variable region", "The disulfide bridges", "The heavy chain only"], "a": 1, "e": "The variable region at the tip of each arm has a specific shape complementary to one antigen."}, {"q": "How many polypeptide chains make up an antibody molecule?", "o": ["Four: two heavy and two light", "Two", "One", "Six"], "a": 0, "e": "An antibody has four polypeptide chains held by disulfide bridges, giving it quaternary structure."}, {"q": "How does agglutination help destroy pathogens?", "o": ["It splits pathogens apart", "It neutralises toxins by hydrolysis", "Antibodies clump pathogens together, so phagocytes can engulf many at once", "It activates helper T cells"], "a": 2, "e": "Each antibody has two binding sites, so it can link pathogens together into clumps that phagocytes can engulf more easily."}, {"q": "Which is an example of passive immunity?", "o": ["Antibodies passing to a baby in breast milk", "Getting chickenpox", "Receiving a vaccine", "Producing memory cells after infection"], "a": 0, "e": "Passive immunity means antibodies are introduced from outside. No memory cells form, so it is short-term."}, {"q": "Why does active immunity last longer than passive immunity?", "o": ["More antibodies are given", "Antibodies last forever", "Phagocytes become specific", "Memory cells are produced"], "a": 3, "e": "Active immunity produces memory cells, which persist and can respond quickly to future infection."}, {"q": "What does a vaccine contain?", "o": ["Antibodies against a pathogen", "Antigens, for example from dead or weakened pathogens", "Antibiotics", "Memory cells"], "a": 1, "e": "Vaccines contain antigens, which trigger a primary response and the production of memory cells without causing disease."}, {"q": "What is herd immunity?", "o": ["When everyone in a population has had the disease", "When antibodies pass between people", "When enough of a population is vaccinated that the pathogen can't spread easily, protecting the unvaccinated", "When animals are vaccinated"], "a": 2, "e": "If most people are immune, there are few hosts for the pathogen, so transmission falls and unvaccinated people are protected too."}, {"q": "Why might a vaccine against influenza need updating every year?", "o": ["Antigenic variability: the virus's antigens change shape, so memory cells don't recognise new strains", "The vaccine expires", "Antibodies become denatured", "Flu is caused by bacteria"], "a": 0, "e": "Mutations change the shape of influenza antigens, so existing antibodies and memory cells are no longer complementary."}, {"q": "Which cells does HIV infect?", "o": ["Red blood cells", "B cells", "Helper T cells", "Phagocytes only"], "a": 2, "e": "HIV attachment proteins bind to receptors on helper T cells. As these are destroyed, the immune response fails."}, {"q": "What is the role of reverse transcriptase in HIV replication?", "o": ["It makes RNA from DNA", "It makes DNA from viral RNA", "It digests host DNA", "It forms the capsid"], "a": 1, "e": "Reverse transcriptase uses viral RNA as a template to make DNA, which is inserted into the host's DNA."}, {"q": "Why are antibiotics ineffective against viruses?", "o": ["Viruses are too small", "Viruses are always inside the nucleus", "Viruses have thick cell walls", "Viruses have no cell wall or metabolic machinery of their own for antibiotics to target"], "a": 3, "e": "Antibiotics target bacterial structures such as murein cell walls or 70S ribosomes. Viruses don't have these."}, {"q": "What is a monoclonal antibody?", "o": ["An antibody made by a single clone of plasma cells, binding one specific antigen", "An antibody with one polypeptide chain", "An antibody made by T cells", "A mixture of antibodies for many antigens"], "a": 0, "e": "Monoclonal antibodies are identical, all with the same variable region and specificity."}, {"q": "In an ELISA test, why are the wells washed between steps?", "o": ["To add more antigen", "To remove unbound antibodies, which could cause a false positive", "To denature the enzyme", "To cool the plate"], "a": 1, "e": "Unbound enzyme-linked antibody left in the well would react with the substrate and give a colour change even without the target."}, {"q": "In an indirect ELISA, what does a colour change show?", "o": ["The substrate has run out", "The test has failed", "The enzyme-linked antibody is present, so the target antibody was in the sample", "No antibody was present"], "a": 2, "e": "The second, enzyme-linked antibody only stays if it bound to the patient's antibody. Its enzyme converts the substrate to a coloured product."}, {"q": "How can monoclonal antibodies be used to treat cancer?", "o": ["They attach a drug to the antibody, so it binds only to cancer cell antigens", "They make cancer cells divide faster", "They replace helper T cells", "They act as antibiotics"], "a": 0, "e": "Antibodies complementary to cancer cell antigens carry the drug directly to those cells, reducing harm to healthy cells."}]}, {"id": "3.3a", "order": 8, "section": "3.3", "spec": "3.3.1–3.3.2", "title": "Surface area to volume and gas exchange", "desc": "Surface area to volume ratio, and gas exchange in single-celled organisms, insects, fish, leaves and humans, including ventilation and lung disease.", "practicals": [5], "summary": [{"h": "Surface area to volume ratio", "p": ["As an organism gets bigger, its **surface area to volume ratio falls**.", "Small organisms have a large SA:V, so diffusion across their surface meets their needs. Larger organisms need **specialised exchange surfaces** and **mass transport** systems.", "Larger SA:V also means faster heat loss, so small mammals have a higher metabolic rate per gram.", "Example: a 2 cm cube has SA = 6 × 2² = 24 cm² and volume = 2³ = 8 cm³, so SA:V = 3:1."]}, {"h": "Features of efficient exchange surfaces", "p": ["**Large surface area**, **thin** (short diffusion pathway), and a **steep concentration gradient** maintained by ventilation or blood flow.", "`Fick's law: rate of diffusion ∝ (surface area × difference in concentration) ÷ thickness of surface`"]}, {"h": "Insects", "p": ["Air enters through **spiracles** and passes along **tracheae** to **tracheoles**, which reach individual cells.", "Gases diffuse along gradients. During exercise, **lactic acid** in muscles lowers the water potential, so water from the tracheole ends moves into cells by osmosis, bringing air closer to the muscle.", "Abdominal pumping ventilates the tracheae.", "Water loss is limited by a **waterproof exoskeleton** and **spiracles that close**, and hairs around spiracles."]}, {"h": "Fish", "p": ["Gills have **gill filaments** covered in **lamellae**, giving a large surface area and a thin diffusion distance.", "**Counter-current flow**: blood in the lamellae flows in the **opposite direction** to water. Blood always meets water with a higher O₂ concentration, so a **diffusion gradient is maintained along the whole lamella**."]}, {"h": "Dicotyledonous leaves", "p": ["Gases diffuse through **stomata** into **air spaces** in the **spongy mesophyll**, giving a large surface area next to cells.", "Leaves are thin, so diffusion distances are short. **Guard cells** close stomata to reduce water loss.", "**Xerophytes** reduce water loss: thick waxy cuticle, rolled leaves, hairs, sunken stomata (these trap moist air and reduce the water potential gradient), and fewer stomata."]}, {"h": "Humans: lungs and ventilation", "p": ["Air passes down the **trachea**, **bronchi** and **bronchioles** to the **alveoli**. The alveolar epithelium is one cell thick, and each alveolus is surrounded by capillaries.", "**Inspiration**: external intercostal muscles **contract** and internal intercostals relax, so ribs move **up and out**. The diaphragm contracts and flattens. Thoracic volume rises and pressure falls below atmospheric, so air flows in. This is **active**.", "**Expiration** (at rest): external intercostals and diaphragm **relax**. Lung elastic recoil pushes air out, so it is mainly **passive**. Forced expiration uses the **internal intercostal muscles**.", "`Pulmonary ventilation rate = tidal volume × breathing rate`"]}, {"h": "Lung disease", "p": ["**Pulmonary fibrosis** thickens the alveolar wall (longer diffusion pathway). **Emphysema** destroys alveolar walls (reduces surface area). **Asthma** narrows airways (reduces ventilation).", "When interpreting data, separate **correlation** from **causation**: e.g. smoking correlates with lung cancer, but other variables must be controlled."]}], "pitfalls": ["In counter-current flow, the key point is that a gradient is maintained **along the whole length** of the lamella. Parallel flow only reaches equilibrium at 50%.", "Inspiration lowers pressure **inside the lungs**, so air moves in. Don't say the lungs 'suck in' air.", "Learn which intercostals do what: **external** for inspiration, **internal** for forced expiration.", "Sunken stomata work by trapping water vapour, which **reduces the water potential gradient**."], "questions": [{"q": "What happens to the surface area to volume ratio as an organism gets larger?", "o": ["It increases", "It decreases", "It stays the same", "It doubles"], "a": 1, "e": "Volume increases faster than surface area (cubed vs squared), so SA:V falls as size increases."}, {"q": "What is the surface area to volume ratio of a cube with 3 cm sides?", "o": ["2:1", "3:1", "1:1", "1:2"], "a": 0, "e": "SA = 6 × 3² = 54 cm². Volume = 3³ = 27 cm³. SA:V = 54:27 = 2:1."}, {"q": "Why do larger multicellular organisms need specialised exchange surfaces?", "o": ["They have a larger surface area to volume ratio", "Their cells don't respire", "Their SA:V is too small for diffusion across the body surface to meet their needs", "They have no blood"], "a": 2, "e": "Larger organisms have a small SA:V and long diffusion distances, so diffusion across the outer surface is too slow."}, {"q": "According to Fick's law, which change would increase the rate of diffusion?", "o": ["Increasing the thickness of the exchange surface", "Reducing the concentration difference", "Reducing the surface area", "Increasing the surface area"], "a": 3, "e": "Rate ∝ (surface area × difference in concentration) ÷ thickness. A larger area increases the rate."}, {"q": "Through which openings does air enter an insect's gas exchange system?", "o": ["Spiracles", "Stomata", "Tracheoles", "Lamellae"], "a": 0, "e": "Spiracles are pores on the body surface. Air passes from them into tracheae and tracheoles."}, {"q": "How do insects reduce water loss from their gas exchange system?", "o": ["By having thin, permeable body walls", "By closing their spiracles and having a waterproof exoskeleton", "By opening spiracles all the time", "By having gills"], "a": 1, "e": "Spiracles close when not needed, and a waterproof cuticle reduces evaporation. Hairs round spiracles also trap moist air."}, {"q": "During flight, lactic acid builds up in insect muscles. How does this help gas exchange?", "o": ["It releases oxygen", "It increases the number of spiracles", "It lowers water potential, so water moves from tracheoles into cells and air moves closer to the muscle", "It makes tracheae wider"], "a": 2, "e": "Lactic acid lowers the water potential of muscle cells. Water leaves the tracheole ends by osmosis, so air reaches closer to the muscle and diffusion is faster."}, {"q": "What is counter-current flow in fish gills?", "o": ["Water and blood flow in the same direction", "Blood flows in the opposite direction to water over the lamellae", "Water flows in and out of the mouth", "Blood flows away from the gills"], "a": 1, "e": "Water and blood move in opposite directions, so blood always meets water with a higher oxygen concentration."}, {"q": "Why is counter-current flow more efficient than parallel flow?", "o": ["It maintains a diffusion gradient along the whole length of the lamella", "Blood moves faster", "It uses less energy", "It increases the surface area"], "a": 0, "e": "With parallel flow, concentrations equalise partway along. Counter-current maintains a gradient along the whole lamella, so more oxygen is absorbed."}, {"q": "Which feature increases the surface area of fish gills?", "o": ["Spiracles", "Alveoli", "Stomata", "Gill filaments covered in lamellae"], "a": 3, "e": "Many filaments, each covered in many thin lamellae, give a very large surface area."}, {"q": "In a dicotyledonous leaf, where does most gas exchange with cells occur?", "o": ["Through the waxy cuticle", "In air spaces in the spongy mesophyll", "In the xylem", "In the upper epidermis"], "a": 1, "e": "Gases enter through stomata and diffuse through air spaces in the spongy mesophyll, giving a large surface area next to the cells."}, {"q": "How do sunken stomata reduce water loss in xerophytes?", "o": ["They increase transpiration", "They trap moist air, reducing the water potential gradient", "They absorb water from the air", "They close permanently"], "a": 1, "e": "Moist air trapped in pits around the stomata reduces the water potential gradient between leaf and air, so less water evaporates."}, {"q": "Which is NOT an adaptation of xerophytes to reduce water loss?", "o": ["Thick waxy cuticle", "Rolled leaves", "Many large stomata on the upper surface", "Hairs on the leaf"], "a": 2, "e": "More stomata on the upper surface would increase water loss. Xerophytes typically have fewer stomata, often sunken and on the lower surface."}, {"q": "What happens during inspiration in humans?", "o": ["External intercostal muscles contract, ribs move up and out, diaphragm contracts and flattens", "Internal intercostal muscles contract and ribs move down", "Diaphragm relaxes and domes upward", "Thoracic volume decreases"], "a": 0, "e": "These movements increase thoracic volume, lowering pressure below atmospheric so air moves in."}, {"q": "Why does air move into the lungs during inspiration?", "o": ["Pressure in the lungs rises above atmospheric pressure", "The lungs contract", "Thoracic volume increases, so pressure in the lungs falls below atmospheric pressure", "Oxygen is pulled in by diffusion"], "a": 2, "e": "Larger volume means lower pressure. Air moves down the pressure gradient into the lungs."}, {"q": "Which muscles contract during forced expiration?", "o": ["External intercostal muscles", "Internal intercostal muscles", "Diaphragm only", "None, it is passive"], "a": 1, "e": "Internal intercostal muscles contract to pull ribs down and in during forced expiration. Normal expiration at rest is mainly passive."}, {"q": "Tidal volume is 0.5 dm³ and breathing rate is 16 breaths per minute. What is the pulmonary ventilation rate?", "o": ["32 dm³ min⁻¹", "8 dm³ min⁻¹", "16.5 dm³ min⁻¹", "0.03 dm³ min⁻¹"], "a": 1, "e": "PVR = tidal volume × breathing rate = 0.5 × 16 = 8 dm³ min⁻¹."}, {"q": "How are alveoli adapted for gas exchange?", "o": ["Thick walls and few capillaries", "Covered in cilia", "Contain cartilage", "Large surface area, walls one cell thick, and a good blood supply"], "a": 3, "e": "Many alveoli give a large surface area. Thin epithelium gives a short diffusion distance. Capillaries and ventilation maintain gradients."}, {"q": "Pulmonary fibrosis reduces gas exchange mainly because it:", "o": ["Increases the surface area of alveoli", "Narrows the bronchioles", "Destroys red blood cells", "Thickens the alveolar walls, increasing diffusion distance"], "a": 3, "e": "Fibrosis scars and thickens alveolar walls, so oxygen must diffuse further, slowing gas exchange."}, {"q": "How does emphysema affect gas exchange?", "o": ["It thickens airway walls", "It destroys alveolar walls, reducing surface area", "It increases the number of alveoli", "It speeds up ventilation"], "a": 1, "e": "In emphysema, elastic tissue and alveolar walls break down, forming larger air sacs with a smaller total surface area."}, {"q": "A study finds a correlation between air pollution and asthma. What can you conclude?", "o": ["Air pollution causes asthma", "Asthma causes air pollution", "There is a link, but causation is not proved; other factors may be involved", "There is no link"], "a": 2, "e": "Correlation doesn't prove causation. Other variables must be controlled, or a causal mechanism shown."}, {"q": "Why do small mammals have a higher metabolic rate per gram than large mammals?", "o": ["They have a larger SA:V, so lose heat faster and must respire more to maintain body temperature", "They have more cells", "They have a smaller SA:V", "They are more active"], "a": 0, "e": "A large SA:V means faster heat loss relative to volume, so more respiration is needed per gram to keep warm."}]}, {"id": "3.3b", "order": 9, "section": "3.3", "spec": "3.3.3", "title": "Digestion and absorption", "desc": "Digestive enzymes for carbohydrates, proteins and lipids, bile salts and micelles, and absorption of digestion products in the ileum.", "practicals": [], "summary": [{"h": "What digestion does", "p": ["In mammals, large biological molecules are **hydrolysed** into smaller molecules that can be **absorbed** across cell membranes."]}, {"h": "Carbohydrate digestion", "p": ["**Amylase** (from salivary glands and pancreas) hydrolyses **starch** into **maltose** by breaking glycosidic bonds.", "**Membrane-bound disaccharidases** on the ileum epithelium hydrolyse disaccharides into monosaccharides: **maltase** (maltose → glucose), **sucrase** (sucrose → glucose + fructose), **lactase** (lactose → glucose + galactose)."]}, {"h": "Protein digestion", "p": ["**Endopeptidases** hydrolyse peptide bonds **within** a polypeptide, making more ends for exopeptidases.", "**Exopeptidases** hydrolyse peptide bonds at the **ends** of polypeptides, removing single amino acids.", "**Membrane-bound dipeptidases** hydrolyse the bond between two amino acids in a dipeptide."]}, {"h": "Lipid digestion", "p": ["**Bile salts** (made in the liver) **emulsify** lipids into small droplets. This increases the surface area for **lipase** to act on.", "**Lipase** (from the pancreas) hydrolyses the **ester bonds** in triglycerides, producing **monoglycerides** and **fatty acids**.", "Bile salts, monoglycerides and fatty acids form **micelles**, which carry the products to the epithelial cells."]}, {"h": "Absorption in the ileum", "p": ["**Glucose and amino acids**: absorbed by **co-transport** with Na⁺ (see Transport across membranes), then leave by facilitated diffusion into the blood.", "**Monoglycerides and fatty acids**: micelles release them near the epithelium. Being lipid-soluble, they **diffuse** across the cell-surface membrane.", "Inside the cell, they are recombined into **triglycerides** at the **smooth ER** and modified in the **Golgi**. They are combined with proteins and cholesterol to form **chylomicrons**.", "Chylomicrons leave by **exocytosis** and enter **lacteals** (lymphatic vessels), eventually reaching the blood.", "Ileum adaptations: **villi** and **microvilli** give a large surface area, there is a thin epithelium, many capillaries maintain gradients, and many mitochondria provide ATP for active transport."]}], "pitfalls": ["Bile salts **emulsify**. They are not enzymes and don't hydrolyse anything.", "Endopeptidases cut **within** the chain. Exopeptidases cut at the **ends**.", "Disaccharidases and dipeptidases are **membrane-bound** on the epithelium of the ileum, not secreted into the lumen.", "Lipid digestion products enter cells by **simple diffusion**, not co-transport."], "questions": [{"q": "What is the purpose of digestion?", "o": ["To build large molecules for storage", "To hydrolyse large molecules into small ones that can be absorbed", "To produce ATP", "To make enzymes"], "a": 1, "e": "Large molecules can't cross cell membranes, so they are hydrolysed into smaller soluble molecules for absorption."}, {"q": "Which enzyme hydrolyses starch to maltose?", "o": ["Amylase", "Maltase", "Lipase", "Sucrase"], "a": 0, "e": "Amylase from the salivary glands and pancreas breaks glycosidic bonds in starch, producing maltose."}, {"q": "Where are maltase, sucrase and lactase found?", "o": ["Secreted by the stomach", "Secreted by the liver", "Bound to the cell-surface membranes of epithelial cells in the ileum", "In bile"], "a": 2, "e": "These disaccharidases are membrane-bound, so disaccharides are hydrolysed right where the products are absorbed."}, {"q": "What are the products of lactose hydrolysis?", "o": ["Two glucose molecules", "Glucose and fructose", "Fructose and galactose", "Glucose and galactose"], "a": 3, "e": "Lactase hydrolyses lactose into glucose and galactose."}, {"q": "Sucrase hydrolyses sucrose into:", "o": ["Glucose and fructose", "Glucose and galactose", "Two glucose molecules", "Maltose"], "a": 0, "e": "Sucrose is glucose joined to fructose, so its hydrolysis releases those two monosaccharides."}, {"q": "What do endopeptidases do?", "o": ["Remove amino acids from the ends of a polypeptide", "Hydrolyse peptide bonds within a polypeptide chain", "Hydrolyse dipeptides", "Join amino acids together"], "a": 1, "e": "Endopeptidases hydrolyse internal peptide bonds, splitting polypeptides into shorter chains."}, {"q": "Why does the action of endopeptidases speed up protein digestion overall?", "o": ["They produce more ends for exopeptidases to act on", "They make amino acids", "They emulsify proteins", "They raise the temperature"], "a": 0, "e": "Breaking chains in the middle creates more terminal ends, so exopeptidases have more places to work."}, {"q": "What do exopeptidases do?", "o": ["Hydrolyse ester bonds", "Hydrolyse bonds inside the chain", "Hydrolyse peptide bonds at the ends of polypeptides, releasing single amino acids", "Hydrolyse glycosidic bonds"], "a": 2, "e": "Exopeptidases remove terminal amino acids one at a time."}, {"q": "Where are dipeptidases found?", "o": ["In saliva", "In bile", "In the stomach", "On the cell-surface membrane of ileum epithelial cells"], "a": 3, "e": "Dipeptidases are membrane-bound, hydrolysing dipeptides into amino acids at the absorption surface."}, {"q": "What is the role of bile salts in lipid digestion?", "o": ["They hydrolyse ester bonds", "They emulsify lipids into smaller droplets, increasing surface area for lipase", "They absorb fatty acids", "They form chylomicrons"], "a": 1, "e": "Bile salts break large fat globules into small droplets (emulsification), giving lipase a larger surface area."}, {"q": "What are the products of lipase action on triglycerides?", "o": ["Glycerol only", "Amino acids", "Monoglycerides and fatty acids", "Glucose"], "a": 2, "e": "Lipase hydrolyses ester bonds in triglycerides, producing monoglycerides and fatty acids."}, {"q": "Which bonds does lipase hydrolyse?", "o": ["Ester bonds", "Glycosidic bonds", "Peptide bonds", "Hydrogen bonds"], "a": 0, "e": "Fatty acids are attached to glycerol by ester bonds, which lipase hydrolyses."}, {"q": "What are micelles?", "o": ["Enzymes that digest fat", "Lymph vessels in villi", "Proteins that carry glucose", "Structures of bile salts, monoglycerides and fatty acids that carry lipid products to the epithelium"], "a": 3, "e": "Micelles are tiny water-soluble structures that move lipid digestion products to the epithelial cells, where they are released."}, {"q": "How do monoglycerides and fatty acids enter ileum epithelial cells?", "o": ["By co-transport with sodium", "By simple diffusion across the membrane", "By active transport", "By osmosis"], "a": 1, "e": "They are lipid-soluble, so they diffuse directly across the phospholipid bilayer."}, {"q": "Where are triglycerides reformed inside ileum epithelial cells?", "o": ["In the nucleus", "In mitochondria", "At the smooth endoplasmic reticulum", "In lysosomes"], "a": 2, "e": "Smooth ER recombines monoglycerides and fatty acids into triglycerides. The Golgi then helps form chylomicrons."}, {"q": "What are chylomicrons?", "o": ["Vesicles of triglycerides combined with proteins and cholesterol", "Micelles in the lumen", "Enzymes in the pancreas", "Types of villi"], "a": 0, "e": "Chylomicrons are lipoprotein particles containing triglycerides, cholesterol and protein. They are released by exocytosis."}, {"q": "Chylomicrons leave epithelial cells by exocytosis and enter:", "o": ["Capillaries directly", "Lacteals (lymphatic vessels)", "The lumen of the ileum", "The liver directly"], "a": 1, "e": "Chylomicrons are too large to enter blood capillaries, so they enter lacteals and travel in lymph before reaching the blood."}, {"q": "How are amino acids absorbed into ileum epithelial cells?", "o": ["Simple diffusion through the bilayer", "In micelles", "Endocytosis", "Co-transport with sodium ions"], "a": 3, "e": "Like glucose, amino acids are absorbed by sodium-dependent co-transport."}, {"q": "Why do ileum epithelial cells contain many mitochondria?", "o": ["To provide ATP for active transport, such as the sodium-potassium pump", "To digest proteins", "To make bile", "To store fat"], "a": 0, "e": "Active transport of Na⁺ out of the cell needs ATP, which maintains the gradient for co-transport."}, {"q": "How do villi and microvilli improve absorption?", "o": ["They secrete enzymes", "They produce bile", "They greatly increase surface area", "They make the epithelium thicker"], "a": 2, "e": "Villi are folds of the ileum wall. Microvilli are folds of the cell membrane. Both increase the area for absorption."}, {"q": "A person lacks lactase. Which disaccharide can they not digest?", "o": ["Maltose", "Sucrose", "Starch", "Lactose"], "a": 3, "e": "Without lactase, lactose stays undigested, so it can't be absorbed. This causes lactose intolerance symptoms."}, {"q": "Which statement about bile salts is correct?", "o": ["They are made in the pancreas and are enzymes", "They are made in the liver and are not enzymes", "They hydrolyse triglycerides", "They are absorbed with glucose"], "a": 1, "e": "Bile salts are made in the liver and stored in the gall bladder. They emulsify lipids and form micelles, but they don't catalyse reactions."}]}, {"id": "3.3c", "order": 10, "section": "3.3", "spec": "3.3.4.1", "title": "Mass transport in animals", "desc": "Haemoglobin and oxygen dissociation curves, the Bohr effect, the circulatory system, the heart and cardiac cycle, blood vessels and tissue fluid.", "practicals": [5], "summary": [{"h": "Haemoglobin", "p": ["Haemoglobin has **quaternary structure**: four polypeptides, each with a **haem group** containing **Fe²⁺**. Each molecule can carry **four O₂**.", "**Loading** (association) happens in the lungs, where pO₂ is high. **Unloading** (dissociation) happens in respiring tissues, where pO₂ is low.", "**Cooperative binding**: once one O₂ binds, haemoglobin changes shape, making it easier for further O₂ to bind. This gives the **S-shaped (sigmoid) curve**."]}, {"h": "Oxygen dissociation curves", "p": ["The curve plots **% saturation** against **partial pressure of O₂ (pO₂)**.", "**Curve shifted left**: higher affinity, loads O₂ more readily at low pO₂. Seen in organisms in low-oxygen environments (e.g. lugworms, llamas at altitude) and fetal haemoglobin.", "**Curve shifted right**: lower affinity, unloads O₂ more readily. Seen in small, active animals with a high metabolic rate.", "**Bohr effect**: higher CO₂ concentration lowers blood pH, which changes haemoglobin's shape and **lowers its affinity**. The curve **shifts right**, so more O₂ is unloaded in active tissues."]}, {"h": "Circulatory system", "p": ["Mammals have a **double circulation**: the pulmonary circuit (heart to lungs) and systemic circuit (heart to body). Blood passes through the heart twice per circuit.", "Know the main vessels: **coronary arteries** (supply heart muscle), **aorta** and **vena cava**, **pulmonary artery** and **pulmonary vein**, **renal artery** and **renal vein**."]}, {"h": "The heart and the cardiac cycle", "p": ["Blood flow: vena cava → right atrium → right ventricle → pulmonary artery → lungs → pulmonary vein → left atrium → left ventricle → aorta.", "**Atrioventricular valves** stop backflow from ventricles to atria. **Semilunar valves** stop backflow from arteries to ventricles. Valves open and close because of **pressure differences**.", "**Atrial systole**: atria contract, pushing blood into ventricles. **Ventricular systole**: ventricles contract, AV valves close, semilunar valves open, blood is forced into arteries. **Diastole**: muscle relaxes, semilunar valves close, blood fills the atria.", "`Cardiac output = stroke volume × heart rate`"]}, {"h": "Blood vessels", "p": ["**Arteries**: thick muscular walls and **elastic tissue**, which stretches and recoils to smooth out pressure. Narrow lumen. Carry blood at high pressure away from the heart.", "**Arterioles**: muscle contracts or relaxes to control blood flow to tissues.", "**Veins**: thin walls, wide lumen, and **valves** to prevent backflow. Low pressure.", "**Capillaries**: walls one cell thick (**endothelium**), narrow lumen, and huge numbers, giving a large surface area and short diffusion distance."]}, {"h": "Tissue fluid", "p": ["At the **arteriole end** of a capillary, **hydrostatic pressure** is higher than the water potential effect from plasma proteins. Fluid (water and small molecules) is forced out, forming **tissue fluid**.", "Large plasma proteins stay in the blood, so water potential in the capillary is lower. At the **venule end**, hydrostatic pressure has fallen, so water returns by **osmosis**.", "Excess tissue fluid drains into the **lymphatic system** and returns to the blood."]}, {"h": "Cardiovascular disease", "p": ["Risk factors include smoking, high blood pressure, high blood cholesterol, and a diet high in salt or saturated fat.", "Analyse data on risk factors carefully: separate correlation from causation, and note sample sizes."]}], "pitfalls": ["Write **partial pressure** of oxygen, not 'oxygen concentration', when describing dissociation curves.", "A curve shifted **right** means **lower affinity**, so more unloading. Shifted **left** means **higher affinity**.", "Valves open and close due to **pressure differences**. Don't say the heart 'opens' them.", "Arteries have elastic tissue to **maintain and smooth pressure**. They don't 'pump' blood."], "questions": [{"q": "How many oxygen molecules can one haemoglobin molecule carry?", "o": ["One", "Two", "Four", "Eight"], "a": 2, "e": "Haemoglobin has four haem groups, each with Fe²⁺ that binds one O₂ molecule."}, {"q": "Why is the oxygen dissociation curve for haemoglobin S-shaped?", "o": ["Cooperative binding: once one O₂ binds, haemoglobin changes shape and binds more O₂ more easily", "Haemoglobin denatures at high pO₂", "Oxygen is used up", "Fe²⁺ is oxidised"], "a": 0, "e": "The first O₂ binds with difficulty. It changes the shape of haemoglobin, so the second and third bind more easily. The curve is steep in the middle."}, {"q": "Where does haemoglobin load oxygen?", "o": ["In respiring tissues where pO₂ is low", "In the lungs where pO₂ is high", "In the liver", "In the heart muscle"], "a": 1, "e": "In the lungs, pO₂ is high, so haemoglobin has a high saturation (association)."}, {"q": "What does a dissociation curve shifted to the left indicate?", "o": ["Lower affinity for oxygen", "No change in affinity", "More CO₂ present", "Higher affinity for oxygen"], "a": 3, "e": "A left-shifted curve reaches high saturation at lower pO₂, so the haemoglobin has a higher affinity for O₂."}, {"q": "Why does a lugworm living in low-oxygen mud have a left-shifted curve?", "o": ["Its haemoglobin can load oxygen at low partial pressures", "It needs to unload oxygen more easily", "It respires anaerobically only", "It has no haemoglobin"], "a": 0, "e": "Higher affinity lets its haemoglobin become saturated even where pO₂ is low."}, {"q": "What is the Bohr effect?", "o": ["Haemoglobin binds more O₂ in the presence of CO₂", "Increased CO₂ lowers haemoglobin's affinity for O₂, shifting the curve right", "Oxygen dissolves in plasma", "Fetal haemoglobin has a higher affinity"], "a": 1, "e": "CO₂ forms carbonic acid, lowering pH. Haemoglobin changes shape and releases O₂ more readily, which helps active tissues."}, {"q": "Why is the Bohr effect an advantage during exercise?", "o": ["More O₂ is loaded in the muscles", "Less CO₂ is produced", "More O₂ is unloaded to respiring muscles, where CO₂ concentration is high", "Breathing rate falls"], "a": 2, "e": "Active muscles produce more CO₂, so haemoglobin's affinity falls there and more O₂ is released where it is needed."}, {"q": "Small mammals with a high metabolic rate have curves shifted to the:", "o": ["Right, so O₂ is unloaded more easily", "Left, so O₂ is loaded more easily", "Neither, all mammals are the same", "Left, so O₂ is unloaded more easily"], "a": 0, "e": "A right shift (lower affinity) releases O₂ more readily to cells respiring rapidly."}, {"q": "Why does fetal haemoglobin have a higher affinity for O₂ than adult haemoglobin?", "o": ["The fetus doesn't need oxygen", "So it can load O₂ from the mother's blood in the placenta, where pO₂ is relatively low", "Fetal blood has more CO₂", "Fetal haemoglobin has more Fe²⁺"], "a": 1, "e": "At the placenta, the mother's haemoglobin unloads O₂ and fetal haemoglobin loads it, which needs a higher affinity."}, {"q": "Which blood vessel carries oxygenated blood from the lungs to the heart?", "o": ["Pulmonary artery", "Vena cava", "Aorta", "Pulmonary vein"], "a": 3, "e": "The pulmonary vein carries oxygenated blood from the lungs to the left atrium."}, {"q": "Which vessels supply the heart muscle with blood?", "o": ["Pulmonary arteries", "Coronary arteries", "Renal arteries", "Vena cava"], "a": 1, "e": "Coronary arteries branch from the aorta and supply oxygenated blood to the cardiac muscle."}, {"q": "Why is the left ventricle wall thicker than the right?", "o": ["It receives more blood", "It pumps blood to the lungs", "It must generate higher pressure to pump blood around the whole body", "It contains the pacemaker"], "a": 2, "e": "The left ventricle pumps blood through the systemic circuit, which needs more force. The right only pumps to the nearby lungs."}, {"q": "During ventricular systole, what happens to the valves?", "o": ["Atrioventricular valves close and semilunar valves open", "Both sets open", "Atrioventricular valves open and semilunar valves close", "Both sets close"], "a": 0, "e": "Ventricular pressure exceeds atrial pressure, closing the AV valves, and exceeds arterial pressure, opening the semilunar valves."}, {"q": "What causes heart valves to open and close?", "o": ["Nerve impulses to the valves", "Muscles in the valves", "Hormones", "Differences in blood pressure on either side"], "a": 3, "e": "Valves open when pressure behind them is higher than in front, and close when pressure in front is higher."}, {"q": "Stroke volume is 70 cm³ and heart rate is 72 beats per minute. What is cardiac output?", "o": ["142 cm³ min⁻¹", "5040 cm³ min⁻¹", "1.03 cm³ min⁻¹", "504 cm³ min⁻¹"], "a": 1, "e": "Cardiac output = stroke volume × heart rate = 70 × 72 = 5040 cm³ min⁻¹."}, {"q": "Why do arteries contain elastic tissue?", "o": ["To help blood flow back to the heart", "To allow exchange of substances", "To stretch and recoil, maintaining and smoothing blood pressure", "To pump blood"], "a": 2, "e": "Elastic fibres stretch during systole and recoil in diastole. This evens out pressure surges and keeps blood flowing."}, {"q": "Why do veins have valves?", "o": ["To prevent backflow of blood at low pressure", "To increase blood pressure", "To allow exchange", "To pump blood"], "a": 0, "e": "Blood in veins is at low pressure. Valves stop it flowing backwards, and contraction of nearby muscles helps push it on."}, {"q": "How are capillaries adapted for exchange?", "o": ["Thick muscular walls", "Elastic tissue", "Valves", "Walls one cell thick and a very large total surface area"], "a": 3, "e": "The endothelium is one cell thick, giving a short diffusion distance. Capillary networks give a huge surface area."}, {"q": "What forces fluid out of capillaries at the arteriole end?", "o": ["Osmosis", "High hydrostatic pressure", "Active transport", "Low water potential in the tissues"], "a": 1, "e": "Hydrostatic pressure from the heart is high at the arteriole end, forcing water and small molecules out to form tissue fluid."}, {"q": "Why does water return to the capillary at the venule end?", "o": ["Hydrostatic pressure has risen", "Plasma proteins leave the capillary", "Hydrostatic pressure has fallen, and plasma proteins keep the water potential in the capillary low, so water returns by osmosis", "Active transport of water"], "a": 2, "e": "Proteins remain in the blood, keeping its water potential low. With lower hydrostatic pressure at the venule end, osmosis brings water back."}, {"q": "What happens to excess tissue fluid that doesn't return to the capillaries?", "o": ["It drains into the lymphatic system and returns to the blood", "It is excreted", "It forms urine", "It stays in the tissues"], "a": 0, "e": "Excess tissue fluid enters lymph vessels and is returned to the blood near the heart."}, {"q": "Which is a risk factor for cardiovascular disease?", "o": ["Low blood pressure", "Regular exercise", "Low salt intake", "High blood cholesterol"], "a": 3, "e": "High cholesterol, smoking, high blood pressure and a diet high in saturated fat or salt all increase the risk."}]}, {"id": "3.3d", "order": 11, "section": "3.3", "spec": "3.3.4.2", "title": "Mass transport in plants", "desc": "Movement of water in xylem by cohesion-tension, factors affecting transpiration, potometers, and translocation in phloem by mass flow.", "practicals": [], "summary": [{"h": "Xylem and the cohesion-tension theory", "p": ["Xylem vessels are long tubes of dead cells with no end walls, strengthened by **lignin**. They carry water and mineral ions upward.", "Water **evaporates** from mesophyll cells into air spaces and diffuses out through **stomata** (transpiration). This lowers water potential in the leaf cells.", "Water moves from the xylem into leaf cells by osmosis, creating **tension** (negative pressure) in the xylem.", "**Hydrogen bonds** make water molecules **cohesive**, so a **continuous column** of water is pulled up the xylem.", "**Adhesion** of water to the xylem walls also helps."]}, {"h": "Evidence for cohesion-tension", "p": ["Tree trunk diameter **decreases** during the day, when transpiration and tension are highest.", "If a xylem vessel is broken, **air is drawn in** rather than water leaking out, and the plant can no longer draw water up that vessel because the column is broken."]}, {"h": "Transpiration and the potometer", "p": ["Transpiration rate **increases** with higher **light intensity** (more stomata open), higher **temperature**, more **wind** (removes water vapour), and **lower humidity** (steeper water potential gradient).", "A **potometer** measures **water uptake**, which is close to (but not the same as) water lost, because some water is used in photosynthesis and to keep cells turgid.", "Set up the potometer **underwater** and cut the shoot **at a slant underwater**, so no air enters the xylem. Seal joints with petroleum jelly.", "Rate of water uptake = distance the air bubble moves × πr² of the capillary ÷ time."]}, {"h": "Phloem and translocation", "p": ["Phloem has **sieve tube elements** (no nucleus, few organelles, sieve plates) and **companion cells** (many mitochondria) that support them.", "**Translocation** moves organic substances such as **sucrose** from **sources** (e.g. leaves) to **sinks** (e.g. roots, growing regions, storage organs), in both directions."]}, {"h": "Mass flow hypothesis", "p": ["At the source, **companion cells actively load sucrose** into sieve tubes (using ATP, via co-transport with H⁺).", "This **lowers the water potential** in the sieve tube, so water enters by **osmosis** from the xylem, increasing **hydrostatic pressure**.", "At the sink, sucrose is **unloaded** and used in respiration or stored as starch. Water potential rises, water leaves, and hydrostatic pressure falls.", "The **pressure gradient** from source to sink pushes the solution along (**mass flow**)."]}, {"h": "Evidence for translocation", "p": ["**Ringing experiments**: removing a ring of bark (including phloem) causes the bark **above the ring to swell** with sugars that can't move down. Xylem is unaffected.", "**Tracer experiments**: radioactive ¹⁴CO₂ given to a leaf is fixed into sugars. **Autoradiographs** show the label in the phloem and moving to sinks.", "Aphid mouthparts inserted into phloem show sap flowing out under pressure, faster nearer the leaves.", "Against mass flow: sugar moves to many sinks at different rates, and sieve plates would slow flow."]}], "pitfalls": ["Transpiration is **evaporation** from leaves. Cohesion-tension explains how the water then moves up.", "Potometers measure **water uptake**, not transpiration directly.", "Active transport is used at the **source** to load sucrose. Mass flow itself is passive, driven by the pressure gradient.", "Xylem is dead and carries water upward only. Phloem is living and carries sugars both up and down."], "questions": [{"q": "What strengthens the walls of xylem vessels?", "o": ["Cellulose only", "Lignin", "Murein", "Chitin"], "a": 1, "e": "Lignin waterproofs and strengthens xylem walls, so they don't collapse under tension."}, {"q": "Where does transpiration mainly happen?", "o": ["Evaporation of water from leaves, mostly through stomata", "Uptake of water by roots", "Movement of sucrose in phloem", "Loss of water through bark"], "a": 0, "e": "Water evaporates from mesophyll cell surfaces into air spaces and diffuses out of the leaf through stomata."}, {"q": "What property of water allows a continuous column to be pulled up the xylem?", "o": ["High specific heat capacity", "Being a solvent", "Cohesion due to hydrogen bonds between water molecules", "High latent heat of vaporisation"], "a": 2, "e": "Hydrogen bonds hold water molecules together, so when water is lost at the top, the whole column is pulled upward."}, {"q": "According to the cohesion-tension theory, what creates tension in the xylem?", "o": ["Root pressure", "Active transport of water", "Gravity", "Water lost by transpiration, so water is pulled from the xylem into leaf cells"], "a": 3, "e": "Evaporation from leaves lowers water potential there. Water moves out of the xylem, pulling the column up under tension."}, {"q": "Why does a tree trunk get slightly narrower during the day?", "o": ["Transpiration is high, so tension in the xylem pulls the walls inward", "Phloem empties", "The bark dries out", "Water is stored in roots"], "a": 0, "e": "High transpiration in daylight increases tension, pulling xylem walls inward and reducing trunk diameter."}, {"q": "When a xylem vessel is cut, air is drawn in rather than water leaking out. What does this suggest?", "o": ["Xylem is under positive pressure", "The water column is under tension", "Xylem contains no water", "Phloem drives water movement"], "a": 1, "e": "If the water was under tension (negative pressure), breaking the vessel lets air rush in. This supports cohesion-tension."}, {"q": "Which change would decrease the rate of transpiration?", "o": ["Increasing wind speed", "Increasing temperature", "Increasing humidity", "Increasing light intensity"], "a": 2, "e": "Higher humidity reduces the water potential gradient between the inside of the leaf and the air, so less water diffuses out."}, {"q": "Why does wind increase the rate of transpiration?", "o": ["It closes stomata", "It cools the leaf", "It increases humidity around the leaf", "It removes water vapour from around the leaf, keeping the gradient steep"], "a": 3, "e": "Wind blows away moist air near the stomata, maintaining a steep water potential gradient."}, {"q": "Why does increasing light intensity increase transpiration?", "o": ["More stomata open to let CO₂ in for photosynthesis", "It reduces humidity", "It decreases temperature", "It closes stomata"], "a": 0, "e": "Stomata open in light so CO₂ can enter. Open stomata also allow more water vapour to escape."}, {"q": "What does a potometer actually measure?", "o": ["Rate of photosynthesis", "Rate of water uptake", "Rate of transpiration exactly", "Rate of sucrose transport"], "a": 1, "e": "A potometer measures water uptake. Some water taken up is used in photosynthesis or for turgor, so it isn't exactly equal to water lost."}, {"q": "Why is the shoot cut underwater when setting up a potometer?", "o": ["To stop stomata closing", "To clean the stem", "To prevent air entering the xylem and breaking the water column", "To keep the leaf cool"], "a": 2, "e": "Air bubbles would break the continuous column of water, stopping water uptake."}, {"q": "An air bubble moves 15 mm in 5 minutes along a capillary with radius 0.5 mm. What is the rate of water uptake?", "o": ["3.0 mm³ min⁻¹", "11.8 mm³ min⁻¹", "1.5 mm³ min⁻¹", "2.4 mm³ min⁻¹"], "a": 3, "e": "Volume = πr²h = 3.14 × 0.5² × 15 = 11.8 mm³. Rate = 11.8 ÷ 5 = 2.4 mm³ min⁻¹."}, {"q": "What is translocation?", "o": ["Movement of water in xylem", "Movement of organic substances such as sucrose from sources to sinks in the phloem", "Movement of mineral ions into roots", "Evaporation from leaves"], "a": 1, "e": "Translocation is the energy-requiring movement of assimilates, mainly sucrose, through phloem from sources to sinks."}, {"q": "Which is an example of a sink?", "o": ["A mature photosynthesising leaf", "The xylem", "A growing root tip", "The stomata"], "a": 2, "e": "Sinks use or store sugars, e.g. roots, growing tips, fruits and storage organs. Leaves that photosynthesise are sources."}, {"q": "How is sucrose loaded into sieve tubes at the source?", "o": ["By active transport from companion cells, using ATP", "By osmosis", "By simple diffusion through the bilayer", "By evaporation"], "a": 0, "e": "Companion cells actively load sucrose into sieve tubes, so these cells have many mitochondria."}, {"q": "Why does water enter the phloem at the source?", "o": ["Hydrostatic pressure is lower there", "Sucrose loading lowers water potential, so water enters by osmosis from the xylem", "Active transport of water", "Transpiration pulls it in"], "a": 1, "e": "High sucrose concentration lowers the water potential in sieve tubes, so water enters by osmosis, raising hydrostatic pressure."}, {"q": "What drives the movement of phloem sap in the mass flow hypothesis?", "o": ["Tension from transpiration", "Gravity", "Active pumping by sieve plates", "A hydrostatic pressure gradient from source to sink"], "a": 3, "e": "High pressure at the source and low pressure at the sink push the solution along the phloem by mass flow."}, {"q": "In a ringing experiment, a ring of bark and phloem is removed. What is observed?", "o": ["The tissue above the ring swells, because sugars can't move down past the ring", "The leaves wilt immediately", "The tissue below the ring swells", "Nothing happens"], "a": 0, "e": "Sugars accumulate above the ring. Xylem is deeper and unaffected, so water still reaches the leaves."}, {"q": "How do tracer experiments show that sugars move in phloem?", "o": ["Dye is seen in xylem", "Leaves turn yellow", "Radioactive ¹⁴C from ¹⁴CO₂ given to a leaf appears in the phloem and moves to sinks", "Sugars are seen in roots only"], "a": 2, "e": "¹⁴CO₂ is fixed into radioactive sugars in photosynthesis. Autoradiographs show the label in phloem tissue and travelling to sinks."}, {"q": "Which observation is evidence AGAINST the mass flow hypothesis?", "o": ["Sap flows out of aphid mouthparts under pressure", "Removing a ring of bark causes swelling above it", "Sugars travel to many different sinks at different rates", "Radioactive sugars appear in the phloem"], "a": 2, "e": "Mass flow predicts a single flow down a pressure gradient. Different rates to different sinks are hard to explain this way."}, {"q": "Why do companion cells contain many mitochondria?", "o": ["To photosynthesise", "To provide ATP for active loading of sucrose", "To store sucrose", "To transport water"], "a": 1, "e": "Active transport of sucrose into sieve tubes needs a lot of ATP, produced by aerobic respiration."}, {"q": "Which statement correctly compares xylem and phloem?", "o": ["Xylem carries sugars and phloem carries water", "Xylem is dead and carries water upward; phloem is living and carries sugars in both directions", "Both are made of living cells", "Phloem is strengthened by lignin"], "a": 1, "e": "Xylem vessels are dead, lignified tubes moving water and ions upward. Phloem sieve tubes are living and carry organic substances both ways."}]}, {"id": "3.4a", "order": 12, "section": "3.4", "spec": "3.4.1–3.4.2", "title": "DNA, genes and protein synthesis", "desc": "DNA in prokaryotes and eukaryotes, genes, the genetic code, introns and exons, mRNA and tRNA, transcription, splicing and translation.", "practicals": [], "summary": [{"h": "DNA in different cells", "p": ["**Eukaryotic** nuclear DNA is **long, linear** and associated with **histone** proteins. Together they form **chromosomes**.", "**Prokaryotic** DNA is **short, circular** and **not associated with histones**.", "**Mitochondria and chloroplasts** contain DNA that is like prokaryotic DNA: short, circular, no histones."]}, {"h": "Genes and the genetic code", "p": ["A **gene** is a base sequence of DNA that codes for the amino acid sequence of a **polypeptide**, or for a **functional RNA** (e.g. rRNA, tRNA).", "A gene occupies a fixed position on a chromosome, called a **locus**.", "A sequence of three bases, a **triplet**, codes for one amino acid.", "The genetic code is **universal** (same in almost all organisms), **non-overlapping** (each base is read once), and **degenerate** (more than one triplet codes for most amino acids).", "Eukaryotic genes contain **introns** (non-coding) between **exons** (coding). Much nuclear DNA doesn't code for polypeptides, including **multiple repeats** between genes.", "**Genome**: the complete set of genes in a cell. **Proteome**: the full range of proteins the cell is able to produce."]}, {"h": "mRNA and tRNA", "p": ["**mRNA**: single-stranded, linear, made in transcription. It carries the code from DNA to ribosomes as **codons**.", "**tRNA**: single-stranded, folded into a **clover-leaf shape** held by hydrogen bonds. Has an **anticodon** at one end and an **amino acid binding site** at the other."]}, {"h": "Transcription", "p": ["DNA **helicase** breaks hydrogen bonds, so the strands separate at the gene.", "One strand acts as a **template**. Free RNA nucleotides line up by complementary base pairing (U pairs with A).", "**RNA polymerase** joins the nucleotides, forming phosphodiester bonds, to make **pre-mRNA**.", "In eukaryotes, **splicing** removes introns from pre-mRNA to form **mRNA**. In prokaryotes, transcription produces mRNA directly (no introns).", "mRNA leaves the nucleus through a **nuclear pore**."]}, {"h": "Translation", "p": ["mRNA attaches to a **ribosome**. The ribosome moves along to the **start codon**.", "A **tRNA** with a **complementary anticodon** brings the matching amino acid. Two tRNAs fit on the ribosome at once.", "A **peptide bond** forms between adjacent amino acids. This uses **ATP**, and is catalysed by an enzyme in the ribosome.", "The ribosome moves along one codon. The first tRNA is released and can collect another amino acid. This continues until a **stop codon**.", "The polypeptide may then be folded and modified, e.g. in the Golgi apparatus."]}], "pitfalls": ["**Codons** are on mRNA. **Anticodons** are on tRNA. Triplets are on DNA.", "Degenerate means **more than one triplet** for one amino acid, not 'one triplet for many amino acids'.", "Use **RNA polymerase** for transcription. DNA polymerase is only for replication.", "Splicing happens in **eukaryotes** only, since prokaryotic genes have no introns."], "questions": [{"q": "How does eukaryotic nuclear DNA differ from prokaryotic DNA?", "o": ["It is short and circular", "It is long, linear and associated with histones", "It is not found in chromosomes", "It contains uracil"], "a": 1, "e": "Eukaryotic nuclear DNA is long, linear and wrapped around histones. Prokaryotic DNA is short, circular and lacks histones."}, {"q": "DNA in mitochondria and chloroplasts is most similar to:", "o": ["Prokaryotic DNA: short, circular and not associated with histones", "Eukaryotic nuclear DNA", "Viral RNA", "Ribosomal RNA"], "a": 0, "e": "Mitochondrial and chloroplast DNA is short, circular and lacks histones, like prokaryotic DNA."}, {"q": "What is a gene?", "o": ["A molecule of mRNA", "A whole chromosome", "A base sequence of DNA that codes for a polypeptide or functional RNA", "A protein made in the ribosome"], "a": 2, "e": "A gene is a section of DNA at a particular locus that codes for a polypeptide or a functional RNA."}, {"q": "What is meant by the locus of a gene?", "o": ["The protein it codes for", "The number of bases it has", "Its alleles", "Its fixed position on a chromosome"], "a": 3, "e": "Each gene has a particular position on a particular chromosome, called its locus."}, {"q": "What does it mean that the genetic code is degenerate?", "o": ["Most amino acids are coded for by more than one triplet", "Each base is read only once", "The code is the same in all organisms", "The code changes over time"], "a": 0, "e": "There are 64 possible triplets but only 20 amino acids, so most amino acids have more than one triplet."}, {"q": "What does it mean that the genetic code is non-overlapping?", "o": ["Each triplet codes for many amino acids", "Each base is part of only one triplet", "All organisms use it", "There are stop codons"], "a": 1, "e": "Triplets are read one after another, so each base belongs to just one triplet."}, {"q": "What does it mean that the genetic code is universal?", "o": ["It is non-overlapping", "It has start codons", "The same triplets code for the same amino acids in almost all organisms", "It contains introns"], "a": 2, "e": "The same codon codes for the same amino acid in nearly all organisms, which is evidence of a common ancestor."}, {"q": "What are introns?", "o": ["Coding sequences in mRNA", "Start codons", "Sequences that are translated", "Non-coding sequences within a eukaryotic gene"], "a": 3, "e": "Introns are non-coding sections that separate exons. They are removed from pre-mRNA by splicing."}, {"q": "What is the proteome of a cell?", "o": ["The full range of proteins the cell is able to produce", "All the genes in the cell", "The number of ribosomes", "All the mRNA in the nucleus"], "a": 0, "e": "The genome is the complete set of genes. The proteome is the full range of proteins it can produce."}, {"q": "Which feature is found on tRNA but not on mRNA?", "o": ["Codons", "An anticodon and an amino acid binding site", "Uracil", "Ribose"], "a": 1, "e": "tRNA has an anticodon and an amino acid binding site, folded into a clover-leaf shape by hydrogen bonds. Both RNAs contain ribose and uracil."}, {"q": "Which enzyme joins RNA nucleotides during transcription?", "o": ["DNA polymerase", "Helicase", "RNA polymerase", "ATP synthase"], "a": 2, "e": "RNA polymerase joins RNA nucleotides along the template strand, forming phosphodiester bonds."}, {"q": "A DNA template strand reads TAC GGA. What is the mRNA sequence?", "o": ["TAC GGA", "ATG CCT", "UAC GGA", "AUG CCU"], "a": 3, "e": "mRNA is complementary to the template, with U in place of T. T→A, A→U, C→G, G→C. TAC GGA gives AUG CCU."}, {"q": "What happens during splicing?", "o": ["Introns are removed from pre-mRNA, and exons are joined", "Exons are removed from mRNA", "tRNA is attached to amino acids", "DNA is replicated"], "a": 0, "e": "Splicing removes introns from pre-mRNA in eukaryotes, joining the exons to form mature mRNA."}, {"q": "Why do prokaryotes not need to splice their mRNA?", "o": ["They have no ribosomes", "Their genes do not contain introns", "They have no mRNA", "They translate DNA directly"], "a": 1, "e": "Prokaryotic genes have no introns, so transcription produces mRNA that can be translated straight away."}, {"q": "How does mRNA leave the nucleus?", "o": ["By diffusion through the membrane", "By exocytosis", "Through nuclear pores", "Using tRNA"], "a": 2, "e": "mRNA is too large to cross the membrane, so it exits through nuclear pores in the envelope."}, {"q": "An mRNA codon is AUG. What is the complementary tRNA anticodon?", "o": ["AUG", "TAC", "ATG", "UAC"], "a": 3, "e": "The anticodon is complementary to the codon: A–U, U–A, G–C. So AUG pairs with UAC."}, {"q": "What forms between adjacent amino acids on the ribosome?", "o": ["A peptide bond", "A hydrogen bond", "A glycosidic bond", "A phosphodiester bond"], "a": 0, "e": "Amino acids held by neighbouring tRNAs are joined by a peptide bond, catalysed by the ribosome and using ATP."}, {"q": "What role does ATP play in translation?", "o": ["It forms the anticodon", "It provides energy, e.g. to attach amino acids to tRNA and form peptide bonds", "It splices introns", "It unwinds DNA"], "a": 1, "e": "ATP provides energy for attaching amino acids to tRNA and for forming peptide bonds."}, {"q": "What ends translation?", "o": ["The ribosome reaches a stop codon", "All tRNA is used up", "The mRNA is degraded", "An intron is reached"], "a": 0, "e": "A stop codon doesn't code for an amino acid, so translation ends and the polypeptide is released."}, {"q": "A gene has 900 bases in its exons. Ignoring the stop codon, how many amino acids are in the polypeptide?", "o": ["900", "450", "3", "300"], "a": 3, "e": "Each amino acid is coded by three bases. 900 ÷ 3 = 300 amino acids."}, {"q": "Why might an mRNA molecule be shorter than the gene it came from in eukaryotes?", "o": ["Some exons are translated", "Introns have been removed by splicing", "RNA nucleotides are smaller", "tRNA removes bases"], "a": 1, "e": "The gene includes introns. These are spliced out, so mature mRNA is shorter than the gene."}, {"q": "What is the role of DNA helicase in transcription?", "o": ["It joins RNA nucleotides", "It removes introns", "It breaks hydrogen bonds between bases, separating the DNA strands at the gene", "It forms peptide bonds"], "a": 2, "e": "Helicase separates the two DNA strands so one can act as a template for mRNA."}]}, {"id": "3.4b", "order": 13, "section": "3.4", "spec": "3.4.3", "title": "Mutation and meiosis", "desc": "Gene mutations and mutagenic agents, chromosome mutations, the stages of meiosis, and how independent segregation and crossing over create variation.", "practicals": [], "summary": [{"h": "Gene mutations", "p": ["**Gene mutations** are changes in the base sequence of DNA. They happen spontaneously during **DNA replication**.", "**Substitution**: one base is replaced. Because the code is **degenerate**, it may not change the amino acid (a silent mutation). Otherwise one amino acid changes.", "**Deletion**: a base is lost. This causes a **frame shift**: every triplet after it changes, so many amino acids are altered.", "A changed amino acid sequence can change the **tertiary structure** of the protein, e.g. an enzyme's active site.", "**Mutagenic agents** increase the mutation rate, e.g. ionising radiation, UV light, benzene, and some chemicals in tobacco smoke."]}, {"h": "Chromosome mutations", "p": ["**Non-disjunction**: chromosomes or chromatids fail to separate during meiosis, so gametes have the wrong number of chromosomes.", "Example: an extra chromosome 21 causes **Down syndrome**. Changes in whole sets of chromosomes (polyploidy) are more common in plants."]}, {"h": "Meiosis", "p": ["Meiosis produces **four genetically different haploid** cells (gametes) from one diploid cell. It involves **two divisions**.", "**Meiosis I**: **homologous chromosomes** pair up and then **separate**, halving the chromosome number.", "**Meiosis II**: **sister chromatids** separate, as in mitosis.", "Diploid (2n) cells have two sets of chromosomes. Haploid (n) gametes have one set, so fertilisation restores the diploid number."]}, {"h": "Sources of genetic variation", "p": ["**Independent segregation**: in meiosis I, homologous pairs line up randomly at the equator, so each gamete gets a random mix of maternal and paternal chromosomes.", "`Number of possible combinations = 2ⁿ`, where n is the number of homologous pairs. For humans, 2²³ ≈ 8.4 million.", "**Crossing over**: in prophase I, chromatids of homologous chromosomes form **chiasmata** and exchange sections of DNA. This creates new combinations of alleles.", "**Random fertilisation**: any male gamete can fuse with any female gamete. Combinations from two parents = (2ⁿ)²."]}, {"h": "Meiosis vs mitosis", "p": ["Mitosis: one division, two identical diploid cells, used for growth and repair.", "Meiosis: two divisions, four genetically different haploid cells, used for sexual reproduction."]}], "pitfalls": ["A substitution doesn't always change the protein, because the code is **degenerate**.", "A deletion changes far more than a substitution, because of the **frame shift**.", "Homologous chromosomes separate in **meiosis I**. Sister chromatids separate in **meiosis II**.", "In 2ⁿ questions, n is the number of **homologous pairs**, not the total chromosomes."], "questions": [{"q": "What is a gene mutation?", "o": ["A change in the number of chromosomes", "A change in the base sequence of DNA", "A change in the shape of a chromosome", "Crossing over between chromosomes"], "a": 1, "e": "A gene mutation is any change in the base sequence of DNA, such as a substitution or deletion."}, {"q": "Why might a base substitution have no effect on the polypeptide?", "o": ["The genetic code is degenerate, so the new triplet may code for the same amino acid", "Substitutions happen only in introns", "The code is non-overlapping", "Substitutions are always repaired"], "a": 0, "e": "Most amino acids have several triplets, so a substitution may still give the same amino acid. This is a silent mutation."}, {"q": "Why does a deletion usually have a bigger effect than a substitution?", "o": ["It removes a whole gene", "It changes only one amino acid", "It causes a frame shift, so all following triplets change", "It changes the DNA to RNA"], "a": 2, "e": "Removing one base shifts the reading frame. Every triplet after it is read differently, so many amino acids change."}, {"q": "How can a gene mutation lead to a non-functional enzyme?", "o": ["It changes the enzyme's temperature", "It removes the enzyme's ribosomes", "It stops transcription completely", "It changes the amino acid sequence, which changes the tertiary structure and the active site"], "a": 3, "e": "A different primary structure may fold differently, so the active site is no longer complementary to the substrate."}, {"q": "Which of these is a mutagenic agent?", "o": ["Ultraviolet light", "Glucose", "Water", "Oxygen at normal concentration"], "a": 0, "e": "UV light, ionising radiation and some chemicals (e.g. benzene, some components of tobacco smoke) increase the mutation rate."}, {"q": "What is non-disjunction?", "o": ["A base substitution", "Failure of chromosomes or chromatids to separate in meiosis", "Crossing over between chromatids", "Random alignment of homologous pairs"], "a": 1, "e": "If chromosomes don't separate, some gametes get an extra chromosome and some get one fewer."}, {"q": "Down syndrome is caused by:", "o": ["A deletion in a gene", "Crossing over", "An extra copy of chromosome 21 due to non-disjunction", "A substitution in chromosome 21"], "a": 2, "e": "Non-disjunction in meiosis can produce a gamete with two copies of chromosome 21. After fertilisation, the cell has three."}, {"q": "How many cells does meiosis produce from one parent cell?", "o": ["Two diploid cells", "Two haploid cells", "One haploid cell", "Four haploid cells"], "a": 3, "e": "Two divisions produce four haploid cells, each genetically different."}, {"q": "What separates in meiosis I?", "o": ["Homologous chromosomes", "Sister chromatids", "Introns", "Centrioles only"], "a": 0, "e": "In meiosis I, homologous pairs separate, halving the chromosome number. Sister chromatids separate in meiosis II."}, {"q": "What separates in meiosis II?", "o": ["Homologous chromosomes", "Sister chromatids", "Whole sets of chromosomes", "Chiasmata"], "a": 1, "e": "Meiosis II is like mitosis: sister chromatids are pulled apart to opposite poles."}, {"q": "Why must gametes be haploid?", "o": ["So they can divide by mitosis", "So they contain more DNA", "So that fertilisation restores the diploid number", "So they can't mutate"], "a": 2, "e": "Two haploid gametes fuse to form a diploid zygote, keeping the chromosome number constant between generations."}, {"q": "What is independent segregation?", "o": ["Exchange of DNA between chromatids", "Separation of sister chromatids", "M
